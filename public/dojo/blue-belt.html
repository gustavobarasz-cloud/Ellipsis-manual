argument right after a label protect? What does the silence cost you?"}, {"name": "Connect (rung 5).", "md": "Write an accusation audit for your promotion conversation. Which accusation touches your W3 hidden commitment? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "Tactical empathy is empathy used for an outcome. In the personal dojo, when does a label become technique instead of witnessing?"}, {"name": "Test (rung 7).", "md": "Do the label minute with Claude or a friend. Before you start, predict where you will break into a question. Afterward, note what happened. Write what result would show labels did not open the conversation."}, {"name": "Catch it live (rung 8).", "md": "What do you feel in the silence after a label?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your labels, your audits or your ratings."}]}, {"n": 2, "title": "Part 2 · Bennett: empathy across difference", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Milton J. Bennett, an intercultural communication scholar, contrasted sympathy and empathy in \"Overcoming the Golden Rule\" (1979): the Golden Rule, treat others as you would like to be treated, assumes everyone is like you; empathy imagines the other's experience from their frame, which he summarized as a Platinum Rule. He also gives steps for empathy, ending with re-establishing yourself. Bennett later built the Developmental Model of Intercultural Sensitivity, taken up in Black Belt. What is distinctive here is that empathy starts by assuming difference, not sameness."}, {"t": "note", "label": "Why Bennett here", "md": "The module's empathy steps come from him, and the last one, re-establishing yourself, is the step that keeps empathy from becoming losing yourself."}, {"t": "note", "label": "Native use", "md": "Intercultural training and education."}, {"t": "note", "label": "Limit", "md": "Theory from intercultural communication practice (label: theory with case evidence). The steps are a teaching model, not a tested procedure."}, {"t": "h", "text": "Sympathy and empathy"}, {"t": "table", "head": ["", "Sympathy (Golden Rule)", "Empathy (Platinum Rule)"], "rows": [["Assumes", "They are like me", "They may differ from me"], ["Asks", "How would I feel?", "How do they experience this?"], ["Risk", "Projection", "Losing yourself, unless you re-establish yourself"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "As a third-culture kid, when did someone treat you \"as they would want to be treated\" and miss you completely?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: why does Bennett say the Golden Rule fails across difference?"}, {"name": "Make sense (rung 2).", "md": "Give one example of sympathy and one of empathy for the same situation. Then a non-example: empathy without re-establishing yourself."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you imagined someone's experience. For each, write whether you returned to your own view afterward. Only then rate how often you skip the last step, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does staying in their frame protect for you? What does it cost your own position?"}, {"name": "Connect (rung 5).", "md": "Link the last step to over-understanding from White Belt. State a guess and what would show it wrong. In your Orders Grid this sits in Heart with self."}, {"name": "Argue (rung 6).", "md": "Is Bennett's empathy possible across power gaps, for example toward someone who has power over you? What changes?"}, {"name": "Test (rung 7).", "md": "In one conversation this week, write their likely frame beforehand, then after it write your own view again in one sentence. Before you begin, predict whether your view will change. Afterward, record whether it did. Write what result would show you lost your own position."}, {"name": "Catch it live (rung 8).", "md": "What is the sign that you have stayed in their frame too long?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your episodes, your views or your ratings."}]}, {"n": 3, "title": "Part 3 · Singer and Klimecki: empathy, compassion and the boundary", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Tania Singer and Olga Klimecki, neuroscientists, distinguished empathy, feeling with another person, from compassion, feeling for them with warmth and a wish to help. Their research suggests that sharing another's distress can turn into empathic distress, which leads to withdrawal and burnout, while compassion training was linked to more positive feeling and helping. Paul Bloom's *Against Empathy* (2016) makes a related argument for general readers. What is distinctive is that caring about someone does not require taking on their feeling."}, {"t": "note", "label": "Why Singer and Klimecki here", "md": "The empathy boundary, understanding without agreeing, is this module's hardest line for you. This part gives a way to stay warm without being flooded."}, {"t": "note", "label": "Native use", "md": "Laboratory and training studies in affective neuroscience."}, {"t": "note", "label": "Limit", "md": "Tested research, with small samples in some studies and debate about how to define the terms (label: tested research). Bloom's argument is a popular book. Neither tells you when to hold a boundary; that judgment stays yours."}, {"t": "h", "text": "Three responses to someone's pain"}, {"t": "table", "head": ["Response", "What happens in you", "What it tends to lead to"], "rows": [["Empathic distress", "You feel their pain as yours", "Withdrawal, burnout, excusing"], ["Compassion", "Warmth and a wish to help", "Helping while staying steady"], ["Understanding plus boundary", "You grasp why, and still say no to the behavior", "Care without giving in"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "In psychiatric or medical sessions, how did you stay steady while rendering someone's pain? What did it cost you afterward?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: how do Singer and Klimecki distinguish empathy from compassion?"}, {"name": "Make sense (rung 2).", "md": "Write a \"validate the emotion, hold the boundary\" sentence. Then a non-example: a validation that cancels the boundary."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you understood someone so well you excused them. Only then rate how often empathy becomes distress for you, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does feeling someone's pain protect: the bond, your sense of being good? What does it cost?"}, {"name": "Connect (rung 5).", "md": "Pair this with Simon's over-intellectualization from W3 Part 2. State a guess and what would show it wrong. In your Orders Grid this sits in Heart with self and Body."}, {"name": "Argue (rung 6).", "md": "Bloom argues against empathy as a guide to action. What does that miss about friendship and interpreting?"}, {"name": "Test (rung 7).", "md": "Use one boundary sentence in a real moment where you tend to over-understand. Before you do, predict what you will feel. Afterward, record their words and your body. Write what result would show the boundary did not hold."}, {"name": "Catch it live (rung 8).", "md": "What is the first body sign that you are taking on someone's feeling?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your sentences, your episodes or your ratings."}]}], "connect": {"title": "Connect and argue: the three lenses side by side", "blocks": [{"t": "p", "md": "Everything in this section is Interpretation: my reading across the sources, to be tested against your episodes."}, {"t": "table", "head": ["Source", "Starts from", "Treats empathy as", "Would worry that you..."], "rows": [["Voss", "The negotiation", "A move that lowers tension", "Counter-argue after a label"], ["Bennett", "Cultural difference", "Imagining their frame", "Never come back to your own"], ["Singer and Klimecki", "The listener's state", "Something that can become distress", "Excuse what you understand"]]}, {"t": "p", "md": "**Where they meet.** Each separates understanding from agreement, in different words."}, {"t": "p", "md": "**Where they collide.** Voss uses empathy for an outcome; the I-Thou track, and Singer's compassion, put the outcome down. The dojo and the Sanctuary differ on purpose."}, {"t": "p", "md": "**What the three miss for you.** Brooks's illuminator, in this module's original text, adds accompaniment: being with someone without hurrying to fix. None of the three lenses covers it."}, {"t": "p", "md": "**Where it sits in your own frameworks.** Heart with self and Heart with others in your Orders Grid; in IFS terms, compassion is often described as a quality of Self. Return to this module later and add dated notes; do not overwrite."}]}, "research": {"title": "Research further: three threads to pick from", "blocks": [{"t": "p", "md": "These are gaps the sources left open. Replace them with your own questions whenever you have them."}, {"t": "table", "head": ["Thread", "Question it opens", "Why it connects", "Suggested depth"], "rows": [["1. Labels from another person", "Is there research on the effect of someone else naming your emotion, as distinct from naming it yourself?", "Part 1 borrows from self-labeling research", "One thread, researched with the research-brief skill"], ["2. Interpreter burnout", "What does research say about vicarious trauma and empathic distress in interpreters?", "Part 3 links to your work", "One thread, with a critic pass"], ["3. Empathy debates", "What are the strongest responses to Bloom's case against empathy?", "Part 3 cites a contested argument", "Full deepening of Part 3"]]}], "prompt": "Use curriculum-module in deepen mode on Blue Belt B5, Part {part}, one thread. My question: {q}. Why it pulled me: {why}. What I already think: {think}. Verify sources with research-brief first, write into the part's Deepened section, and do not write my entries."}}}}, {"id": "B6", "num": 6, "title": "Going First — Initiation & Early Friendship", "subtitle": "End the wait to be approached: lead with warmth, beat the liking gap, and invite depth in consented steps.", "guardrail": "Surveillance vs. Care: Govern every rep by the 4 I-Thou Cautions — (1) Drop the playbook if it feels mechanical; (2) Never extract depth without a Green Light; (3) Honor the Linear Ladder Myth (low battery is a season, not rejection); (4) Adapt for cultural and neurodivergent styles.", "assembly": [{"day": "Mon", "step": "Part 1 · Fiske & Cuddy", "ingredient": "2x2 Warmth–Competence Matrix & 30s Warmth Gate"}, {"day": "Tue", "step": "Part 2 · Epley & Boothby", "ingredient": "Liking Gap Mechanics, Stop-Signs & 4-Tier Initiation Menu"}, {"day": "Wed", "step": "Part 3 · Arthur Aron", "ingredient": "Responsiveness, Ping Calibration & Green/Yellow/Red Protocol"}, {"day": "Thu", "step": "Deliberate Practice Lab", "ingredient": "6-Scenario Ping & Return Calibration Simulator"}, {"day": "Fri", "step": "Deliverable Workshop", "ingredient": "Contact & Ping Log + Liking-Gap Calculator"}], "parts": [{"day": "Monday · Part 1", "author": "Susan Fiske & Amy Cuddy", "title": "Warmth Before Competence", "lens": "The Stereotype Content Model (Fiske, Cuddy, & Glick, 2002/2007; tested social psychology on group perception, applied by extension to individual first impressions, alongside Vanessa Van Edwards's popular synthesis). The model isolates the exact order in which human beings triage every new face they meet.", "mechanism": "Waiting to be approached leaves you standing behind a closed curtain, wondering why nobody knocks. Going first begins by flipping on the warm **porch light** before displaying your credentials. When an interpreter, accountant, or strategist walks into a new room, their sharpest reflex is to lead with **Competence**—precision, credentials, or an unsolicited fix. Evolution runs the triage in the exact opposite order. Before anyone cares how capable you are, their nervous system asks a faster, older question: **Warmth**—*Are you safe, and do you hold goodwill toward me?* Warmth carries the overwhelming weight of a first impression because a friend's competence is an asset, whereas an enemy's competence is a threat.\n\nLeading with high competence and low warmth drops you into the **Envy / Threat** quadrant—people brace, stiffen, and quietly keep their distance. Overcorrecting into high warmth and low competence—over-smiling, self-deprecating, or inflating compliments—drops you into **Pity / Dismissal**, eroding peer standing. The target is **High Warmth + High Competence**, entered strictly in sequence through the **30-Second Warmth Gate**: for the first thirty seconds, keep your credentials and corrections in your pocket; lead with an easy face, grounded shoulders, and one genuine remark about the shared room. In high-stakes or biased rooms where accent or status might invite premature doubt, run **Warmth First, Quiet Anchor Second**—one unhurried warm opener followed immediately by one crisp, grounded observation.", "tableTitle": "Fiske & Cuddy's 2×2 Warmth–Competence Matrix", "tableHead": ["Quadrant", "How You Open", "Emotion Triggered", "Behavioral Signals", "What It Costs / Earns"], "tableRows": [["Low Warmth + High Competence (Trap)", "Leading with credentials, unsolicited expertise, or corrections.", "Envy / Threat ('Are they ranking me?')", "Guarded posture, stiff voice, intellectual one-upmanship.", "People keep distance; sparks die immediately."], ["High Warmth + Low Competence (Fawning)", "Over-smiling, self-deprecation, inflated compliments.", "Pity / Dismissal ('Nice, not a peer.')", "Rushed approval-seeking, asking from below (W2 Diplomat).", "Feels fake or submissive; loses peer standing."], ["Low Warmth + Low Competence", "Closed off, phone out, flat affect, short answers.", "Contempt / Avoidance.", "Looking past them, minimal engagement.", "Ends contact before it begins."], ["High Warmth + High Competence (Target)", "Warmth first (easy face, curiosity), quiet competence second.", "Admiration / Trust ('Safe and capable.')", "Relaxed shoulders, grounded voice, clarity without proving.", "Opens door to both friendship and peer authority."]], "officeEx": "Joining a kickoff with a new senior stakeholder: \"Really glad to finally put a face to the name—your team's Q2 rollout looked smooth from our side. [Warmth Gate cleared.] On the timeline piece, I noticed one dependency we can clear early on slide 4. [Quiet Competence anchor.]\"", "personalEx": "At the gym or a neighborhood class, resist the Expert urge to offer form advice. Put your phone away, relax your face, and open on the shared moment: \"That last set looked brutal—how long have you been training here?\"", "nonEx": "Dropping hollow flattery (\"Oh my gosh, your form is literally inspiring—are you a pro?!\"—Fawning) OR correcting a minor date in the first two minutes (\"Actually, that was 2019, not 2020\"—Competence before Warmth).", "decisionRule": "Clear the 30-second Warmth Gate first in every social and collaborative entry, and **never shrink your competence to look warm**—warmth is ease and goodwill, not submission. Yet even once you know *how* to flip on the porch light, a quieter barrier keeps most people indoors—which Tuesday exposes with hard field data: *why going first feels far riskier in your head than it actually is on the street.*", "handoff": "Tag every initiation on your Friday **Contact Log** with **W-First** (warmth opener) vs. **C-Lead** (slipped into credentials/fixing) to track return energy.", "layer3Title": "Optional Deepening · Stephen Porges (The Polyvagal Theory)", "layer3Body": "Biologically, why must warmth arrive before competence? Stephen Porges's **Social Engagement System** (*The Polyvagal Theory*)—governed by the myelinated vagus nerve—continuously scans faces, vocal prosody, and speech rhythms to determine whether another person is safe to approach. Exhaling lengthens vagal braking and softens your face and voice; leading with crisp competence before sending that safety signal leaves the other person's defensive circuits armed.", "deepNote": {"label": "Cultural Warmth Calibration: US vs. Spain / Europe (Rung 5)", "body": "Warmth is universal in Fiske and Cuddy's model, but its behavioral dialect is local. In the US, warmth often broadcasts through big smiles and upbeat vocal energy; in Spain and much of Europe, exaggerated American cheerfulness with strangers can read as salesy or performative—there, warmth registers through unhurried eye contact, relaxed presence, and grounded curiosity."}}, {"day": "Tuesday · Part 2", "author": "Nicholas Epley & Erica Boothby", "title": "We Underestimate How Much Others Like Us", "lens": "Epley & Schroeder (2014), Boothby, Cooney, Sandstrom, & Clark (2018) on the **Liking Gap**, and Kardas, Kumar, & Epley (2022) on conversational depth (tested field and lab experiments, primarily with US/UK samples). Together, they prove that waiting to be approached rarely rests on real rejection—it rests on a systematic forecasting error.", "mechanism": "Standing behind the door, your mind runs a distorted weather forecast. Before Nicholas Epley's participants entered deeper conversations with strangers, they dreaded the exercise—predicting *\"they wouldn't like their partner very much, wouldn't enjoy the experience much, and it would be pretty awkward.\"* Yet once the conversations actually happened, people enjoyed them far more than predicted, and consistently underestimated how warmly their partner felt toward them afterward.\n\nTwo cognitive illusions keep that peephole warped: **Pluralistic Ignorance** (reading a stranger's quiet posture as \"leave me alone\" when they are actually just as hesitant as you) and **Inner Critic Asymmetry** (after you walk away, you replay every minor verbal slip in high definition while they remember your warmth and interest). The antidote is empirical, not a pep talk—run **Forecast -> Rep -> Reality Check**: write a quick 0–10 prediction *before* you initiate, execute one small rep from the **4-Tier Menu** (*Micro-Greet -> Shared Context Cue -> Low-Friction Text -> Specific Invite or Sobremesa Presence*), and log their actual words alongside your **Liking Gap Delta** (*Actual minus Forecast*). Crucially, distinguish internal forecasting errors from genuine **External Stop Signs** (headphones on, curt one-word replies, two unanswered texts)—stepping back gracefully when stop signs appear is calibration, not failure.", "tableTitle": "Forecasting Errors vs. Reality vs. Well-Founded Caution (4-Tier Menu)", "tableHead": ["Pre-Rep Forecast", "Empirical Reality", "Mechanism", "Well-Founded Caution (Stop Sign)", "4-Tier Initiation Menu"], "tableRows": [["'Head down — doesn't want to talk.'", "Many welcome brief, warm contact.", "Pluralistic Ignorance.", "Headphones on + laptop + curt 1-word reply.", "Tier 1 (Micro-Greet): Eye contact, smile, 'Morning.'"], ["'Opening out of nowhere is weird.'", "Shared-context openers feel natural.", "Overestimating awkwardness.", "Visibly rushing, crying, or on a call.", "Tier 2 (Context Cue): Comment on shared room/class/coffee."], ["'Texting first looks needy.'", "Unprompted reach-outs are appreciated.", "The Liking Gap.", "Two unanswered texts with no follow-up.", "Tier 3 (Low-Friction Text): 'Saw X and thought of you.'"], ["'Didn't like me enough to hang out.'", "Partners like you more than you think — and wait for you to ask.", "Inner Critic Asymmetry.", "Repeated vague excuses with zero counter-offer.", "Tier 4 (Specific Invite / Presence): 'Coffee Thu at 4?' or lingering at sobremesa."]], "officeEx": "Pre-rep forecast: 4/10 (\"they're probably too busy\"). Tier 4 invite to a peer: \"Hey, I've enjoyed our quick chats on the Q3 calls—no agenda, want to grab a 20-minute coffee Tuesday or Thursday?\" Reply arrives in ten minutes: \"Love that—Thursday at 10 works!\" Actual: 9/10 (+5 Liking Gap).", "personalEx": "You see the same regular three weeks in a row at your morning café or gym. Phone away, Tier 2 context cue: \"You're the only other person here at 7 AM on a Tuesday—what's your secret?\" A sixty-second laugh dissolves the stranger barrier.", "nonEx": "Ignoring clear external stop signs—cornering someone wearing AirPods who gives two flat monosyllabic replies while angling toward the door.", "decisionRule": "Go first whenever the only wall in front of you is your own pessimistic forecast; **step back smoothly the instant you meet two consecutive external stop signs** and log it without self-judgment. Once you have crossed the threshold and opened a warm exchange, Wednesday answers the hardest calibration question of early friendship: *inviting real closeness without rushing, oversharing, or turning connection into a playbook.*", "handoff": "Log 5 daily initiations on Friday's **Contact Log** with Pre-Rep Forecast (0–10), Actual Response (0–10), and automatic **Liking Gap Delta**.", "layer3Title": "Optional Deepening · Vanessa Van Edwards (Be a First Liker)", "layer3Body": "If both people suffer from the Liking Gap at the same time, how does anyone know the door is open? Vanessa Van Edwards highlights **Signal Amplification Bias**: we assume our quiet friendliness broadcasts clear interest when it actually lands as polite neutrality. Becoming a **First Liker**—stating plainly, *\"I really enjoyed talking with you; want to grab coffee sometime?\"*—collapses the gap for both people at once.", "deepNote": {"label": "Cultural Liking Gap Calibration: Argentina & Spain (Rung 6)", "body": "Because most Liking Gap trials used US and UK samples, treat the exact size of the gap as a hypothesis to test locally. In high-involvement Rioplatense or Spanish social life, immediate warmth and *sobremesa* rhythms can make in-the-moment goodwill easier to read—yet breaking into tight, long-standing local friend groups still triggers pessimistic forecasting errors. Let your live Contact Log deltas settle the question."}}, {"day": "Wednesday · Part 3", "author": "Arthur Aron", "title": "Escalating Disclosure, Responsiveness, and the Ping", "lens": "Arthur and Elaine Aron et al. (1997, *Fast Friends Procedure*) plus Aron and Yale psychologist Margaret Clark's later clarifications (in Duhigg, *Supercommunicators*). Tested laboratory research on how strangers generate genuine closeness in sixty minutes—and why real life requires one extra guardrail the lab already assumed: **consent**.", "mechanism": "Popular headlines reduced the Arons' famous 36-question study to \"overshare and fall in love.\" The actual mechanism is far subtler. When participants took turns answering questions that escalated gradually in depth, they built *\"sustained, escalating, reciprocal, personalistic self-disclosure.\"* When a separate setup had one person answer all thirty-six questions straight through while the other merely listened, nobody felt close—it felt awkward and flat. As Arthur Aron later clarified, raw disclosure is not the engine: **responsiveness and reciprocity** are—*\"Feeling like your partner is responsive to you is a huge factor,\"* because each turn lets the other show \"I hear you, I get you, I care.\" And as Margaret Clark notes, *\"The rule is not reciprocity in the moment, it's being responsive to each other's needs, and that responsiveness going both ways.\"*\n\nOutside a psychology lab, nobody signed a consent form to go deep. Blue Belt translates Aron's engine into the **Ping and Pause**: offer one small, **processed** truth—something real you have already steadied yourself around, never an unprocessed crisis asking an acquaintance to carry you—then hold the pause without apologizing or joking it away. Read their return light cleanly: **Green Light** (they match depth -> respond warmly, ask one *how/why* follow-up, and propose a specific second meeting), **Yellow Light** (friendly hold -> stay steady and consistent), or **Red Light** (polite pivot -> honor **the validity of the shallows** instantly with zero awkwardness).", "tableTitle": "Ping Calibration Spectrum & Green / Yellow / Red Return Protocol", "tableHead": ["Signal / Level", "Example", "What It Means", "Your Exact Next Move"], "tableRows": [["Too Shallow (Highlight Reel)", "'Work's busy, can't complain!'", "Keeps the door closed; safe but stalls at acquaintance.", "Upgrade by 1 notch to a processed ping."], ["Processed Ping (Target)", "'Honestly a little fried trying to map a career pivot while keeping my gym routine.'", "Small, real, already processed; zero burden on them.", "Hold the pause without backtracking or joking it away."], ["Too Raw (Non-Example)", "'I've been spiraling all week because my career is a failure and nobody gets me.'", "Unprocessed crisis asking an acquaintance to carry you.", "Save for established confidants; keep early pings processed."], ["GREEN Light Return", "'Oh man, I went through a pivot two years ago — it's exhausting...'", "Consent to depth: they matched your ping.", "Respond warmly, ask 1 how/why follow-up, propose specific 2nd meeting (time + place)."], ["YELLOW Light Return", "'Oof, pivots are tough — hope next week eases up!'", "Friendly, holding steady at current depth.", "Match warmth, don't push deeper today, stay consistent."], ["RED Light Return", "'Yeah, crazy weather lately, right?'", "Ceiling / low battery right now (not a verdict on them).", "Respect instantly — return smoothly to shallows with zero awkwardness."]], "officeEx": "Over agenda-free coffee, a peer asks how your week is going. You skip the highlight reel and offer a processed ping: \"Pretty good overall—honestly stretching myself learning to lead the cross-team sync without over-preparing every slide.\" [Hold the pause.] Green Light: \"Oh, I totally do that too.\" Connection opens, and you suggest lunch next month.", "personalEx": "After three weeks of brief chats with a gym acquaintance: \"I've been trying to build real community in this neighborhood instead of rushing home after workouts.\" [Hold the pause.] Green Light: \"Same—half my friends moved to the suburbs last year.\" You step into escalation cleanly: \"Want to grab coffee at the corner spot after Saturday's class?\"", "nonEx": "Dumping an unprocessed crisis on a new acquaintance (\"I've been spiraling all week because my career is a failure and nobody gets me\"), OR running the Ping and Pause like a mechanical sales funnel—the Playbook Trap, which people sense immediately and rightly pull away from.", "decisionRule": "Escalate **only on a Green Light**, and honor Red Lights as valid shallow friendships or seasonal low-battery moments (**Linear Ladder Myth**) rather than personal verdicts. With Blue Belt's six tactical modules complete, step into **Sanctuary Layer 2** whenever the aim is the person themselves rather than any outcome.", "handoff": "Run **Ping & Pause** with at least 2 acquaintances on Friday's **Contact Log**, recording Ping, Green/Yellow/Red Light, and at least 1 specific 2nd meeting invite.", "layer3Title": "Optional Deepening · Dan McAdams's 3 Intimacy Levels & 'Watering Holes' (via Van Edwards)", "layer3Body": "Pairing Dan McAdams's three intimacy layers (*Level 1: general traits -> Level 2: current plans and concerns -> Level 3: core values and life story*) with regular **\"watering holes\"** (the same class, café, or hobby) bridges Aron's escalation with presence-first cultures: repeated side-by-side proximity lowers friction so Level 2 pings happen organically—often far more naturally than a stiff, interview-style coffee date.", "deepNote": {"label": "Ping-Zone Map for Spain & Presence-First Settings (Rung 6)", "body": "In Spain, Argentina, and other presence-first cultures, an early personal ping lands warmly *after* repeated shared presence—returning weekly to the same café, class, or lingering during *sobremesa*—where familiarity has already built trust. Dropped cold in a first transactional encounter, it misfires; let consistent presence do the first half of the work."}}], "prompt": "Pick two acquaintances you'd like to know better. Write one calibrated, processed ping for each — and one specific, low-friction 2nd-meeting invite if they return a Green Light.", "orig": {"belt": "blue", "name": "Going first — initiation and the first two stages of friendship", "lead": "End the wait to be approached. Start contact, offer warmth first, and invite more depth in small, consented steps.", "teaching": [{"t": "p", "md": "This is Blue Belt's field module, and it is the start of the friendship work that continues in Brown and Black."}, {"t": "h", "text": "Concepts"}, {"t": "steps", "items": [{"name": "The validity of the shallows (I-Thou outline, nuance 1).", "md": "Not every connection needs depth. A gym friend you only joke with, a colleague you only talk shop with, are successes. Ask: does this context call for more? You only escalate when both people signal they want more."}, {"name": "The relationship arc (I-Thou outline, Option A).", "md": "Four stages: the spark (stranger to acquaintance), the escalation (acquaintance to friend), the stress test (the first rupture), the anchor (the confidant). Blue Belt covers the first two. Brown Belt covers the third and renovating old friendships. Black Belt covers the fourth."}, {"name": "The spark: warmth before competence.", "md": "Strangers triage you first for warmth (am I safe?) and then for competence (are you capable?). Leading with competence (intellect, credentials, unsolicited expertise) reads as threat or arrogance in social settings (Van Edwards, stub; the warmth/competence idea is widely used in social psychology). For you, leading with the interpreter's precision or the accountant's expertise is the trap; leading with genuine interest and an easy face is the move."}, {"name": "Start in the social conversation.", "md": "With strangers, open in the shared environment (\"that last set was brutal\"), not with deep questions yet (Duhigg's social conversation)."}, {"name": "Convergence.", "md": "People warm to those who match their pace, volume and formality a little (Giles, stub). This is the same baselining from B1, now used to adjust yourself slightly toward them."}, {"name": "The ping and pause (I-Thou outline, nuance 2).", "md": "To invite depth, offer one small, true, slightly more personal thing than the context needs (\"I've been feeling a bit burned out lately\"), then stop. That is a ping. If they pick it up and offer something back, the door is open. If they answer politely and move on, respect it and return to the shallows. Depth is always consented to, never extracted."}, {"name": "The calibrated reveal.", "md": "The ping is the first, smallest Reveal. Keep it \"processed\": something you have already worked through, so it does not ask them to carry you. Brown Belt teaches the full Reveal."}, {"name": "The escalation.", "md": "When pings are returned, move from what you did to how you feel about what you did. Ask \"how\" and \"why\" rather than \"what\". Then the invitation: propose a second meeting yourself, with a specific time and place."}, {"name": "The ceiling check, without judgment.", "md": "If someone cannot meet a ping, that is information about this relationship now, not a verdict on them. Life seasons change people's battery (the \"linear ladder myth\": friendships move up and down, not only up)."}, {"name": "State over script (I-Thou outline, nuance 3).", "md": "Scripts sound creepy if your inner state does not match. A slow, calm voice only works if you are calm. Use these tools to regulate your own care and attention, and trust the words to follow."}, {"name": "The one-conversation deep dive (I-Thou outline, Option B), with care.", "md": "In rare settings where both people want to skip small talk (a long coffee, a late conversation, a trip), you can move quickly: a processed reveal early, \"how and why\" questions, listening for core concerns, a callback to something they said early on. Use it only when both people are clearly in; used on someone who just wanted lunch, it is a boundary violation."}, {"name": "Cultural and neurodivergent checks (I-Thou outline, critique 4).", "md": "Eye contact, matched cadence and verbal processing of feelings are culturally specific and do not suit everyone. In high-context cultures, an early raw reveal can read as poor social judgment. With some autistic people, \"how do you feel about that?\" can create anxiety rather than closeness. Ask, adapt, and let people bond their way."}, {"name": "Presence-first cultures (Synthesis, from an earlier conversation).", "md": "US friendship is often activity-first; Spanish and Argentine friendship is often presence-first: sobremesa, the long table, showing up. For your move to Spain, \"go first\" may look less like proposing an activity and more like staying at the table, and returning to the same café, bar or class until you are a regular."}]}], "drill": "One initiation. One small act of going first each day: greet first, start a conversation, send the message you would usually wait to receive, propose the plan. Log it in one line.", "office": "Initiate one non-instrumental contact a week with a colleague (coffee with no agenda). The Achiever's Bond move from the grid: \"Spend time with someone with no agenda at all.\"", "personal": "Pick two acquaintances you would like to know better. Run the ping and pause once with each. Propose a specific second meeting to whoever returns the ping.", "deliverable": {"name": "The contact log", "md": "A log of initiations and pings: who, what you offered, what came back, what you did next. At least one escalation: a ping returned and a second meeting proposed by you.\n\n**Watch for.** Turning friendship into a project (the Achiever's Bond shadow). And the \"pick-up artist trap\": if a person senses a playbook, they will rightly pull back. If you notice you are running a sequence on someone, stop and simply be interested.", "tool": "contacts"}, "tools": ["contacts"], "deepened": {"original": "top", "parts": [{"n": 1, "title": "Part 1 · Fiske and Cuddy: warmth before competence", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Susan Fiske, Amy Cuddy and Peter Glick developed the stereotype content model, which proposes that people judge others on two main dimensions, warmth (good or ill intent) and competence (ability to act on it), and that warmth is judged first. Vanessa Van Edwards, whose book is a stub in your notebook, draws on this idea in popular advice. What is distinctive is the order: strangers ask \"are you safe?\" before \"are you capable?\""}, {"t": "note", "label": "Why Fiske and Cuddy here", "md": "The module's spark advice, lead with warmth and not expertise, rests on this research."}, {"t": "note", "label": "Native use", "md": "Research on how groups are stereotyped, later extended to impressions of individuals."}, {"t": "note", "label": "Limit", "md": "Tested research on group perception, extended to individuals (label: tested research, applied by extension). Van Edwards's advice is popular synthesis (stub). The claim that leading with competence reads as threat in social settings is a reasonable application, not a direct finding I checked."}, {"t": "h", "text": "Warmth and competence in a first meeting"}, {"t": "table", "head": ["You lead with", "What a stranger may hear first", "Better first move"], "rows": [["Credentials or expertise", "\"Is this person safe, or ranking me?\"", "Genuine interest in the shared moment"], ["A precise correction", "\"Will they judge me?\"", "Letting small errors pass"], ["An easy face and a question", "\"This person is safe.\"", "Then let competence show later"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "When you moved to a new city, what did you lead with when meeting people?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what are warmth and competence in this model, and why does order matter?"}, {"name": "Make sense (rung 2).", "md": "Write one warm opening line and one competence opening line for the same setting. Then a non-example: warmth that is really flattery."}, {"name": "Find it in your life (rung 3).", "md": "Write three first meetings in the last few months: how you opened and how it went. Only then rate how often you lead with competence, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does leading with expertise protect, given your W3 intelligence hook? What does it cost?"}, {"name": "Connect (rung 5).", "md": "In Spain, will warmth look different? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "For someone who has been doubted because of accent or race, is leading with warmth a risk? When might showing competence first protect you?"}, {"name": "Test (rung 7).", "md": "In two low-stakes first meetings, lead with one warm question and no credentials. Before you do, predict the response. Afterward, record what happened. Write what result would show competence would have worked better."}, {"name": "Catch it live (rung 8).", "md": "What is the moment you feel the pull to prove yourself?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your episodes, your lines or your ratings."}]}, {"n": 2, "title": "Part 2 · Epley and Boothby: we underestimate how much others like us", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Nicholas Epley and Juliana Schroeder found that people expect talking to strangers on a train to be unpleasant, yet report it as more pleasant than sitting alone. Erica Boothby, Gus Cooney, Gillian Sandstrom and Margaret Clark named the \"liking gap\": after a conversation, people underestimate how much the other person liked them. What is distinctive is that the barrier to going first is often a forecasting error, not real rejection."}, {"t": "note", "label": "Why Epley and Boothby here", "md": "This is Blue Belt's field module against waiting to be approached. The liking gap names a reason the wait feels safer than it is."}, {"t": "note", "label": "Native use", "md": "Experiments and field studies of conversation and social prediction."}, {"t": "note", "label": "Limit", "md": "Tested research (label: tested research), mostly with students and US or UK samples. It describes averages; some conversations really do go badly, and the gap may differ across cultures."}, {"t": "h", "text": "Forecast and reality"}, {"t": "table", "head": ["What people expect", "What the studies found"], "rows": [["Strangers do not want to talk", "Many were open to it"], ["The conversation will be awkward", "It was more pleasant than expected"], ["They did not like me much", "They liked me more than I thought"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "When did you wait to be approached and later learn the other person had wanted to talk to you?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what is the liking gap, and what did Epley and Schroeder find about strangers?"}, {"name": "Make sense (rung 2).", "md": "Give one example of a forecasting error about a conversation and one non-example: a well-founded caution."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you did not go first. For each, write what you predicted would happen. Only then rate how often your forecasts are too pessimistic, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does waiting protect for you? Where did you learn that waiting was safer? What does it cost?"}, {"name": "Connect (rung 5).", "md": "Does the liking gap feed your W3 big assumption? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with self."}, {"name": "Argue (rung 6).", "md": "Could the liking gap be smaller or larger in Argentine or Spanish social life? What would you need to know?"}, {"name": "Test (rung 7).", "md": "Do the daily initiation for five days. Before each, write a 0 to 10 forecast of how it will go. Afterward, rate how it went and note one outside data point, their words. Write what result would show your forecasts are accurate."}, {"name": "Catch it live (rung 8).", "md": "What sentence in your head says \"they probably don't want to\"?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your forecasts, your episodes or your ratings."}]}, {"n": 3, "title": "Part 3 · Aron: escalating disclosure and the ping", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Arthur Aron and colleagues created a procedure, often called the 36 questions, in which pairs of strangers take turns answering questions that grow gradually more personal. Pairs who did it reported feeling closer than pairs who made small talk. What is distinctive is the structure: disclosure that is mutual, sustained and escalating by small steps. The ping and pause in this module is a one-step version of that escalation, offered and then left to be returned or not."}, {"t": "note", "label": "Why Aron here", "md": "The module's ping and pause and the escalation stage are small, consented steps of mutual disclosure."}, {"t": "note", "label": "Native use", "md": "A laboratory procedure for generating closeness between strangers."}, {"t": "note", "label": "Limit", "md": "Tested research (label: tested research), in a structured setting where both people agreed to take part. In real life no one has agreed to the procedure, which is why the module insists on consent to depth."}, {"t": "h", "text": "Small steps of disclosure"}, {"t": "table", "head": ["Step", "Example", "What it asks of them"], "rows": [["Shared moment", "\"That last set was brutal.\"", "Nothing personal"], ["Small true thing", "\"I've been a bit burned out lately.\"", "A choice to match or not"], ["How and why", "\"How did you end up in this city?\"", "A story, if they want"], ["Invitation", "\"Coffee Thursday at the place on the corner?\"", "A yes or no"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "What is the smallest true thing you have ever said that changed a friendship?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what did Aron's procedure do, and why does it work in the lab?"}, {"name": "Make sense (rung 2).", "md": "Write one ping at the right size for a gym acquaintance, and a non-example: a ping that asks them to carry you."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you offered a ping, or held one back. Only then rate how often you go first with disclosure, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does holding back protect? What does it cost the friendships you want?"}, {"name": "Connect (rung 5).", "md": "How does a ping relate to the clean no in W5, both being small acts of visibility? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "In high-context cultures an early reveal can read as poor judgment. Where in Spain would a ping land well, and where would it not?"}, {"name": "Test (rung 7).", "md": "Run the ping and pause with two acquaintances. Before each, predict whether they will return it. Afterward, record their words and what you did next. Write what result would show pings do not work in your settings."}, {"name": "Catch it live (rung 8).", "md": "What do you feel in the pause after a ping, before they answer?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your pings, your episodes or your ratings."}]}], "connect": {"title": "Connect and argue: the three lenses side by side", "blocks": [{"t": "p", "md": "Everything in this section is Interpretation: my reading across the sources, to be tested against your episodes."}, {"t": "table", "head": ["Source", "Starts from", "Treats going first as", "Would worry that you..."], "rows": [["Fiske and Cuddy", "How strangers judge", "Showing warmth before ability", "Lead with credentials"], ["Epley and Boothby", "What we predict", "Safer than it feels", "Trust your pessimistic forecast"], ["Aron", "How closeness grows", "Mutual, escalating, consented steps", "Skip steps, or never take the first"]]}, {"t": "p", "md": "**Where they meet.** Going first is small, warm and repeated; closeness grows in steps, and the fear of the first step is usually larger than the risk."}, {"t": "p", "md": "**Where they collide.** Aron's procedure escalates by design; the module's validity of the shallows says not every connection should escalate. Consent decides."}, {"t": "p", "md": "**What the three miss for you.** Presence-first friendship, in Spain and Argentina, grows by showing up more than by disclosure. None of the three studies sobremesa."}, {"t": "p", "md": "**Where it sits in your own frameworks.** Heart with others and Heart with self in your Orders Grid, and the start of the I-Thou track's Layer 2. Return to this module later and add dated notes; do not overwrite."}]}, "research": {"title": "Research further: three threads to pick from", "blocks": [{"t": "p", "md": "These are gaps the sources left open. Replace them with your own questions whenever you have them."}, {"t": "table", "head": ["Thread", "Question it opens", "Why it connects", "Suggested depth"], "rows": [["1. Friendship formation across cultures", "How do friendships form in Spain compared with the US, and what research exists?", "Your move", "One thread, researched with the research-brief skill"], ["2. The liking gap across cultures", "Has the liking gap been tested outside the US and UK?", "Part 2's samples are narrow", "One thread, with a critic pass"], ["3. How many hours make a friend", "What does research say about time spent together and friendship formation?", "The presence-first idea", "Full deepening of Part 3"]]}], "prompt": "Use curriculum-module in deepen mode on Blue Belt B6, Part {part}, one thread. My question: {q}. Why it pulled me: {why}. What I already think: {think}. Verify sources with research-brief first, write into the part's Deepened section, and do not write my entries."}}}}], "hiddenNeeds": [{"id": "significance", "name": "Significance", "fear": "guards against being ignored or feeling small", "src": "Hughes"}, {"id": "approval", "name": "Approval", "fear": "guards against disapproval", "src": "Hughes"}, {"id": "acceptance", "name": "Acceptance", "fear": "guards against not belonging", "src": "Hughes"}, {"id": "intelligence", "name": "Intelligence", "fear": "guards against being seen as dumb", "src": "Hughes"}, {"id": "pity", "name": "Pity", "fear": "guards against being disbelieved", "src": "Hughes"}, {"id": "strength", "name": "Strength / power", "fear": "guards against being disrespected or dominated", "src": "Hughes"}, {"id": "appreciation", "name": "Appreciation", "fear": "are my thoughts and feelings understood and valued?", "src": "Fisher and Shapiro"}, {"id": "affiliation", "name": "Affiliation", "fear": "am I treated as a colleague or an adversary?", "src": "Fisher and Shapiro"}, {"id": "autonomy", "name": "Autonomy", "fear": "is my freedom to decide respected?", "src": "Fisher and Shapiro"}, {"id": "status", "name": "Status", "fear": "is my standing acknowledged?", "src": "Fisher and Shapiro"}, {"id": "role", "name": "Role", "fear": "do I have a meaningful role here?", "src": "Fisher and Shapiro"}], "gridCols": [{"k": "read", "n": "Read", "es": "Leer", "q": "What is actually happening, in them, in me, between us?"}, {"k": "bond", "n": "Bond", "es": "Vincular", "q": "Do they feel met?"}], "gridUse": {"intro": "The grid is not studied daily. It is used in four ways.", "uses": [{"name": "Placement at the start of each belt.", "md": "Before beginning a belt, mark \"You, today\" in that belt's columns, using evidence from your last debriefs, not your self-image. The rule from Cook-Greuter applies: everybody's responses spread across at least three levels (Source: Nine Levels p. 7). So mark three things per column: your **home base** (where you usually operate when resourced), your **fallback** (where you go under pressure), and your **edge** (where you sometimes reach)."}, {"name": "The weekly look.", "md": "Once a week (a cadence, not a deadline), read your encounter-loop entries and mark, for each one, which cell you actually operated from. Over time the marks show your real distribution."}, {"name": "The Move as a drill.", "md": "Each cell's Move is a ready-made micro-practice. When a belt's module is native to you, use the Move of the cell one row above your home base as your daily drill instead."}, {"name": "The Shadow as a warning light.", "md": "Before any hard conversation, read the Shadow of your home base and your fallback in the column you will need most. That is your most likely failure."}], "cautions": [{"name": "Read the behavior, not the type.", "md": "The grid describes how each stage tends to show up in each function. It is a map of patterns, not a sorting hat for people. White Belt's rule governs every belt: label the move, not the person. Polished Achievers use tactics; frightened people of any stage can look aggressive."}, {"name": "Stages are not fixed.", "md": "A person's \"center of gravity\" is what they reliably use without special support (Source: Nine Levels pp. 7–8), and under stress everybody falls to a trailing edge (Source: Nine Levels p. 8). Both you and the people you read move around the grid within a single conversation."}, {"name": "Higher is not better at everything.", "md": "Every row has a Gift. The Expert's precision and the Diplomat's warmth are real skills a Strategist still needs. The curriculum's \"conscious downgrade\" is the right attitude: you choose a stage's tool on purpose rather than being run by its reflex."}], "preconvNote": "The Opportunist row now stands for the whole pre-conventional stage (everything before the Diplomat), but its cells were written for the Opportunist sub-band, as a fallback, not as anyone's home base."}, "gridFooter": {"translationStrip": "Before you close any sheet, run the move through three cultures. How does it land in a low-context US setting, in Argentine and Rioplatense culture, and in Spain? Then the Bridges check: which intercultural stage am I construing this from, and is Reversal hiding in my judgment?", "readingRows": ["Stage names follow Cook-Greuter; the second name and power type follow Torbert's action logics.", "The Bridges line is an approximate match to Bennett's intercultural stages, inferred, not stated by either author.", "Opportunist sits at the edge: useful to recognize, rarely a home base."], "whereFrom": "Cells are drafts written from the full books in your notebook (Torbert, Bennett, Hughes, Simon, Voss, Fisher & Shapiro, Shapiro, Duhigg, Brooks, Tannen, Brown & Levinson, Goffman, Pavlenko, Kegan & Lahey). Page anchors are the notebook's; check them before quoting.", "fields": [["Gift", "what this stage does well"], ["Shadow", "how it fails, including its dark side"], ["Tell", "how you recognize it, in yourself or others"], ["Move", "one practice that develops it"]]}, "sanctuaryJournalFields": [{"k": "happened", "label": "What happened between us"}, {"k": "layer", "label": "Which layer it touched, and which armor showed up"}, {"k": "marker", "label": "The marker, if there was one"}], "hooksTool": {"id": "hooks", "name": "Hook profile", "started": "White W3", "grows": "Blue B3, Black Bk5", "holds": "Your top needs, vulnerabilities, immunity map", "single": true, "fields": [{"k": "needs", "label": "Needs, ranked", "hint": "significance · approval · acceptance · intelligence · pity · strength — strongest pull first"}, {"k": "vulns", "label": "Simon's five, rated 1–5", "hint": "naivety · over-conscientiousness · low self-confidence · over-intellectualizing · emotional dependency"}, {"k": "topVuln", "label": "Highest-rated vulnerability", "hint": ""}]}}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('dojo-data').textContent);
  const KEY = 'dojo_blue_belt_v4';

  const defaultState = () => ({
    theme: 'light',
    dialect: 'office_us',
    tab: 'OVERVIEW',
    dayTab: { B1:0, B2:0, B3:0, B4:0, B5:0, B6:0 },
    rungIdx: {},
    rungNotes: {},
    checks: {},
    notes: {},
    researchDraft: {},
    evidence: { baselines:0, checked:0, labels:0, matched:0, initiations:0, pings:0 },
    b1Cards: [],
    b2Cards: [],
    b3Matrix: [],
    b4Loops: [],
    b5Audits: { office:'', personal:'', b1:'', b2:'', b3:'' },
    b6Log: [],
    gridMarks: {},
    sanctuaryJournal: [],
    w3Hooks: { needs:'', vulns:'', topVuln:'' },
    p6: { selected: null, hidden: false },
    capstone: { t1:false, t2:false, t3:false, debrief:'' },
    gauntlet: { passed: false, scores: {} }
  });

  let state = defaultState();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem('dojo_blue_belt_v3') || 'null');
    if (saved) state = Object.assign(defaultState(), saved);
  } catch(e){}

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  function esc(s){
    return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function mdInline(s){
    let out = esc(s);
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\*(.+?)\*/g, '<em>$1</em>');
    out = out.replace(/\n\n/g, '<br><br>');
    out = out.replace(/\n/g, '<br>');
    return out;
  }

  function renderBlocks(blocks){
    if (!Array.isArray(blocks)) return '';
    return blocks.map(b => {
      if (b.t === 'h') return `<h3 style="margin-top:12px">${esc(b.text)}</h3>`;
      if (b.t === 'p') return `<p>${mdInline(b.md)}</p>`;
      if (b.t === 'note') return `<div class="c-note"><span class="nlabel">${esc(b.label||'Note')}</span>${mdInline(b.md)}</div>`;
      if (b.t === 'safety') return `<div class="c-note warn"><span class="nlabel">${esc(b.label||'Safety')}</span>${mdInline(b.md)}</div>`;
      if (b.t === 'steps') return `<ul class="c-steps">${(b.items||[]).map(it=>`<li><strong>${esc(it.name)}</strong> ${mdInline(it.md)}</li>`).join('')}</ul>`;
      if (b.t === 'table') return `<div class="t-wrap"><table><thead><tr>${(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(b.rows||[]).map(r=>`<tr>${r.map((c,i)=>i===0?`<td><strong>${mdInline(c)}</strong></td>`:`<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      return '';
    }).join('');
  }

  function applyTheme(){
    document.documentElement.setAttribute('data-theme', state.theme === 'dark' ? 'dark' : 'light');
  }

  document.getElementById('belt-cols-line').textContent = `${DATA.beltMeta.columnsLine} · ${DATA.beltMeta.layerLine}`;

  function renderEvidence(){
    const grid = document.getElementById('ev-grid');
    let total = 0;
    grid.innerHTML = DATA.meta.evidenceCols.map(c => {
      const v = state.evidence[c.id] || 0;
      total += v;
      return `<div class="ev-chip"><span>${esc(c.label)}</span><span style="display:flex;align-items:center;gap:6px"><b>${v}</b><button data-ev="${c.id}">+1</button></span></div>`;
    }).join('');
    document.getElementById('ev-total').textContent = `${total} total reps logged`;
    grid.querySelectorAll('button[data-ev]').forEach(b => {
      b.onclick = () => { const id = b.getAttribute('data-ev'); state.evidence[id] = (state.evidence[id]||0)+1; save(); renderEvidence(); };
    });
  }

  function renderDialects(){
    const wrap = document.getElementById('dialect-btns');
    wrap.innerHTML = Object.entries(DATA.dialects).map(([k,d]) =>
      `<button class="c-btn quiet ${state.dialect===k?'active':''}" data-d="${k}" style="min-height:32px;padding:4px 10px;font-size:12.5px">${esc(d.label)}</button>`
    ).join('');
    document.getElementById('dialect-note').textContent = DATA.dialects[state.dialect].note;
    wrap.querySelectorAll('button[data-d]').forEach(b => {
      b.onclick = () => { state.dialect = b.getAttribute('data-d'); save(); renderDialects(); renderMain(); };
    });
  }

  function renderNav(){
    const nav = document.getElementById('week-nav');
    const items = [{ id:'OVERVIEW', label:'Overview & Grid' }]
      .concat(DATA.weeks.map(w => ({ id: w.id, label: `${w.id} · ${w.title.split('—')[0].trim()}` })))
      .concat([
        { id: 'TEST', label: state.gauntlet.passed ? '★ Test & Capstone' : 'Test & Capstone' },

            document.getElementById('b6-d-fb').innerHTML = `<div class="c-note ${ok?'ok':'warn'}"><span class="nlabel">${ok?'Calibrated':'Signal: '+d.light}</span><b>Next Move:</b> ${esc(d.move)}</div>
              <div class="btn-row"><button class="c-btn blue" id="b6-d-next">Next Scenario</button><button class="c-btn quiet" id="b6-d-ev">+1 Initiation Rep</button></div>`;
            document.getElementById('b6-d-next').onclick = () => { idx = (idx+1)%DATA.labs.B6_drills.length; draw(); };
            document.getElementById('b6-d-ev').onclick = () => { state.evidence.initiations++; save(); renderEvidence(); document.getElementById('b6-d-ev').textContent='Logged!'; };
          };
        });
      }; draw();
    }

    // Savers
    const sB1 = document.getElementById('save-b1');
    if (sB1) sB1.onclick = () => {
      const person = document.getElementById('f-b1-person').value.trim(); if (!person) return;
      state.b1Cards.push({ person, setting:document.getElementById('f-b1-setting').value.trim()||'General', posture:document.getElementById('f-b1-posture').value.trim(), pace:document.getElementById('f-b1-pace').value.trim(), gaze:document.getElementById('f-b1-gaze').value.trim(), stress:document.getElementById('f-b1-stress').value.trim(), display:document.getElementById('f-b1-display').value.trim(), myTell:document.getElementById('f-b1-tell').value.trim() });
      state.evidence.baselines++; save(); renderEvidence(); renderMain();
    };
    document.querySelectorAll('button[data-fill-b2]').forEach(b => { b.onclick = () => { document.getElementById('f-b2-person').value = b.getAttribute('data-fill-b2'); }; });
    const sB2 = document.getElementById('save-b2');
    if (sB2) sB2.onclick = () => {
      const person = document.getElementById('f-b2-person').value.trim(); if (!person) return;
      state.b2Cards.push({ person, currency:document.getElementById('f-b2-curr').value, conf:document.getElementById('f-b2-conf').value, verdict:document.getElementById('f-b2-verdict').value, evidence:document.getElementById('f-b2-ev').value.trim(), falsifier:document.getElementById('f-b2-fal').value.trim(), outcome:document.getElementById('f-b2-out').value.trim() });
      state.evidence.checked++; save(); renderEvidence(); renderMain();
    };
    const sB3 = document.getElementById('save-b3');
    if (sB3) sB3.onclick = () => {
      const context = document.getElementById('f-b3-ctx').value.trim(); if (!context) return;
      state.b3Matrix.push({ context, concern:document.getElementById('f-b3-con').value.trim(), pos:document.getElementById('f-b3-pos').value.trim(), interest:document.getElementById('f-b3-int').value.trim(), answer:document.getElementById('f-b3-ans').value.trim() });
      save(); renderMain();
    };
    const sB4 = document.getElementById('save-b4');
    if (sB4) sB4.onclick = () => {
      const who = document.getElementById('f-b4-who').value.trim(); if (!who) return;
      state.b4Loops.push({ who, type:document.getElementById('f-b4-type').value, result:document.getElementById('f-b4-res').value, loop:document.getElementById('f-b4-loop').value.trim(), reply:document.getElementById('f-b4-rep').value.trim() });
      state.evidence.matched++; save(); renderEvidence(); renderMain();
    };
    document.querySelectorAll('button[data-pull-b3]').forEach(b => { b.onclick = () => { document.getElementById('f-b5-off').value = `Re: "${b.getAttribute('data-pull-b3')}" — You're probably going to think...`; }; });
    const sB5 = document.getElementById('save-b5');
    if (sB5) sB5.onclick = () => {
      state.b5Audits = { office:document.getElementById('f-b5-off').value.trim(), personal:document.getElementById('f-b5-per').value.trim(), b1:document.getElementById('f-b5-b1').value.trim(), b2:document.getElementById('f-b5-b2').value.trim(), b3:document.getElementById('f-b5-b3').value.trim() };
      state.evidence.labels++; save(); renderEvidence(); alert('Saved B5 Audits & Boundaries!');
    };
    const sB6 = document.getElementById('save-b6');
    if (sB6) sB6.onclick = () => {
      const who = document.getElementById('f-b6-who').value.trim(); if (!who) return;
      const light = document.getElementById('f-b6-light').value;
      state.b6Log.push({ who, opener:document.getElementById('f-b6-open').value, light, forecast:document.getElementById('f-b6-fc').value, actual:document.getElementById('f-b6-ac').value, ping:document.getElementById('f-b6-ping').value.trim(), back:document.getElementById('f-b6-back').value.trim(), next:document.getElementById('f-b6-next').value.trim() });
      state.evidence.initiations++; if (light==='GREEN') state.evidence.pings++;
      save(); renderEvidence(); renderMain();
    };
    const gBtn = document.getElementById('btn-grade-gauntlet');
    if (gBtn) gBtn.onclick = () => {
      const ans = { g1:1, g2:1, g3:2, g4:0, g5:2 }; let score = 0;
      Object.keys(ans).forEach(k => { const sel = document.querySelector(`input[name="${k}"]:checked`); if (sel){ const v = Number(sel.value); state.gauntlet.scores[k]=v; if (v===ans[k]) score++; } });
      state.gauntlet.passed = (score===5); save(); renderNav();
      document.getElementById('gauntlet-fb').innerHTML = score===5 ? `<div class="c-note ok"><span class="nlabel">5/5 Passed!</span>Blue Belt Seal stamped!</div>` : `<div class="c-note warn"><span class="nlabel">${score}/5 Correct</span>Review any missed stage and try again.</div>`;
    };
  }

  function renderMain(){
    const main = document.getElementById('main-view');
    if (state.tab === 'OVERVIEW') main.innerHTML = renderOverview();
    else if (state.tab === 'TEST') main.innerHTML = renderGauntlet();
    else if (state.tab === 'PRINT') main.innerHTML = renderPrintable();
    else { const w = DATA.weeks.find(x => x.id === state.tab) || DATA.weeks[0]; main.innerHTML = renderWeek(w); }
    wireInteractions();
  }

  document.getElementById('pocket-front').innerHTML = `<div class="eyebrow">Blue Belt Pocket Card</div>` +
    DATA.meta.pocket.cues.map((c,i)=>`<div><strong style="font-family:var(--display);font-size:17px">${esc(c)}</strong><div class="small muted">${esc(DATA.meta.pocket.notes[i])}</div></div>`).join('');
  document.getElementById('pocket-back').innerHTML = `<div class="eyebrow">The Check Question</div><div style="font-family:var(--display);font-size:22px">${esc(DATA.meta.pocket.back)}</div>`;
  const modal = document.getElementById('pocket-modal');
  document.getElementById('btn-pocket').onclick = () => modal.classList.add('open');
  document.getElementById('btn-close-pocket').onclick = () => modal.classList.remove('open');
  modal.onclick = e => { if (e.target === modal) modal.classList.remove('open'); };
  document.getElementById('pocket-flip').onclick = () => document.getElementById('pocket-flip').classList.toggle('flipped');
  document.getElementById('btn-theme').onclick = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };

  function download(name, content, mime){
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type:mime})); a.download = name; a.click();
  }
  document.getElementById('btn-export-json').onclick = () => download('blue_belt_v4.3_backup.json', JSON.stringify(state, null, 2), 'application/json');
  document.getElementById('import-json').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { state = Object.assign(defaultState(), JSON.parse(r.result)); save(); applyTheme(); renderEvidence(); renderDialects(); renderNav(); renderMain(); alert('Backup imported!'); } catch(err){ alert('Invalid JSON file.'); } };
    r.readAsText(f);
  };
  document.getElementById('btn-export-md').onclick = () => {
    const lines = [
      '# Communication Dojo — Blue Belt Complete Field Log (v4.3 Essayist Edition)',
      `Gauntlet Seal: ${state.gauntlet.passed ? 'EARNED' : 'In Progress'} | Capstone Tests: T1=${state.capstone.t1}, T2=${state.capstone.t2}, T3=${state.capstone.t3}`,
      '## Evidence Totals',
      ...DATA.meta.evidenceCols.map(c => `- ${c.label}: ${state.evidence[c.id]||0}`),
      '\n## B1 · Baseline Cards',
      ...state.b1Cards.map(c => `- **${c.person}** (${c.setting}): Posture=${c.posture}; Pace=${c.pace}; Gaze=${c.gaze}; Stress=${c.stress}; Display=${c.display}; My W1 Tell=${c.myTell}`),
      '\n## B2 · Hypothesis Cards',
      ...state.b2Cards.map(c => `- **${c.person}** [${c.currency} | ${c.conf} | ${c.verdict}] Evidence: ${c.evidence} | Falsifier: ${c.falsifier} | Outcome: ${c.outcome}`),
      '\n## B3 · Position-vs-Need Matrix',
      ...state.b3Matrix.map(m => `- **${m.context}** (${m.concern}) | Position: "${m.pos}" | Interest: ${m.interest} | Honor+Hold: ${m.answer}`),
      '\n## B4 · Five Loops',
      ...state.b4Loops.map(l => `- **${l.who}** [${l.type} | ${l.result}] Loop: "${l.loop}" | Reply: ${l.reply}`),
      '\n## B5 · Accusation Audits & Empathy Boundaries',
      `- Office Audit: ${state.b5Audits.office}`, `- Personal Audit: ${state.b5Audits.personal}`,
      `- Boundaries: 1) ${state.b5Audits.b1} | 2) ${state.b5Audits.b2} | 3) ${state.b5Audits.b3}`,
      '\n## B6 · Contact & Ping Log',
      ...state.b6Log.map(c => `- **${c.who}** [${c.opener} | ${c.light} | Forecast ${c.forecast} -> Actual ${c.actual}] Ping: ${c.ping} | Reply: ${c.back} | Next: ${c.next}`),
      '\n## Capstone Debrief', state.capstone.debrief || '(none)',
      '\n## 9-Rung Socratic Responses',
      ...Object.entries(state.rungNotes).filter(([,v])=>v.trim()).map(([k,v])=>`- **${k}:** ${v.trim()}`),
      '\n## Master Grid Marks (Read & Bond)',
      ...Object.entries(state.gridMarks).filter(([,v])=>v && v.length).map(([k,v])=>{
        const [col, idx] = k.split('_');
        const st = DATA.gridStages[Number(idx)];
        return `- **${st?st.n:idx} (${col==='r'?'Read':'Bond'}):** ${v.join(', ')}`;
      }),
      '\n## Sanctuary Layer 2 Journal',
      ...state.sanctuaryJournal.map(j=>`- **${j.date}** | Happened: ${j.happened} | Layer/Armor: ${j.layer} | Marker: ${j.marker||'—'}`),
      '\n## W3 Hook Profile Reference',
      `- Needs: ${state.w3Hooks.needs||'—'} | Vulns: ${state.w3Hooks.vulns||'—'} | Top Vuln: ${state.w3Hooks.topVuln||'—'}`,
      '\n## Part Field Notes',
      ...Object.entries(state.notes).filter(([,v])=>v.trim()).map(([k,v])=>`- **${k}:** ${v.trim()}`)
    ];
    download('blue_belt_complete_log.md', lines.join('\n'), 'text/markdown');
  };

  applyTheme(); renderEvidence(); renderDialects(); renderNav(); renderMain();
})();
</script>
</body>
</html>
