 "Connect (rung 5).", "md": "Does seduction, the tactic aimed at you in W4, exploit the same need you would answer in others? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "Is answering a need still manipulation if the person does not know you are doing it? What does the transparency test say?"}, {"name": "Test (rung 7).", "md": "Answer one need out loud this week in a low-stakes exchange. Before you do, predict the effect. Afterward, record their words. Write what result would show you misread the need."}, {"name": "Catch it live (rung 8).", "md": "When you spot a need, what is your first impulse: to answer it or to use it?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your episodes, your answers or your ratings."}]}], "connect": {"title": "Connect and argue: the three lenses side by side", "blocks": [{"t": "p", "md": "Everything in this section is Interpretation: my reading across the sources, to be tested against your episodes."}, {"t": "table", "head": ["Source", "Starts from", "Treats the position as", "Would worry that you..."], "rows": [["Fisher and Shapiro", "Five concerns", "A sign a concern is trampled", "Argue terms while a concern is hurt"], ["Fisher, Ury and Patton", "Interests", "A surface over reasons", "Bargain over positions"], ["Hughes", "Fear-based needs", "A need speaking", "Exploit or announce the need"]]}, {"t": "p", "md": "**Where they meet.** All three look under the stated demand for something that can be answered more cheaply than the demand itself."}, {"t": "p", "md": "**Where they collide.** Fisher and Ury aim at agreement; Hughes's native use aims at advantage. The module keeps the map and changes the aim."}, {"t": "p", "md": "**What the three miss for you.** Positions often come in a register or language that hides the need, and interpreters hear that layer first. None of the three speaks to that."}, {"t": "p", "md": "**Where it sits in your own frameworks.** Heart with others and Mind in your Orders Grid, with Hicks's dignity elements as a close cousin of the five concerns. Return to this module later and add dated notes; do not overwrite."}]}, "research": {"title": "Research further: three threads to pick from", "blocks": [{"t": "p", "md": "These are gaps the sources left open. Replace them with your own questions whenever you have them."}, {"t": "table", "head": ["Thread", "Question it opens", "Why it connects", "Suggested depth"], "rows": [["1. Core concerns and dignity", "How do Fisher and Shapiro's five concerns map onto Hicks's dignity elements and self-determination theory's needs?", "Three need lists meet in this module", "One thread, researched with the research-brief skill"], ["2. Interests and power", "What does negotiation research say about interest-based bargaining when power is unequal?", "Your promotion conversation has a power gap", "One thread, with a critic pass"], ["3. Does naming concerns help?", "Is there evidence that addressing relational concerns improves negotiated outcomes?", "Part 1 is practitioner theory", "Full deepening of Part 1"]]}], "prompt": "Use curriculum-module in deepen mode on Blue Belt B3, Part {part}, one thread. My question: {q}. Why it pulled me: {why}. What I already think: {think}. Verify sources with research-brief first, write into the part's Deepened section, and do not write my entries."}}}}, {"id": "B4", "num": 4, "title": "Which Conversation Is This?", "subtitle": "Match practical, emotional, or social first — ask calibrated deep questions, and loop for understanding.", "guardrail": "Surveillance vs. Care: Never use deep questions as the 'anonymous listener's armor' (asking brilliant questions while offering nothing back). And remember: a correction after a loop is a 100% win, not an Expert failure.", "assembly": [{"day": "Mon", "step": "Part 1 · Charles Duhigg", "ingredient": "3 Conversations, Shift Clues & Natural Meta-Questions"}, {"day": "Tue", "step": "Part 2 · David Brooks", "ingredient": "Illuminator Posture, Question Tiers & Give-One-to-Ask-One"}, {"day": "Wed", "step": "Part 3 · Carl Rogers", "ingredient": "Natural 3-Beat Loop, Parrot vs. Over-Interpret & Corrections"}, {"day": "Thu", "step": "Deliberate Practice Lab", "ingredient": "6-Dialogue Conversation-Type & Mid-Stream Shift Detector"}, {"day": "Fri", "step": "Deliverable Workshop", "ingredient": "Five Loops Log (Confirmed & Corrected)"}], "parts": [{"day": "Monday · Part 1", "author": "Charles Duhigg", "title": "Three Conversations and the Matching Principle", "lens": "Supercommunicators (2024). Popular synthesis of neural entrainment research showing connection requires both people to be in the same kind of conversation at the same time.", "mechanism": "Every meaningful talk runs in one of 3 lanes — Practical ('What's this really about?'), Emotional ('How do we feel?'), or Social ('Who are we?') — governed by a Quiet Negotiation over goals and rules. Run a silent 3-Label Check in the first 60 seconds and match their lane for at least 2 full turns before proposing a lane shift. If a practical talk suddenly turns tense or defensive, assume a hidden shift into Social (identity threat) and acknowledge who they are before returning to facts.", "tableTitle": "Duhigg's Three Conversations — Clues, Traps & Natural Meta-Questions", "tableHead": ["Conversation Type", "Clues to Spot It", "Classic Mismatch", "Match-First Move", "Natural Meta-Question (EN / ES)"], "tableRows": [["1. Practical ('What's this about?')", "Timelines, budgets, options, 'What's the plan?'", "Long emotional processing when they need a crisp decision.", "Name the decision, options, and concrete next step.", "'Landing a decision today or mapping options?' / '¿Lo resolvemos ahora o lo vamos viendo?'"], ["2. Emotional ('How do we feel?')", "Venting, heavy sighs, repeating frustration, 'I'm wiped.'", "Jumping straight to advice or 3-step fix (The Fixer Trap).", "Slow down; give 1–2 sentences to the feeling; loop once.", "'Want to brainstorm or mostly sit with you in this?' / '¿Pensamos qué hacer o solo descargarte?'"], ["3. Social ('Who are we?')", "Status, fairness, 'people like me,' defensiveness over accent/competence.", "Arguing spreadsheets while their identity feels on trial.", "Acknowledge who they are & your respect BEFORE facts.", "'Want to be sure we're on the same side — how's this landing?' / 'Quiero asegurarme de que tiramos para el mismo lado.'"]], "officeEx": "A colleague says 'The client moved the audit scope again — I don't know how they expect me to pull this off by Thursday.' You catch an Emotional opening wrapped in a practical topic: 'That sounds maddening — moving the goalposts two days out is rough. Want to vent for a minute, or jump into how to push back on Thursday?'", "personalEx": "A friend says 'You've been so busy lately, I guess I don't know where I fit anymore.' That looks practical (scheduling), but it's Social (who are we?). You drop the calendar: 'Hey — you matter a ton to me, and I hate that my schedule made you feel sidelined. Let's talk about us first, then look at dates.'", "nonEx": "Your friend vents about a brutal work week (Emotional), and you immediately say 'Have you tried blocking your calendar and telling your boss no?' (Practical fix) — making them feel dismissed.", "decisionRule": "Match their lane first whenever friction or circularity appears; use a natural meta-question if the lane is unclear. Stop asking formal meta-questions when the lane is already obvious — match through tone and a clean loop.", "handoff": "Log the Conversation Type (and any mid-stream shift) at the top of each of your Five Loops on Friday.", "layer3Title": "Optional Deepening · Lisa Feldman Barrett (via Duhigg, Supercommunicators)", "layer3Body": "When should you NOT mirror someone's emotional intensity? Barrett distinguishes empathy (mirroring affect) from instrumental support (staying steady to help regulate them). Her rule — pace, then lead: first entrain briefly so they feel met, then slow your own signal down so they can co-regulate with you.", "deepNote": {"label": "4 Observable Mid-Stream Shift Signals (Practical -> Social/Emotional)", "body": "Real conversations rarely announce a lane change. Watch for 4 observable shift clues: (1) Sudden stiffness, volume drop, or formal wording; (2) Repeating the exact same point louder or slower (signal they feel unheard); (3) Pronouns shifting from 'the project / the timeline' to 'you / I / people like me'; (4) Bringing up past grievances or outside allies. The instant a shift fires, pause the facts and match the new lane."}}, {"day": "Tuesday · Part 2", "author": "David Brooks", "title": "Deep Questions, Accompaniment, and 'Take Me Back'", "lens": "How to Know a Person (2023). Popular synthesis framing questioning as a moral practice of Perspective Receiving (asking rather than guessing) grounded in Accompaniment and Loud Listening.", "mechanism": "Illuminators practice Accompaniment (patience/'negative effort', playfulness, other-centeredness, presence) and Loud Listening (active warmth as hospitality, because passive silence inhibits speakers). Break the 'anonymous listener's armor' with the Anchor -> Ask -> Accompany sequence: share one small true thing first (Give-One-to-Ask-One), ask one calibrated question matched to relationship depth, and actually answer when they ask you back.", "tableTitle": "Brooks's Question Tiers — Calibrated by Relationship Depth", "tableHead": ["Tier & Setting", "Surface Fact Question", "Upgraded Deep / Brooks Question", "Give-One-to-Ask-One Anchor", "Non-Example (Test / Intrusion)"], "tableRows": [["1. Commonality (Strangers / Peers)", "'Where do you work?'", "'What's the part of your week that actually gives you energy?'", "'I've realized I love strategy way more than spreadsheets — what part of your work actually gives you energy?'", "'Do you even like it or just do it for money?' (Test)"], ["2. Take Me Back (Acquaintances)", "'How long have you lived here?'", "'Take me back — what made you decide to leave where you were and land here?'", "'Moving here scrambled my sense of home for a year. How did you decide to make the jump?'", "Rapid-fire 'Where from? Why leave? What school?' (Interview)"], ["3. Big Question (Established Friends)", "'How's work going?'", "'What crossroads are you at?' / 'If we meet a year from now, what are we celebrating?'", "'I feel like I'm at a real career crossroads this year — do you feel like you're in a transition chapter too?'", "Asking 'What's your deepest regret?' at a first work lunch (Too soon)"]], "officeEx": "Over an agenda-free coffee with a peer: 'I've been trying to figure out what parts of consulting make me feel alive vs. drained. Take me back — how did you end up pivoting into this team?' You listen warmly, loop one theme, and share your own pivot when asked.", "personalEx": "At dinner with an established friend stuck in weekly logistics: 'I've been thinking a lot about what I want the next chapter to look like — if we're sitting here a year from now, what would we be celebrating for you?'", "nonEx": "Firing five brilliant probing questions in a row while sealing your own life behind 'Oh, I'm good, same old!' — leaving the other person feeling exposed and interviewed.", "decisionRule": "Match question tier to relationship depth; save Big Questions for unhurried settings. Stop asking follow-ups if you've asked 2 in a row without offering a reaction or small truth of your own.", "handoff": "Use one calibrated Take-Me-Back or Deep Question (with a personal anchor) to open at least 2 of your Friday Five Loops conversations.", "layer3Title": "Optional Deepening · Henri Nouwen (cited in Brooks, How to Know a Person)", "layer3Body": "Brooks quotes Nouwen's balance for trained listeners: 'Receptivity without confrontation leads to a bland neutrality that serves nobody. Confrontation without receptivity leads to an oppressive aggression which hurts everybody.' Deep questions build the receptivity that lets your honest views and boundaries land safely.", "deepNote": {"label": "Accompaniment's 4 Qualities & Low-Intrusion Questions (Rung 6)", "body": "Brooks defines Accompaniment through 4 qualities: Patience (Simone Weil's 'negative effort' — becoming lingerable), Playfulness (relaxed spontaneity), Other-Centeredness (like a pianist accompanying a singer), and Presence (showing up without fixing). In cultures where personal questions to near-strangers feel intrusive, use Third-Object Questions anchored in shared reality — the neighborhood, food, craft, or city ('How long have you been coming to this café?' / 'What's your favorite part of this neighborhood?') before personal biography."}}, {"day": "Wednesday · Part 3", "author": "Carl Rogers", "title": "Reflective Listening and the Loop", "lens": "Rogers & Farson ('Active Listening', 1957), On Becoming a Person (1961), and Weger et al. (2014). Reflective listening only works when grounded in Congruence (genuineness), Acceptance, and Empathic Understanding ('as if' without losing the 'as if').", "mechanism": "Formal shrink-speak ('What I hear you saying is...' six times) feels phony. Run the Natural 3-Beat Loop: (1) Distill their core meaning + underlying feeling into 1 plain sentence in your own words ('So...', 'It sounds like...', 'If I'm tracking...'); (2) Check lightly ('Am I getting that right?'); (3) Pause and Welcome the Edit — if they correct you, drop any W2 Expert urge to defend your summary and immediately validate their correction.", "tableTitle": "Parrot vs. Over-Interpretation vs. Clean Loop (with Correction Recovery)", "tableHead": ["Speaker's Statement", "Parroting (Fails)", "Over-Interpretation (Fails)", "Clean Rogers / Duhigg Loop", "Correction Recovery"], "tableRows": [["'My boss keeps rewriting my decks at 9 PM without telling me.'", "'So your boss rewrites your decks at 9 PM without telling you.'", "'So your boss is a micromanager who doesn't respect you.'", "'It sounds like it's not just the late edits — it's feeling shut out of work you own. Am I getting that right?'", "'Got it — less about being shut out and more about unclear standards. Thanks for clarifying.'"], ["'I told my mom I couldn't visit and she went totally silent.'", "'So you told your mom you couldn't visit and she went silent.'", "'She's clearly guilt-tripping you to manipulate you.'", "'It sounds like that silence landed heavy — like you're carrying guilt just for setting a limit. Close?'", "'Ah, okay — not guilt, just exhausted by the cold shoulder. Makes total sense.'"], ["'We can't launch Q3 if Legal keeps adding review cycles.'", "'So we can't launch Q3 because of Legal's review cycles.'", "'You're mad because Legal always slows down your team.'", "'So the core risk is extra review loops pushing us past the Q3 window — am I tracking the main bottleneck?'", "'Right, timeline's fine — it's surprise rework at the end. Good catch.'"]], "officeEx": "After a tense stakeholder lists four objections, you don't defend a single point yet: 'Let me make sure I've got the real concern — it's less about software cost and more that your team can't afford a two-week learning curve right before year-end close. Did I capture that?' She relaxes: 'Yes — and we'd need dedicated training.'", "personalEx": "A friend vents about feeling stuck in their apartment and job: 'It sounds like you're not even mad at any one thing — you just feel boxed in and ready for a real change. Am I reading that right?' They exhale: 'Honestly, yeah, I didn't realize how claustrophobic I felt.'", "nonEx": "Saying 'What I hear you saying is you feel abandoned by your manager because of authority trauma' (clinical + mind-reading), OR arguing when corrected ('Well that's basically what you just said').", "decisionRule": "Loop whenever emotions are high, stakes matter, or misunderstanding appears — always BEFORE giving advice or counter-arguing. Offer advice (Weger et al.) only after they confirm your loop AND signal they want practical ideas.", "handoff": "Log Five Loops on Friday (2+ Office, 2+ Personal) capturing Conversation Type, Distilled Loop, Confirmed/Corrected reply, and What Shifted. Aim for at least 2 corrections.", "layer3Title": "Optional Deepening · Eugene Gendlin (Focusing) & Kegan/Lahey", "layer3Body": "Kegan & Lahey describe real active listening as 'empathically taking up temporary residence in the other's meanings.' Gendlin's Focusing adds the cleanest guardrail against over-interpreting: 'We listen for what they mean to convey, and add nothing else. It makes for maximal closeness with minimal imposition.'", "deepNote": {"label": "Loop vs. Advice Decision Matrix (Weger et al. · Rung 6)", "body": "Weger et al. (2014) found active listening beat advice on feeling understood, while tying on overall satisfaction. Use this decision split: LOOP FIRST when emotion is elevated, stakes are relational, or you sense a misunderstanding. GIVE ADVICE DIRECTLY when time is urgent (catching a flight), the lane is pure Practical logistics, or they explicitly confirm your loop and ask 'What would you actually do here?'"}}], "prompt": "Pick one upcoming conversation where you usually jump into Expert/Fixer mode. Write your natural meta-question and one sentence you'll use to welcome a correction if your loop misses.", "orig": {"belt": "blue", "name": "Which conversation is this?", "lead": "Notice whether a conversation is practical, emotional or social, match it first, and only then move it if it needs moving.", "teaching": [{"t": "h", "text": "Concepts"}, {"t": "steps", "items": [{"name": "The three conversations (Duhigg).", "md": "Practical: decisions, plans, logistics. Emotional: feelings, being heard. Social: identity, who we are, how we see each other (Source: Supercommunicators p. 246)."}, {"name": "The matching principle.", "md": "Connection starts when you meet the other person in the conversation they are having (Source: pp. 256–257). If they are emotional, be emotional first. If practical, be practical first."}, {"name": "The fixer trap.", "md": "Answering an emotional conversation with a practical one. It is the Achiever's and the Expert's most common Bond failure (Grid: Achiever × Bond, \"Relationships managed like projects\"; Expert × Bond, \"corrects instead of connects\")."}, {"name": "The quiet negotiation.", "md": "At the start of a conversation people silently agree its rules (are we venting or fixing?). Make it explicit when unsure: \"Do you want ideas, or do you want me to just listen?\" (Duhigg's meta-conversation)."}, {"name": "Deep questions.", "md": "Questions about values, beliefs and experiences, not facts: \"What's the best part of that job?\" instead of \"Where do you work?\" (Source: Supercommunicators pp. 279, 294). Brooks' versions: big questions and \"take me back\" questions (\"How did you decide to leave New York?\") (Source: How to Know a Person pp. 82–87)."}, {"name": "Looping for understanding.", "md": "Ask, listen, repeat back in your own words what you heard, and ask if you got it right (Source: Supercommunicators pp. 303–309). It is the Read check-back from B2 used as a Bond move."}, {"name": "Social conversations and identity threat.", "md": "When someone feels a core identity judged, the conversation becomes social whether anyone says so or not, and nothing practical lands until it is addressed (Source: Supercommunicators pp. 313–315). For you this cuts both ways: when your accent or intelligence is questioned, you are suddenly in a social conversation inside a practical one."}]}], "drill": "Name the conversation. In every meaningful conversation today, silently label it practical, emotional or social within the first minute, and notice when it changes. Once a day, ask the meta-question out loud.", "office": "When a colleague brings you a problem with feeling in it, give one sentence to the feeling before the fix: \"That sounds like a frustrating week. Want to walk through the reconciliation together?\"", "personal": "When a friend vents, match before anything else. Loop once. Only offer a solution if they ask, or after you ask.", "deliverable": {"name": "Five loops", "md": "Five conversations where you looped for understanding, written down: what you said back, and whether they confirmed it (\"yes, exactly\", or a correction). A correction counts as success; it means the loop worked.\n\n**Watch for.** Using deep questions to stay hidden. A string of excellent questions with nothing offered back is the anonymous listener's armor (Brooks, Duhigg). B6 and Brown Belt fix the other half."}, "deepened": {"original": "top", "parts": [{"n": 1, "title": "Part 1 · Duhigg: three conversations and the matching principle", "anchor": 1, "from": 2, "pre": [{"t": "note", "label": "Lens card", "md": "Charles Duhigg, a journalist, wrote *Supercommunicators* (2024), drawing on research and stories about people who connect well. His claim is that most discussions are one of three conversations, practical, emotional or social, and that connection fails when two people are in different ones. The matching principle says to notice which one the other person is in and meet them there first. What is distinctive is that the remedy is a question about the conversation itself: are we venting or fixing?"}, {"t": "note", "label": "Why Duhigg here", "md": "This module is built on his three conversations and his idea of looping for understanding."}, {"t": "note", "label": "Native use", "md": "Popular nonfiction for general readers, synthesizing research and interviews."}, {"t": "note", "label": "Limit", "md": "Journalism that draws on studies (label: popular synthesis). The three-conversation split is his framing; some of the research he draws on is tested, but the framework as a whole is not. Real conversations shift between types quickly."}, {"t": "h", "text": "Mismatches and the first move"}, {"t": "table", "head": ["They are in", "You answer with", "What it feels like to them", "Match first with"], "rows": [["Emotional", "A practical fix", "Not heard", "One sentence to the feeling"], ["Practical", "Feelings talk", "Slowed down", "A concrete next step"], ["Social (identity)", "Facts", "Dismissed as a person", "Acknowledging who they are"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "When did you interpret a moment where one person was emotional and the other answered practically? What happened next?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what are Duhigg's three conversations, and what is the matching principle?"}, {"name": "Make sense (rung 2).", "md": "Write one example of each type and one non-example: a conversation that looks practical but is social."}, {"name": "Find it in your life (rung 3).", "md": "Write three conversations that went wrong. For each, label what you were in and what they were in. Only then rate which mismatch you make most, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does fixing protect for you? What does it cost a friend who wanted to be heard?"}, {"name": "Connect (rung 5).", "md": "When your accent or intelligence is questioned, you are suddenly in a social conversation. How does that link to your W2 Expert fallback? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "Is \"Do you want ideas, or should I just listen?\" natural in Spanish among friends, or does it sound clinical? What would you say instead?"}, {"name": "Test (rung 7).", "md": "Ask the meta-question once in a real conversation this week. Before you do, predict their answer. Afterward, record what they said. Write what result would show you already matched without asking."}, {"name": "Catch it live (rung 8).", "md": "What is the urge you feel just before you offer a fix?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your episodes, your labels or your ratings."}]}, {"n": 2, "title": "Part 2 · Brooks: deep questions and \"take me back\"", "anchor": 1, "from": 2, "pre": [{"t": "note", "label": "Lens card", "md": "David Brooks, a columnist, wrote *How to Know a Person* (2023) about the skill of seeing others well. He contrasts diminishers, who make people feel unseen, with illuminators, who make them feel understood, and he recommends big questions and \"take me back\" questions that invite a person to tell how they became who they are. What is distinctive is that a question is treated as an act of respect: it says your story is worth hearing."}, {"t": "note", "label": "Why Brooks here", "md": "The module's deep questions come from Brooks and Duhigg. B5 uses his illuminator idea; this part covers his questions."}, {"t": "note", "label": "Native use", "md": "Popular nonfiction about friendship and character, drawing on research and his own experience."}, {"t": "note", "label": "Limit", "md": "Popular synthesis and personal reflection (label: popular synthesis). Some related research supports that deeper conversations feel better than people expect, but the method itself is not tested here. Brooks himself warns that the listener who never discloses stays unknown."}, {"t": "h", "text": "Question types and what they open"}, {"t": "table", "head": ["Type", "Example", "What it opens", "Risk"], "rows": [["Fact question", "\"Where do you work?\"", "Information", "Stays on the surface"], ["Deep question", "\"What's the best part of that job?\"", "Values and experience", "Too soon, it intrudes"], ["Take me back", "\"How did you decide to leave New York?\"", "A story about who they became", "Can feel like an interview"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "As an interpreter you asked others' questions, not your own. Which question do you most like to be asked?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what is an illuminator, and why does Brooks prefer big questions?"}, {"name": "Make sense (rung 2).", "md": "Turn three fact questions into deep questions. Then write a non-example: a \"deep\" question that is really a test."}, {"name": "Find it in your life (rung 3).", "md": "Write three conversations where a question opened someone up, or closed them down. Only then rate how often you ask deep questions and how often you answer them, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What do great questions protect for you, such as not having to reveal yourself? What do they cost?"}, {"name": "Connect (rung 5).", "md": "Pair a deep question with something of your own you could offer back, as B6 and Br4 ask. State a guess about how the other person would respond and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "In some cultures personal questions to a near-stranger are rude. Where would Brooks's questions fail? What would you ask instead?"}, {"name": "Test (rung 7).", "md": "Ask one take-me-back question and offer one small true thing back, in a low-stakes conversation. Before you do, predict the response. Afterward, record what they said. Write what result would show the question did not open anything."}, {"name": "Catch it live (rung 8).", "md": "When someone asks you a deep question, what do you do first: answer, or turn it back?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your episodes, your questions or your ratings."}]}, {"n": 3, "title": "Part 3 · Rogers: reflective listening and the loop", "anchor": 1, "from": 2, "pre": [{"t": "note", "label": "Lens card", "md": "Carl Rogers, a founder of person-centered therapy, and Richard Farson wrote \"Active Listening\" (1957), describing listening that reflects back the speaker's meaning and feeling so they feel understood. Looping for understanding, which Duhigg describes, is a form of it: ask, listen, say back what you heard, and ask whether you got it right. What is distinctive in Rogers is the attitude behind the technique: genuineness, acceptance and empathy, without which reflecting turns into parroting."}, {"t": "note", "label": "Why Rogers here", "md": "This module's loop is his reflective listening used as a Bond move."}, {"t": "note", "label": "Native use", "md": "Therapy and later workplace and teaching settings."}, {"t": "note", "label": "Limit", "md": "There is tested research on active listening, though modest. One experiment by Weger and colleagues found that people who received active listening felt more understood than those who got advice or simple acknowledgement, but the differences were small, and active listening and advice did not differ on satisfaction (label: tested research, small effects). A mechanical loop can sound scripted."}, {"t": "h", "text": "The loop, and how it fails"}, {"t": "table", "head": ["Step", "What you do", "How it fails"], "rows": [["Ask", "One open question", "A string of questions with nothing offered back"], ["Listen", "Without preparing your reply", "Waiting to speak"], ["Say back", "Their meaning in your words", "Repeating their words exactly"], ["Check", "\"Did I get that right?\"", "Not waiting for the answer"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "As an interpreter, you render meaning, not words. How is that like and unlike looping for understanding?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what did Rogers mean by active listening, and what attitude did he say it needs?"}, {"name": "Make sense (rung 2).", "md": "Write one loop for a short statement, then a non-example: a reflection that adds your interpretation."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you felt really understood, and what the other person did. Only then rate how often you loop with others, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does looping protect for you, such as staying the listener? What does it cost?"}, {"name": "Connect (rung 5).", "md": "A correction after a loop counts as success. How does that change your W2 Expert need to be right? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "The study above found active listening and advice about equal on satisfaction. When is advice the better gift?"}, {"name": "Test (rung 7).", "md": "Do the deliverable: five loops. Before each, predict whether they will confirm or correct. Afterward, record their exact words. Write what result would show looping does not help you connect."}, {"name": "Catch it live (rung 8).", "md": "What is the sign that you are reflecting with attention, not by script?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your loops, your episodes or your ratings."}]}], "connect": {"title": "Connect and argue: the three lenses side by side", "blocks": [{"t": "p", "md": "Everything in this section is Interpretation: my reading across the sources, to be tested against your episodes."}, {"t": "table", "head": ["Source", "Starts from", "Treats connection as", "Would worry that you..."], "rows": [["Duhigg", "The type of conversation", "Meeting them where they are", "Fix when they want to be heard"], ["Brooks", "The questions you ask", "Being seen as a person", "Ask without offering back"], ["Rogers", "The attitude of the listener", "Understanding reflected", "Loop mechanically"]]}, {"t": "p", "md": "**Where they meet.** Each puts the other person's experience first and checks whether it has been grasped."}, {"t": "p", "md": "**Where they collide.** Brooks and Duhigg both warn that pure listening keeps the listener hidden; Rogers's therapist role is deliberately one-sided. Friendship needs both directions."}, {"t": "p", "md": "**What the three miss for you.** Professional listening was your job; in friendship it can become a role you hide in. None of the sources speaks to people trained to listen for a living."}, {"t": "p", "md": "**Where it sits in your own frameworks.** Heart with others in your Orders Grid, and Buber's turning toward the other. Return to this module later and add dated notes; do not overwrite."}]}, "research": {"title": "Research further: three threads to pick from", "blocks": [{"t": "p", "md": "These are gaps the sources left open. Replace them with your own questions whenever you have them."}, {"t": "table", "head": ["Thread", "Question it opens", "Why it connects", "Suggested depth"], "rows": [["1. Do deep conversations work with strangers?", "What does research show about how people expect and experience deep talk with strangers?", "Part 2 recommends deep questions", "One thread, researched with the research-brief skill"], ["2. When does listening backfire?", "When does reflective listening feel scripted or intrusive, and across which cultures?", "Part 3's effects are small", "One thread, with a critic pass"], ["3. The listener who stays hidden", "What does research say about one-sided disclosure in friendships?", "Your named edge", "Full deepening of Part 2"]]}], "prompt": "Use curriculum-module in deepen mode on Blue Belt B4, Part {part}, one thread. My question: {q}. Why it pulled me: {why}. What I already think: {think}. Verify sources with research-brief first, write into the part's Deepened section, and do not write my entries."}}}}, {"id": "B5", "num": 5, "title": "Bonding, Labels and the Empathy Boundary", "subtitle": "Name what is under the surface, cross difference without losing yourself, and hold compassion with a boundary.", "guardrail": "Surveillance vs. Care: Understanding is NOT agreement. In the office dojo, labels disarm tension; in the personal dojo, labels are witnessing, not technique. Never use bespoke bonding to flatter someone you care nothing for.", "assembly": [{"day": "Mon", "step": "Part 1 · Chris Voss", "ingredient": "No-'I' Labels, Dynamic Silence & Fearless Accusation Audits"}, {"day": "Tue", "step": "Part 2 · Milton Bennett", "ingredient": "Platinum Rule & 6-Step Empathy (Step 6: Re-Establish Self)"}, {"day": "Wed", "step": "Part 3 · Singer & Klimecki", "ingredient": "Empathic Distress vs. Compassion & Period-Not-'But' Formula"}, {"day": "Thu", "step": "Deliberate Practice Lab", "ingredient": "60s Label Minute Trainer + Period-vs-'But' Linter"}, {"day": "Fri", "step": "Deliverable Workshop", "ingredient": "Two Accusation Audits + Three Boundary Sentences"}], "parts": [{"day": "Monday · Part 1", "author": "Chris Voss", "title": "Labels and the Accusation Audit", "lens": "Never Split the Difference (2016) & MasterClass notes. Practitioner tactical empathy built on neutral labeling, Dynamic Silence, Mislabeling, and fearless pre-emptive Accusation Audits.", "mechanism": "Drop the word 'I' ('It seems/sounds/looks like...' — never 'I understand' or 'I'm hearing'), because 'I' raises defenses and makes you own any offense. Follow every label with 3-4 seconds of Dynamic Silence — no question marks, no 'but.' If your label is slightly wrong (Mislabeling), they will correct you and hand over the real issue. For an Accusation Audit, brainstorm the 5 worst fair criticisms they could think about you, pick the sharpest 2-3, deliver them boldly up front, and pause.", "tableTitle": "Voss's Tactical Empathy Toolkit — Syntax, Mechanism & Failure Modes", "tableHead": ["Move", "Exact Syntax", "Why It Works", "Office Example", "Personal Example", "Failure Mode"], "tableRows": [["Clean Label + Dynamic Silence", "'It seems / sounds / looks like [feeling/concern].' + [3s silence]", "Drops 'I' (lowers guard); invites elaboration or revealing correction.", "'It sounds like Q4 bandwidth is the biggest risk here.' [silence]", "'It sounds like you've been carrying this alone all week.' [warm silence]", "'It sounds like you're stressed, BUT we need this Friday.'"], ["Claim ('I understand')", "'I understand how you feel.'", "Triggers 'No, you don't' and shifts focus to your claim.", "Avoid. Name what makes sense instead.", "Avoid. Witness their specific weight instead.", "'I totally understand, my week was awful too.'"], ["Accusation Audit", "'You're probably going to think [worst fair accusation 1 & 2].' + [silence]", "Drains sting before defensiveness hardens; invites 'You're being too hard on yourself.'", "'You're probably thinking I'm pushing for a title bump during Q4 freezes and ignoring bandwidth.'", "'You might feel like I've been flaking and only reaching out when convenient.'", "'I'm sorry I'm such a terrible friend, you must hate me.' (Groveling)"]], "officeEx": "Opening your promotion talk with an Accusation Audit: 'Before we dive in, it might seem like I'm bringing this up at a tough moment with Q4 freezes, or that I'm only focused on a title rather than team bandwidth.' [3s pause]. Manager: 'No, I know you've been carrying Senior scope — budget is just messy.'", "personalEx": "Declining a close friend's weekend trip without groveling: 'I'm worried it's going to feel like I'm bailing on you again, or that your trip isn't a priority for me.' [warm pause]. Then affirm the friendship and give a clean no.", "nonEx": "Delivering an Accusation Audit with self-pity ('I know I'm the worst friend ever...' — forcing them to comfort you), OR coldly running labels in a personal argument to extract a concession.", "decisionRule": "Use labels + dynamic silence when tension rises; use an Accusation Audit at the opening of bad news or a hard ask. Stop in the personal dojo if you feel yourself 'running a play' — return to witnessing.", "handoff": "Build your Office and Personal Accusation Audits on Friday using the 5-item brainstorm -> top 2-3 filter (zero 'I' defensiveness, zero groveling).", "layer3Title": "Optional Deepening · I-Thou Relations Communication Outline", "layer3Body": "In the corporate dojo, Voss's tactical empathy extracts data and builds leverage. In the personal dojo, keep the linguistic humility of a tentative label ('It sounds like...') while stripping out the agenda. Litmus test during the silence: are you waiting for a concession, or simply sitting with them?", "deepNote": {"label": "Voss's Three Voices (Delivery Mechanics)", "body": "A label's words fail if the vocal tone contradicts them. Voss teaches 3 voices: (1) Positive / Playful Voice (your default — light, warm, encouraging); (2) Late-Night FM DJ Voice (slow, calm, downward-inflected at the end — used for labels, boundaries, and de-escalation so a label never sounds like a sharp question); (3) Direct / Assertive Voice (rarely used; triggers defensiveness)."}}, {"day": "Tuesday · Part 2", "author": "Milton J. Bennett", "title": "Empathy Across Difference", "lens": "'Overcoming the Golden Rule: Sympathy and Empathy' (1979) & Basic Concepts of Intercultural Communication. Intercultural theory contrasting Sympathy (assuming sameness / projection) with Platinum-Rule Empathy across 6 disciplined steps.", "mechanism": "The Golden Rule ('treat others as you'd like') projects your own values across difference. Bennett's Empathy moves through 6 steps: (1) Assume Difference -> (2) Know Yourself -> (3) Suspend Yourself -> (4) Imaginative Leap -> (5) Empathic Experience -> (6) Re-Establish Yourself. Step 6 is the one people skip — causing over-understanding and self-erasure. Use the 2-Step Re-Establishment Anchor: Somatic Return (feet down, exhale) + Mental Separation ('That is their map. Here is mine.').", "tableTitle": "Bennett's 6-Step Empathy Cycle — Execution & Failure Modes", "tableHead": ["Step", "What You Actually Do", "Failure Mode If Skipped", "Quick Internal Cue"], "tableRows": [["1. Assume Difference", "Treat their perspective as an unknown map, not a mirror of yours.", "Sympathy / Projection ('If I were them, I'd want directness').", "'They may not experience this the way I do.'"], ["2. Know Yourself", "Name your own stance, values, and W1/W3 tells first.", "Unconscious bias or flooding mid-conversation.", "'Here is where I stand and what matters to me.'"], ["3. Suspend Yourself", "Hold your judgment/rebuttal in pause mode temporarily.", "Arguing internally while they talk; interrupting.", "'Pause my rebuttal; just map their world.'"], ["4. Imaginative Leap", "Imagine how this looks from their history, culture, and constraints.", "Guessing from stereotypes instead of their words.", "'Given their constraints, how does this look?'"], ["5. Empathic Experience", "Grasp the internal coherence of their feeling.", "Cold intellectualizing that never feels human.", "'Inside their frame, this makes sense.'"], ["6. Re-Establish Yourself", "Physically and verbally return to your own frame & boundary.", "Over-Understanding / Self-Erasure: excusing harm or dropping your ask.", "'That is their map. Here is mine.'"]], "officeEx": "A colleague from a high-hierarchy background stays quiet in a meeting, then emails detailed objections. Steps 1-5: you recognize contradicting a peer in front of a director violates her norm. Step 6 (Re-establish): you thank her warmly for the notes AND hold your timeline: 'Let's integrate points 1 and 2; point 3 pushes us past Q3, so we'll hold scope there.'", "personalEx": "A friend from a drop-in family culture feels hurt when you ask for notice before visits. Steps 1-5: spontaneous visits mean warmth to them. Step 6: 'I get that dropping by feels like family to you. For me, I recharge alone and need a heads-up so I can actually be present when you're here.'", "nonEx": "Understanding so deeply why a stressed friend lashed out (Steps 1-5) that you skip Step 6, swallow your anger, and say 'It's totally fine, I know you're going through a lot' — erasing your own dignity.", "decisionRule": "Run Steps 1-5 whenever someone's reaction baffles you across difference. Never skip Step 6 — especially when W3 over-intellectualization is active. Even across a power gap, run Step 6 internally so you never internalize their frame as truth.", "handoff": "Use Step 5 to write the first half (validation) and Step 6 to write the second half (your re-established boundary) of your three Friday boundary sentences.", "layer3Title": "Optional Deepening · Deborah Tannen (That's Not What I Meant!)", "layer3Body": "Tannen cites Thomas Kochman's example of an office worker with a bandaged arm who felt rejected when her colleague didn't ask about it — because her norm read asking as care, while her colleague's norm read not intruding as respect. Assuming difference (Bennett Step 1) turns a perceived insult back into a norm mismatch before resentment locks in.", "deepNote": {"label": "The Asymmetric Empathy Trap Across Power Gaps (Rung 6)", "body": "Across power gaps (e.g., employee to executive, minority speaker to dominant-culture room), people with less power are routinely expected to run Bennett Steps 1–5 upward without receiving empathy back. That creates the Asymmetric Empathy Trap: internalizing a boss's unfair frame as objective reality. In unequal rooms, Step 6 (Re-Establish Yourself) is mandatory internally — hold your own reality intact even when you choose tact outwardly."}}, {"day": "Wednesday · Part 3", "author": "Tania Singer & Olga Klimecki", "title": "Empathy, Compassion and the Boundary", "lens": "Singer & Klimecki (2014, Current Biology) on neural differences between empathy and compassion, plus Paul Bloom's Against Empathy (2016) critique of spotlight-biased empathy.", "mechanism": "Empathy ('feeling with') activates pain/threat networks (amygdala, insula) and causes Empathy Fatigue (burnout, withdrawal, excusing). Compassion ('feeling for') keeps mindful self-other distinction intact, activating care/reward networks for resilience and steady action. Combine compassion with White Belt Guard using the Period-Not-'But' Formula: [Validate the emotion with a label]. [Hard Period + 1s pause.] [Clean boundary]. Never use 'but' (or 'pero') — it erases the validation.", "tableTitle": "Empathic Distress vs. Compassion vs. The Empathy Boundary", "tableHead": ["Response", "Neural & Somatic Signature", "Self–Other Boundary", "What It Produces", "Concrete Verbal Form"], "tableRows": [["1. Empathic Distress (Feeling WITH)", "Pain/threat centers fire; chest tight, jaw clenched, urgency.", "Collapsed: their distress feels like your emergency.", "Burnout, withdrawal, or excusing harmful behavior.", "'I know you're so stressed, don't worry, I'll just cover it again.' (Cancels boundary)"], ["2. Compassion (Feeling FOR)", "Care/warmth networks fire; steady breath, grounded feet, clear head.", "Intact: 'You are hurting, and I am steady enough to care.'", "Warmth, stamina, clear presence (vital in interpreting).", "'That sounds genuinely heavy. I'm right here with you.'"], ["3. Empathy Boundary (Compassion + Guard)", "Warm chest + firm spine; calm voice, zero defensive spike.", "Clear & Dual: validates feeling, judges behavior.", "Connection without surrender; honors dignity on both sides.", "[Label the feeling]. [Full Period.] [Clean boundary]. (Never 'but')"]], "officeEx": "A panicked client issues an ultimatum ('Cut 15% today or we walk'). Instead of absorbing their panic or fighting back: 'It sounds like leadership is putting real pressure on you to bring back a lower number by Friday. [period] An ultimatum on the rate still won't get us there — here are two scope options that fit your budget.'", "personalEx": "A friend going through a breakup snaps sarcastically at you for the third time: 'It sounds like you're still carrying a ton of hurt from the breakup, and I care about you. [period] I'm not okay with being snapped at when we hang out — if that happens again tonight, I'll head home and we can talk tomorrow.'", "nonEx": "'It sounds like you're really stressed, SO I totally understand why you yelled — just maybe try not to next time if you can?' (Validation cancels boundary and slides back into plea syntax).", "decisionRule": "Check your body first: if your stomach drops or you feel an urgent pull to rescue them to stop your own discomfort, you're in empathic distress — exhale into compassion and apply Period-Not-'But.' Stop after 1 validation sentence.", "handoff": "Draft your three 'validate the emotion, hold the boundary' sentences on Friday strictly using Label + Full Period + Clean Boundary (zero 'but', zero apologies).", "layer3Title": "Optional Deepening · Neff & Germer (Mindful Self-Compassion) & Shapiro", "layer3Body": "Neff & Germer note that mindfulness is the exact ingredient in compassion that prevents fusion: silently naming your own empathic distress ('This is hard; I'm feeling overwhelmed') restores self-other distinction in real time. And Daniel Shapiro seals the boundary: 'feeling compassion for someone does not preclude your seeking justice for any wrongdoing.'", "deepNote": {"label": "Paul Bloom's 'Against Empathy' & Its Counter-Argument (Rung 6)", "body": "Paul Bloom (Against Empathy, 2016) argues emotional empathy ('feeling with') is a poor guide to action because it acts like a narrow, biased spotlight — favoring one vivid person who looks like us over fairer principles or larger consequences, and is easily weaponized. His alternative is Rational Compassion (caring about wellbeing guided by clear-eyed judgment). What Bloom's critique misses for friendship and interpreting: in intimate and cross-cultural rooms, brief attuned resonance (feeling felt) is often the only bridge that lets someone trust you enough to hear clear-eyed judgment."}}], "prompt": "Name one situation where you reliably over-understand and excuse behavior. Draft one Period-Not-'But' sentence and check where in your body you feel the pull to soften it.", "orig": {"belt": "blue", "name": "Bonding, labels and the empathy boundary", "lead": "Make people feel met in their own currency, use labels to name what is under the surface, and keep understanding separate from agreement.", "teaching": [{"t": "h", "text": "Concepts"}, {"t": "steps", "items": [{"name": "Bespoke bonding (Curriculum, Layer 2 Module 3).", "md": "You cannot bond with everyone the same way:"}]}, {"t": "table", "head": ["Currency", "What bonding looks like", "Example"], "rows": [["Accuracy", "Through shared craft: precise, methodology questions", "\"Walk me through how you got to that tolerance.\""], ["Results", "Through shared goals: reliability, pace, instrumental empathy", "\"If these dates slip, the whole Q3 plan stalls for you.\""], ["Approval", "Through inclusion: \"we\" language, explicit appreciation", "\"How are we going to solve this?\""], ["Advantage", "Through acknowledging leverage without submitting", "\"It seems you have the authority to walk away if the terms don't work for you.\""], ["Context", "Through curiosity about their frame", "\"How does this look from where you sit?\""]]}, {"t": "steps", "items": [{"name": "Labels (Voss).", "md": "\"It seems like…\", \"It sounds like…\", \"It looks like…\" — a tentative name for the emotion or concern under what was said, then silence. Avoid \"I understand\", which invites \"no, you don't\" (Source: Never Split the Difference pp. 54–57, as reported)."}, {"name": "The accusation audit.", "md": "Before bad news or a hard ask, name the worst things they might be thinking: \"You're going to think we're ignoring your timeline and trying to lock you in.\" Naming the fear first takes the sting out (Source: Voss; Curriculum, Layer 2 Module 3)."}, {"name": "The empathy pause.", "md": "A label followed by a counter-argument is not a label. Say it, then stop and let it land."}, {"name": "Illuminators and diminishers (Brooks).", "md": "Diminishers make people feel small and unseen; illuminators make them feel lit up and understood. The illuminator's posture is curiosity, respect and accompaniment, being with someone without hurrying to fix (Source: How to Know a Person pp. 32–50, as reported)."}, {"name": "Empathy across difference (Bennett).", "md": "The Golden Rule (\"treat others as you'd like to be treated\") assumes sameness; the Platinum Rule treats others as *they* would like (Source: BCIC p. 67). Bennett's empathy steps: assume difference, know yourself, suspend yourself, make the imaginative leap, experience their reality, re-establish yourself (Source: BCIC pp. 33–34, 71). The last step is the one people skip, and skipping it is how empathy turns into losing yourself."}, {"name": "The empathy boundary.", "md": "The Pluralist's shadow in the Bond and Guard columns: \"Empathy without boundaries\" and \"Excuses behavior\" (Grid). The move is to validate the emotion and hold the boundary on the behavior in the same breath: \"It seems you're under huge pressure to close by Friday. An ultimatum on the price still won't get us there.\" (Curriculum)"}, {"name": "Understanding is not agreement.", "md": "You can fully understand why someone does something and still say no to it. For you, this is the belt's hardest line. White Belt's rule stays: judge actions, not intentions."}]}], "drill": "The label minute. Once a day, keep a conversation going for 60 seconds using only labels, no questions or statements, based on what the other person just said (a partner drill, or with Claude). Outside the drill, use one real label a day.", "office": "Write an accusation audit for your next hard meeting: the three most accurate accusations they could make about your proposal, scripted into an opening.", "personal": "Use labels as witnessing, not technique: \"It sounds like you're carrying a lot and feel alone in it.\" Hold the silence because you are with them, not because the pause is tactical. (The I-Thou track takes this further.)", "deliverable": {"name": "Two audits and a boundary sentence", "md": "One accusation audit for an office conversation, one for a personal one, and three \"validate the emotion, hold the boundary\" sentences for situations where you know you tend to over-understand.\n\n**Watch for.** Bespoke bonding as manipulation. Matching someone's currency to get something from them while caring nothing for them is the Opportunist's Bond shadow (\"Affection as currency\", Grid). The check is White Belt's question."}, "rehearse": {"drill": "P4", "mode": "B5 · the label minute", "dojo": "stance"}, "deepened": {"original": "top", "parts": [{"n": 1, "title": "Part 1 · Voss: labels and the accusation audit", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Chris Voss, a former FBI lead international kidnapping negotiator, wrote *Never Split the Difference* (2016) with Tahl Raz. He teaches tactical empathy: labels (\"It seems like…\", \"It sounds like…\") that name the emotion under what someone said, followed by silence, and the accusation audit, naming the worst things the other side may think before they say them. What is distinctive is that empathy is used as a deliberate move in a negotiation, not as agreement."}, {"t": "note", "label": "Why Voss here", "md": "Labels and the accusation audit are this module's main tools."}, {"t": "note", "label": "Native use", "md": "Crisis and hostage negotiation, then business negotiation."}, {"t": "note", "label": "Limit", "md": "Practitioner theory (label: practitioner theory). The claim that labels lower intensity has support from the affect-labeling research in W1 Part 2, but that research is about labeling one's own feelings in a lab, not having them named by another person. The original curriculum's oxytocin and amygdala claims were already removed."}, {"t": "h", "text": "Label, question, or claim"}, {"t": "table", "head": ["Form", "Example", "Effect it aims for"], "rows": [["Label", "\"It sounds like this timeline worries you.\"", "Names it tentatively; invites correction"], ["Claim", "\"I understand.\"", "Often invites \"No, you don't.\""], ["Question", "\"Are you worried about the timeline?\"", "Can feel like an interview"], ["Accusation audit", "\"You're going to think we're ignoring your timeline.\"", "Takes the sting out first"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "In a hard session, when did someone name a feeling in the room and change it?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what is a label, what is an accusation audit, and where did Voss develop them?"}, {"name": "Make sense (rung 2).", "md": "Write a label for something a friend said recently. Then a non-example: a label followed by a counter-argument."}, {"name": "Find it in your life (rung 3).", "md": "Write three moments when you said \"I understand\" or argued too soon. Only then rate how often you pause after naming something, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does a counter-argument right after a label protect? What does the silence cost you?"}, {"name": "Connect (rung 5).", "md": "Write an accusation audit for your promotion conversation. Which accusation touches your W3 hidden commitment? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "Tactical empathy is empathy used for an outcome. In the personal dojo, when does a label become technique instead of witnessing?"}, {"name": "Test (rung 7).", "md": "Do the label minute with Claude or a friend. Before you start, predict where you will break into a question. Afterward, note what happened. Write what result would show labels did not open the conversation."}, {"name": "Catch it live (rung 8).", "md": "What do you feel in the silence after a label?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your labels, your audits or your ratings."}]}, {"n": 2, "title": "Part 2 · Bennett: empathy across difference", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Milton J. Bennett, an intercultural communication scholar, contrasted sympathy and empathy in \"Overcoming the Golden Rule\" (1979): the Golden Rule, treat others as you would like to be treated, assumes everyone is like you; empathy imagines the other's experience from their frame, which he summarized as a Platinum Rule. He also gives steps for empathy, ending with re-establishing yourself. Bennett later built the Developmental Model of Intercultural Sensitivity, taken up in Black Belt. What is distinctive here is that empathy starts by assuming difference, not sameness."}, {"t": "note", "label": "Why Bennett here", "md": "The module's empathy steps come from him, and the last one, re-establishing yourself, is the step that keeps empathy from becoming losing yourself."}, {"t": "note", "label": "Native use", "md": "Intercultural training and education."}, {"t": "note", "label": "Limit", "md": "Theory from intercultural communication practice (label: theory with case evidence). The steps are a teaching model, not a tested procedure."}, {"t": "h", "text": "Sympathy and empathy"}, {"t": "table", "head": ["", "Sympathy (Golden Rule)", "Empathy (Platinum Rule)"], "rows": [["Assumes", "They are like me", "They may differ from me"], ["Asks", "How would I feel?", "How do they experience this?"], ["Risk", "Projection", "Losing yourself, unless you re-establish yourself"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "As a third-culture kid, when did someone treat you \"as they would want to be treated\" and miss you completely?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: why does Bennett say the Golden Rule fails across difference?"}, {"name": "Make sense (rung 2).", "md": "Give one example of sympathy and one of empathy for the same situation. Then a non-example: empathy without re-establishing yourself."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you imagined someone's experience. For each, write whether you returned to your own view afterward. Only then rate how often you skip the last step, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does staying in their frame protect for you? What does it cost your own position?"}, {"name": "Connect (rung 5).", "md": "Link the last step to over-understanding from White Belt. State a guess and what would show it wrong. In your Orders Grid this sits in Heart with self."}, {"name": "Argue (rung 6).", "md": "Is Bennett's empathy possible across power gaps, for example toward someone who has power over you? What changes?"}, {"name": "Test (rung 7).", "md": "In one conversation this week, write their likely frame beforehand, then after it write your own view again in one sentence. Before you begin, predict whether your view will change. Afterward, record whether it did. Write what result would show you lost your own position."}, {"name": "Catch it live (rung 8).", "md": "What is the sign that you have stayed in their frame too long?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your episodes, your views or your ratings."}]}, {"n": 3, "title": "Part 3 · Singer and Klimecki: empathy, compassion and the boundary", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Tania Singer and Olga Klimecki, neuroscientists, distinguished empathy, feeling with another person, from compassion, feeling for them with warmth and a wish to help. Their research suggests that sharing another's distress can turn into empathic distress, which leads to withdrawal and burnout, while compassion training was linked to more positive feeling and helping. Paul Bloom's *Against Empathy* (2016) makes a related argument for general readers. What is distinctive is that caring about someone does not require taking on their feeling."}, {"t": "note", "label": "Why Singer and Klimecki here", "md": "The empathy boundary, understanding without agreeing, is this module's hardest line for you. This part gives a way to stay warm without being flooded."}, {"t": "note", "label": "Native use", "md": "Laboratory and training studies in affective neuroscience."}, {"t": "note", "label": "Limit", "md": "Tested research, with small samples in some studies and debate about how to define the terms (label: tested research). Bloom's argument is a popular book. Neither tells you when to hold a boundary; that judgment stays yours."}, {"t": "h", "text": "Three responses to someone's pain"}, {"t": "table", "head": ["Response", "What happens in you", "What it tends to lead to"], "rows": [["Empathic distress", "You feel their pain as yours", "Withdrawal, burnout, excusing"], ["Compassion", "Warmth and a wish to help", "Helping while staying steady"], ["Understanding plus boundary", "You grasp why, and still say no to the behavior", "Care without giving in"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "In psychiatric or medical sessions, how did you stay steady while rendering someone's pain? What did it cost you afterward?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: how do Singer and Klimecki distinguish empathy from compassion?"}, {"name": "Make sense (rung 2).", "md": "Write a \"validate the emotion, hold the boundary\" sentence. Then a non-example: a validation that cancels the boundary."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you understood someone so well you excused them. Only then rate how often empathy becomes distress for you, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does feeling someone's pain protect: the bond, your sense of being good? What does it cost?"}, {"name": "Connect (rung 5).", "md": "Pair this with Simon's over-intellectualization from W3 Part 2. State a guess and what would show it wrong. In your Orders Grid this sits in Heart with self and Body."}, {"name": "Argue (rung 6).", "md": "Bloom argues against empathy as a guide to action. What does that miss about friendship and interpreting?"}, {"name": "Test (rung 7).", "md": "Use one boundary sentence in a real moment where you tend to over-understand. Before you do, predict what you will feel. Afterward, record their words and your body. Write what result would show the boundary did not hold."}, {"name": "Catch it live (rung 8).", "md": "What is the first body sign that you are taking on someone's feeling?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your sentences, your episodes or your ratings."}]}], "connect": {"title": "Connect and argue: the three lenses side by side", "blocks": [{"t": "p", "md": "Everything in this section is Interpretation: my reading across the sources, to be tested against your episodes."}, {"t": "table", "head": ["Source", "Starts from", "Treats empathy as", "Would worry that you..."], "rows": [["Voss", "The negotiation", "A move that lowers tension", "Counter-argue after a label"], ["Bennett", "Cultural difference", "Imagining their frame", "Never come back to your own"], ["Singer and Klimecki", "The listener's state", "Something that can become distress", "Excuse what you understand"]]}, {"t": "p", "md": "**Where they meet.** Each separates understanding from agreement, in different words."}, {"t": "p", "md": "**Where they collide.** Voss uses empathy for an outcome; the I-Thou track, and Singer's compassion, put the outcome down. The dojo and the Sanctuary differ on purpose."}, {"t": "p", "md": "**What the three miss for you.** Brooks's illuminator, in this module's original text, adds accompaniment: being with someone without hurrying to fix. None of the three lenses covers it."}, {"t": "p", "md": "**Where it sits in your own frameworks.** Heart with self and Heart with others in your Orders Grid; in IFS terms, compassion is often described as a quality of Self. Return to this module later and add dated notes; do not overwrite."}]}, "research": {"title": "Research further: three threads to pick from", "blocks": [{"t": "p", "md": "These are gaps the sources left open. Replace them with your own questions whenever you have them."}, {"t": "table", "head": ["Thread", "Question it opens", "Why it connects", "Suggested depth"], "rows": [["1. Labels from another person", "Is there research on the effect of someone else naming your emotion, as distinct from naming it yourself?", "Part 1 borrows from self-labeling research", "One thread, researched with the research-brief skill"], ["2. Interpreter burnout", "What does research say about vicarious trauma and empathic distress in interpreters?", "Part 3 links to your work", "One thread, with a critic pass"], ["3. Empathy debates", "What are the strongest responses to Bloom's case against empathy?", "Part 3 cites a contested argument", "Full deepening of Part 3"]]}], "prompt": "Use curriculum-module in deepen mode on Blue Belt B5, Part {part}, one thread. My question: {q}. Why it pulled me: {why}. What I already think: {think}. Verify sources with research-brief first, write into the part's Deepened section, and do not write my entries."}}}}, {"id": "B6", "num": 6, "title": "Going First — Initiation & Early Friendship", "subtitle": "End the wait to be approached: lead with warmth, beat the liking gap, and invite depth in consented steps.", "guardrail": "Surveillance vs. Care: Govern every rep by the 4 I-Thou Cautions — (1) Drop the playbook if it feels mechanical; (2) Never extract depth without a Green Light; (3) Honor the Linear Ladder Myth (low battery is a season, not rejection); (4) Adapt for cultural and neurodivergent styles.", "assembly": [{"day": "Mon", "step": "Part 1 · Fiske & Cuddy", "ingredient": "2x2 Warmth–Competence Matrix & 30s Warmth Gate"}, {"day": "Tue", "step": "Part 2 · Epley & Boothby", "ingredient": "Liking Gap Mechanics, Stop-Signs & 4-Tier Initiation Menu"}, {"day": "Wed", "step": "Part 3 · Arthur Aron", "ingredient": "Responsiveness, Ping Calibration & Green/Yellow/Red Protocol"}, {"day": "Thu", "step": "Deliberate Practice Lab", "ingredient": "6-Scenario Ping & Return Calibration Simulator"}, {"day": "Fri", "step": "Deliverable Workshop", "ingredient": "Contact & Ping Log + Liking-Gap Calculator"}], "parts": [{"day": "Monday · Part 1", "author": "Susan Fiske & Amy Cuddy", "title": "Warmth Before Competence", "lens": "Stereotype Content Model (Fiske, Cuddy, & Glick, 2002/2007). Tested social psychology showing humans evaluate Warmth (intent: 'am I safe?') before Competence (capability) across four distinct emotional quadrants.", "mechanism": "Warmth carries ~80%+ of first-impression weight because an enemy's competence is a threat while a friend's competence is an asset. High competence without warmth triggers Envy/Threat; high warmth without competence (fawning/flattery) triggers Pity. Run the 30-Second Warmth Gate: drop credentials, proof, and corrections for the first 30 seconds; lead with relaxed presence + one shared-moment remark. In biased/high-stakes rooms (accent/status), pair 1 warm opener with 1 crisp, unhurried anchor (Warmth First, Quiet Anchor Second).", "tableTitle": "Fiske & Cuddy's 2×2 Warmth–Competence Matrix", "tableHead": ["Quadrant", "How You Open", "Emotion Triggered", "Behavioral Signals", "What It Costs / Earns"], "tableRows": [["Low Warmth + High Competence (Trap)", "Leading with credentials, unsolicited expertise, or corrections.", "Envy / Threat ('Are they ranking me?')", "Guarded posture, stiff voice, intellectual one-upmanship.", "People keep distance; sparks die immediately."], ["High Warmth + Low Competence (Fawning)", "Over-smiling, self-deprecation, inflated compliments.", "Pity / Dismissal ('Nice, not a peer.')", "Rushed approval-seeking, asking from below (W2 Diplomat).", "Feels fake or submissive; loses peer standing."], ["Low Warmth + Low Competence", "Closed off, phone out, flat affect, short answers.", "Contempt / Avoidance.", "Looking past them, minimal engagement.", "Ends contact before it begins."], ["High Warmth + High Competence (Target)", "Warmth first (easy face, curiosity), quiet competence second.", "Admiration / Trust ('Safe and capable.')", "Relaxed shoulders, grounded voice, clarity without proving.", "Opens door to both friendship and peer authority."]], "officeEx": "Joining a kickoff with a new senior stakeholder: 'Really glad to finally put a face to the name — your team's Q2 rollout looked smooth from our side. [Warmth] On the timeline piece, I noticed one dependency we can clear early on slide 4. [Quiet Competence]'", "personalEx": "At the gym or a class, instead of offering unsolicited form advice (Competence lead), put your phone away, relax your face, and open on the shared moment: 'That last set looked brutal — how long have you been training here?'", "nonEx": "Hollow flattery ('Oh my gosh your form is literally inspiring, are you a pro?!' — Fawning) OR correcting a minor date in the first two minutes ('Actually that was 2019, not 2020' — Competence before Warmth).", "decisionRule": "Always clear the 30-second Warmth Gate first in social and collaborative settings. Never shrink your competence to look warm — warmth is ease and goodwill, not submission.", "handoff": "Tag every initiation on your Friday Contact Log with W-First (warmth opener) vs. C-Lead (slipped into credentials/fixing) to track return energy.", "layer3Title": "Optional Deepening · Stephen Porges (The Polyvagal Theory)", "layer3Body": "Biologically, why must warmth come first? Porges's Social Engagement System (myelinated vagus nerve) scans faces and vocal prosody for safety cues to turn OFF defensive circuits. Leading with precision or competence before sending a safety cue leaves the other person's threat system active.", "deepNote": {"label": "Cultural Warmth Calibration: US vs. Spain / Europe (Rung 5)", "body": "Warmth is universal in Fiske & Cuddy's model, but its behavioral signal is cultural. In the US, warmth often reads as big smiles, upbeat vocal energy, and enthusiastic openers. In Spain and much of Europe, exaggerated US cheerfulness with strangers can read as performative or salesy; warmth reads instead as grounded eye contact, unhurried ease, genuine curiosity, and relaxed presence."}}, {"day": "Tuesday · Part 2", "author": "Nicholas Epley & Erica Boothby", "title": "We Underestimate How Much Others Like Us", "lens": "Epley & Schroeder (2014), Boothby et al. (2018) on the Liking Gap, and Kardas, Kumar, & Epley (2022) on overly shallow expectations. Tested field and lab research showing waiting to be approached rests on a systematic forecasting error.", "mechanism": "Two cognitive illusions keep us waiting: (1) Pluralistic Ignorance (reading others' quietness as 'leave me alone' instead of 'I'm also hesitant'), and (2) Inner Critic Asymmetry (you replay your small slips while they remember your warmth). Even deep talks with strangers feel far warmer than predicted. Run Forecast -> Rep -> Reality Check daily: write a 0-10 forecast before going first, pick 1 rep from the 4-Tier Menu, then log their exact words and your Liking Gap Delta (Actual - Forecast).", "tableTitle": "Forecasting Errors vs. Reality vs. Well-Founded Caution (4-Tier Menu)", "tableHead": ["Pre-Rep Forecast", "Empirical Reality", "Mechanism", "Well-Founded Caution (Stop Sign)", "4-Tier Initiation Menu"], "tableRows": [["'Head down — doesn't want to talk.'", "Many welcome brief, warm contact.", "Pluralistic Ignorance.", "Headphones on + laptop + curt 1-word reply.", "Tier 1 (Micro-Greet): Eye contact, smile, 'Morning.'"], ["'Opening out of nowhere is weird.'", "Shared-context openers feel natural.", "Overestimating awkwardness.", "Visibly rushing, crying, or on a call.", "Tier 2 (Context Cue): Comment on shared room/class/coffee."], ["'Texting first looks needy.'", "Unprompted reach-outs are appreciated.", "The Liking Gap.", "Two unanswered texts with no follow-up.", "Tier 3 (Low-Friction Text): 'Saw X and thought of you.'"], ["'Didn't like me enough to hang out.'", "Partners like you more than you think — and wait for you to ask.", "Inner Critic Asymmetry.", "Repeated vague excuses with zero counter-offer.", "Tier 4 (Specific Invite / Presence): 'Coffee Thu at 4?' or lingering at sobremesa."]], "officeEx": "Forecast: 4/10 ('probably too busy'). Tier 4 invite to a peer: 'Hey, I've enjoyed our quick chats on the Q3 calls — no agenda, want to grab a 20-minute coffee Tuesday or Thursday?' Reply in 10 mins: 'Love that — Thursday at 10 works!' Actual: 9/10 (+5 Liking Gap).", "personalEx": "Seeing the same person 3 weeks in a row at your café/gym. Phone away, Tier 2 context cue: 'You're the only other person here at 7 AM on a Tuesday — what's your secret?' A 60-second laugh breaks the stranger barrier.", "nonEx": "Ignoring real external stop signs — cornering someone wearing AirPods who gives two monosyllabic replies while edging toward the door.", "decisionRule": "Go first whenever the only barrier is your internal forecast. Step back gracefully the moment you receive 2 consecutive external stop signs — log it without self-judgment and move on.", "handoff": "Log 5 daily initiations on Friday's Contact Log with Pre-Rep Forecast (0-10), Actual Response (0-10), and automatic Liking Gap Delta.", "layer3Title": "Optional Deepening · Vanessa Van Edwards (Be a First Liker)", "layer3Body": "If both people suffer from the Liking Gap, how does anyone know the other wants to be friends? Van Edwards names Signal Amplification Bias: we think our liking is obvious when it actually reads as polite neutrality. Becoming a First Liker — saying plainly 'I really enjoyed talking with you, want to grab coffee sometime?' — collapses the gap for both people.", "deepNote": {"label": "Cultural Liking Gap Calibration: Argentina & Spain (Rung 6)", "body": "Most Liking Gap studies (Boothby et al., 2018) used US/UK samples. In high-involvement Rioplatense or Spanish social life, immediate warmth and sobremesa norms can make interest slightly easier to read in the moment — yet breaking into tight, long-standing local friend groups still triggers pessimistic forecasting errors. Test your own forecasts with live data rather than assuming the gap vanishes."}}, {"day": "Wednesday · Part 3", "author": "Arthur Aron", "title": "Escalating Disclosure, Responsiveness, and the Ping", "lens": "Aron et al. (1997, Fast Friends Procedure) plus Aron & Margaret Clark's clarifications in Supercommunicators. Closeness is driven not by raw disclosure, but by Perceived Partner Responsiveness and turn-taking reciprocity.", "mechanism": "One-sided disclosure feels awkward; mutual, paced turn-taking creates closeness because each turn lets the other show responsiveness ('I hear you, I get you, I care'). Outside a lab, nobody signed a consent form — so Blue Belt uses the Ping and Pause: offer 1 small, PROCESSED truth (something you've steadied yourself around, never asking them to carry you), hold the pause without apologizing, and read the return light (Green = match depth -> escalate; Yellow = warm hold -> stay steady; Red = topic change -> return to shallows gracefully). In presence-first cultures (Spain/Argentina), pair smaller pings with weekly showing-up/sobremesa reps.", "tableTitle": "Ping Calibration Spectrum & Green / Yellow / Red Return Protocol", "tableHead": ["Signal / Level", "Example", "What It Means", "Your Exact Next Move"], "tableRows": [["Too Shallow (Highlight Reel)", "'Work's busy, can't complain!'", "Keeps the door closed; safe but stalls at acquaintance.", "Upgrade by 1 notch to a processed ping."], ["Processed Ping (Target)", "'Honestly a little fried trying to map a career pivot while keeping my gym routine.'", "Small, real, already processed; zero burden on them.", "Hold the pause without backtracking or joking it away."], ["Too Raw (Non-Example)", "'I've been spiraling all week because my career is a failure and nobody gets me.'", "Unprocessed crisis asking an acquaintance to carry you.", "Save for established confidants; keep early pings processed."], ["GREEN Light Return", "'Oh man, I went through a pivot two years ago — it's exhausting...'", "Consent to depth: they matched your ping.", "Respond warmly, ask 1 how/why follow-up, propose specific 2nd meeting (time + place)."], ["YELLOW Light Return", "'Oof, pivots are tough — hope next week eases up!'", "Friendly, holding steady at current depth.", "Match warmth, don't push deeper today, stay consistent."], ["RED Light Return", "'Yeah, crazy weather lately, right?'", "Ceiling / low battery right now (not a verdict on them).", "Respect instantly — return smoothly to shallows with zero awkwardness."]], "officeEx": "Over agenda-free coffee, colleague asks how your week is: 'Pretty good overall — honestly stretching myself learning to lead the cross-team sync without over-preparing every slide.' [pause]. Green Light: 'Oh, I totally do that too.' You bond and suggest lunch next month.", "personalEx": "After 3 weeks of brief chats with a gym acquaintance: 'I've been trying to build real community in this neighborhood instead of rushing home after workouts.' [pause]. Green Light: 'Same — half my friends moved to the suburbs.' You propose: 'Want to grab coffee at the corner spot after Saturday's class?'", "nonEx": "Dumping an unprocessed crisis on a new acquaintance, OR running the ping-and-pause like a mechanical pickup/sales funnel (the Playbook Trap — stop the second it stops being genuine curiosity).", "decisionRule": "Only escalate on a Green Light. Honor Red Lights as valid shallow friendships or seasonal battery limits (Linear Ladder Myth). Never let a sequence replace genuine interest.", "handoff": "Run Ping & Pause with at least 2 acquaintances on Friday's Contact Log, recording Ping, Green/Yellow/Red Light, and at least 1 specific 2nd meeting invite.", "layer3Title": "Optional Deepening · Dan McAdams's 3 Intimacy Levels & 'Watering Holes' (via Van Edwards)", "layer3Body": "McAdams's 3 levels (1: general traits -> 2: current plans/concerns -> 3: core values/life story) paired with 'watering holes' (showing up regularly at the same class, café, or hobby) unite presence-first cultures (Spain/Argentina) with Aron's escalation: repeated proximity lowers friction so Level 2 pings happen naturally side-by-side — often far easier than a stiff interview-style coffee date.", "deepNote": {"label": "Ping-Zone Map for Spain & Presence-First Settings (Rung 6)", "body": "In Spain and other presence-first/high-context settings, an early personal ping lands well AFTER repeated shared presence (showing up weekly at the same café, gym class, or lingering during sobremesa), where familiarity has already built trust. It misfires if dropped cold in a first formal or brief transactional encounter — let repeated watering-hole presence do the first half of the work."}}], "prompt": "Pick two acquaintances you'd like to know better. Write one calibrated, processed ping for each — and one specific, low-friction 2nd-meeting invite if they return a Green Light.", "orig": {"belt": "blue", "name": "Going first — initiation and the first two stages of friendship", "lead": "End the wait to be approached. Start contact, offer warmth first, and invite more depth in small, consented steps.", "teaching": [{"t": "p", "md": "This is Blue Belt's field module, and it is the start of the friendship work that continues in Brown and Black."}, {"t": "h", "text": "Concepts"}, {"t": "steps", "items": [{"name": "The validity of the shallows (I-Thou outline, nuance 1).", "md": "Not every connection needs depth. A gym friend you only joke with, a colleague you only talk shop with, are successes. Ask: does this context call for more? You only escalate when both people signal they want more."}, {"name": "The relationship
