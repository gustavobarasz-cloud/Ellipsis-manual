es naturally, ask: 'I'm terrible at reading poker faces — when you're actually annoyed vs. just tired, what does it look like for you?'", "handoff": "Add a one-line Context & Display-Rule Note at the bottom of each Friday Baseline Card noting setting (public/private) and likely display rule.", "layer3Title": "Optional Deepening · Aneta Pavlenko (Emotions and Multilingualism)", "layer3Body": "Bridging Ekman and Barrett: Pavlenko treats emotions as language- and culture-specific emotion concepts — prototypical scripts bundling appraisal + somatic state + display rule in procedural memory. For a bilingual person, switching between Spanish and English can shift the underlying emotional script itself — meaning a baseline card for a bilingual friend may legitimately look different in each language.", "deepNote": {"label": "The Faces Debate: Ekman vs. Barrett — What Survives? (Rungs 1 & 6)", "body": "Basic Emotion Theory (Ekman) argues 6–7 facial expressions are biologically universal and modified by cultural display rules. Constructed Emotion Theory (Lisa Feldman Barrett) argues faces do not map 1-to-1 onto emotions — a scowl can mean anger, concentration, or gas — and emotions are constructed from context + concepts. What survives BOTH camps for Blue Belt: (1) noticeable shifts in arousal/valence, (2) cultural display rules governing what is appropriate to show, and (3) checking context rather than decoding faces."}}], "prompt": "Pick one person you see weekly. Before Friday, note: (1) Your own W1 body state when around them; (2) Two observable baseline habits; (3) One cultural/context display rule they likely use in that setting.", "orig": {"belt": "blue", "name": "The baseline", "lead": "Before you interpret anything, record what is normal for this person: posture, pace, volume, gaze, hands, how much space they take. Then read only changes from that baseline.", "teaching": [{"t": "h", "text": "Concepts"}, {"t": "steps", "items": [{"name": "The silent sweep (Curriculum, Layer 2 Module 1, from Hughes).", "md": "In the first minute, without staring, take in: resting posture (raised or dropped shoulders), how much space they claim, speaking pace and volume, eye contact pattern, what their hands do. Log it as *neutral for this person*."}, {"name": "The neutral audit.", "md": "If someone is naturally fidgety or fast, that is their baseline, not a tell. The most common reading error is calling a person's normal a sign."}, {"name": "Clusters, not single cues.", "md": "Hughes' deception and stress indicators are useful only as a *change from baseline*, in clusters, in context (Source: 6MX pp. 163, 172–180, as reported). One crossed arm means nothing. A sudden cluster after a specific question means \"something about that question matters\" — not \"they are lying\"."}, {"name": "Cultural baselines.", "md": "A baseline is also cultural. Tannen's high-involvement speakers overlap and talk fast as a sign of engagement; high-considerateness speakers leave long pauses as respect (Source: That's Not What I Meant! pp. 47–56, as reported). Rioplatense conversation among friends often runs high-involvement; a quiet English-speaking colleague's pause is not coldness. Read the person against their own culture's normal before against yours."}, {"name": "Read yourself too.", "md": "Your White Belt tell list is your own baseline. A read is always two baselines: theirs and yours. If your jaw is tight, your read is suspect."}]}, {"t": "p", "md": "**What you bring.** You already baseline voices. Extend it to bodies and to the room."}], "drill": "The silent sweep. In a public, low-stakes place (a café, the train, the gym floor), take a 30-second sweep of one person: posture, pace, space, hands. Then look away and say to yourself one sentence of baseline. Never stare; if you cannot do it without changing your own behavior, it is not yet automatic.", "office": "In the first minute of a meeting or video call, take the sweep of the person who matters most to the outcome. Write their baseline in the margin.", "personal": "Do it as noticing, not cataloguing: what does this friend look like when they are at ease? You will need that picture to notice when they are not, and to ask about it gently.", "deliverable": {"name": "Three baseline cards", "md": "For three people you see often (one colleague, one friend, one person in a service setting you see repeatedly), write a card: posture, pace, volume, gaze, space, hands, and one thing that changes when they are stressed (only if you have actually seen it).\n\n**Watch for.** Using the baseline to catch people. In the personal dojo, the baseline is for care: noticing when someone is off so you can ask."}, "deepened": {"original": "top", "parts": [{"n": 1, "title": "Part 1 · Hughes: the baseline and the cluster", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Hughes's full lens card is W3 Part 1. Here only his reading method matters: before any cue means anything, you record what is normal for this person, then read only departures from that baseline, in clusters, tied to a moment. What is distinctive is that the unit of reading is a change, not a gesture. A crossed arm is not a tell; a cluster of changes right after one question is a pointer to that question."}, {"t": "note", "label": "Why Hughes here", "md": "This module trains the first minute of reading: a silent sweep, a neutral audit, and the rule that a person's normal is never a sign."}, {"t": "note", "label": "Native use", "md": "Interrogation, intelligence and sales work, aimed at subjects, often with the goal of an advantage. Pointing it at friends and colleagues for care, not leverage, is this curriculum's move."}, {"t": "note", "label": "Limit", "md": "Practitioner tradecraft (label: practitioner theory). The baseline-then-change logic is sound as method; the meanings Hughes attaches to specific cues are not tested in the material I used. Part 2 shows what research says about how well anyone reads cues at all."}, {"t": "h", "text": "The sweep, as a record and not a verdict"}, {"t": "table", "head": ["Channel", "What to log as baseline", "What a change might mean", "What it cannot tell you"], "rows": [["Posture and space", "Resting shoulders, how much room they take", "Something about this moment matters", "Why it matters"], ["Pace and volume", "Their normal speed and loudness", "Arousal rose or fell", "Whether it is fear, anger, excitement or fatigue"], ["Gaze", "Their usual eye-contact pattern", "Attention shifted", "Whether they are lying"], ["Hands", "What they usually do", "Self-soothing, or simply a new topic", "Intent"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "In your interpreting, how did you learn a speaker's normal voice before you could hear stress in it? How long did it take?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: why does Hughes insist on a baseline before any reading, and who was the method built to be pointed at?"}, {"name": "Make sense (rung 2).", "md": "Give one example of a real change from baseline and one non-example: a person's normal habit that a stranger would misread as a tell."}, {"name": "Find it in your life (rung 3).", "md": "Write three people you see often and what you have actually seen as their normal, then one moment each when something changed. Only then rate how confident you are in each baseline, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does reading people quickly protect for you, and what does it cost? Where does your reading serve someone, and where does it keep you safely watching?"}, {"name": "Connect (rung 5).", "md": "Does your own tell list from W1 change your read of others? When your jaw is tight, what do you see in them? State it as a guess and name what would show it wrong. In your Orders Grid this sits in Body and Mind."}, {"name": "Argue (rung 6).", "md": "A baseline is cultural. Would your sweep of a Rioplatense friend and of a quiet US colleague use the same idea of \"normal\"? Where would Hughes's method misread someone autistic or from a culture with different gaze norms?"}, {"name": "Test (rung 7).", "md": "Do the silent sweep on one person a day for three days in a low-stakes place. Before you start, predict one thing you expect to see as their normal. Afterward, note whether a second look confirmed it. Write what result would show your first-minute read is unreliable."}, {"name": "Catch it live (rung 8).", "md": "What is the moment you shift from noticing to concluding? Name the inner word that marks it."}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your baselines, your episodes or your ratings."}]}, {"n": 2, "title": "Part 2 · DePaulo and Bond: what cues can and cannot tell", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Bella DePaulo, a social psychologist, led large reviews of research on how lies show in behavior, and with Charles Bond Jr. reviewed hundreds of studies of how accurately people judge truth from lies. Their central findings are sobering: most behaviors people believe signal lying are weakly related to it or not at all, and people judging strangers are right only a little more often than chance. What is distinctive is the scale of the evidence: this is the research base under every \"body language\" claim, and it mostly says the cues are faint."}, {"t": "note", "label": "Why DePaulo and Bond here", "md": "The module already says a cluster means \"something about that question matters,\" not \"they are lying.\" This part supplies the evidence behind that restraint."}, {"t": "note", "label": "Native use", "md": "Laboratory and field studies of deception detection, mostly with strangers and short clips. They were not built to test a careful reader who knows a person's baseline over months; that gap is real and cuts both ways."}, {"t": "note", "label": "Limit", "md": "Tested research (meta-analyses). It concerns lie detection specifically, not reading emotion or stress in general, and most studies use strangers. Knowing someone well may help, but the reviews give little support to confident claims of reading deception from the body."}, {"t": "h", "text": "What the research supports"}, {"t": "table", "head": ["Claim", "Status"], "rows": [["Specific gestures reliably reveal lying", "Not supported; most such cues are weak or absent"], ["People detect lies from behavior well above chance", "Not supported; accuracy is only slightly above chance"], ["A change in behavior shows something mattered to the person", "Plausible, and modest; it does not say what"], ["Experts and trained professionals do much better", "Weak support in the reviews (interpretation of their summaries)"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "Have you ever been sure someone in a session was hiding something? What made you sure, and did it turn out to be true?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what did DePaulo and Bond find about deception cues and accuracy, and what kind of studies were they reviewing?"}, {"name": "Make sense (rung 2).", "md": "Give one example of a reasonable inference from a change in behavior and one non-example: an inference that jumps from the change to a motive."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you read someone's body as meaning something specific. For each, write what you saw, what you concluded and what you learned later. Only then rate how often your specific conclusions held, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does a confident read give you, such as control or the sense of being ahead? What did it cost when it was wrong?"}, {"name": "Connect (rung 5).", "md": "Does the intelligence hook from W3 make confident reads tempting? State it as a guess and name what would show it wrong. In your Orders Grid this sits in Mind."}, {"name": "Argue (rung 6).", "md": "Your work gave you thousands of sessions with feedback. Does that make you an exception to the reviews, or is that the belief the reviews were testing? What would count as evidence either way?"}, {"name": "Test (rung 7).", "md": "For one week, each time you notice a cluster, write only \"something about ___ matters\" and one question you could ask. Before you start, predict how often asking would confirm your guess. Afterward, record any answer you got. Write what result would show your reads add nothing."}, {"name": "Catch it live (rung 8).", "md": "When does \"something matters here\" turn into \"they are lying\" in your head? Catch the word that does it."}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your reads, your episodes or your ratings."}]}, {"n": 3, "title": "Part 3 · Ekman and Matsumoto: display rules", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Paul Ekman and Wallace Friesen proposed in the late 1960s that cultures teach display rules: norms about which feelings may be shown, to whom and how strongly. David Matsumoto later studied display rules across many countries. Their work on facial expression also argued that some expressions are recognized across cultures, a claim that later research, for example by Lisa Feldman Barrett and colleagues, has challenged. What is distinctive for this module is the display-rule idea: the same feeling can be shown loudly in one culture and masked in another, so a baseline is partly a cultural fact."}, {"t": "note", "label": "Why Ekman and Matsumoto here", "md": "The module's concept of cultural baselines needs a mechanism. Tannen, whose full card is W4 Part 1, covers pace and overlap; display rules cover the face and the body."}, {"t": "note", "label": "Native use", "md": "Cross-cultural research on emotional expression, with posed photos and self-report questionnaires on what people think is appropriate to show."}, {"t": "note", "label": "Limit", "md": "Display rules are well supported as a concept (label: tested research, mostly questionnaire-based). The stronger claim that facial expressions map reliably onto specific emotions is contested. Use display rules to widen your idea of \"normal,\" not to decode faces."}, {"t": "h", "text": "Three ways to misread across display rules"}, {"t": "table", "head": ["What you see", "Reading against your own rules", "Reading against theirs"], "rows": [["A flat face during bad news", "Cold, or not affected", "Respect, or composure expected in public"], ["Loud, animated disagreement", "Hostility", "Engagement among equals"], ["A smile while refusing", "Agreement, or insincerity", "Politeness that softens a no"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "What did you learn about showing feelings in Oberá, and what did you learn after you moved? Where did the two rules clash?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what is a display rule, and which of Ekman's claims is still debated?"}, {"name": "Make sense (rung 2).", "md": "Give one example of a display rule from a culture you know well and one non-example: an individual habit that is not a cultural rule."}, {"name": "Find it in your life (rung 3).", "md": "Write three moments when you misread someone's face or tone, or were misread, because of different rules. Only then rate how often culture explains your misreads, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "Which display rules do you follow at work? What do they protect, and what do they hide?"}, {"name": "Connect (rung 5).", "md": "How do display rules interact with Tannen's styles from W4 Part 1? State one guess about a person you know and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "If faces do not map neatly onto emotions, what is left of reading at all? Where is the line between widening \"normal\" and stereotyping a culture?"}, {"name": "Test (rung 7).", "md": "With one person from a different background, ask in a low-stakes moment how they usually show irritation or delight. Before you ask, predict their answer. Afterward, record what they said. Write what result would show your cultural guess was wrong."}, {"name": "Catch it live (rung 8).", "md": "When a face surprises you, what is the first story you tell? Whose rule is that story using?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your episodes, your guesses or your ratings."}]}], "connect": {"title": "Connect and argue: the three lenses side by side", "blocks": [{"t": "p", "md": "Everything in this section is Interpretation: my reading across the sources, to be tested against your episodes."}, {"t": "table", "head": ["Source", "Starts from", "Treats a cue as", "Would worry that you..."], "rows": [["Hughes", "The person's own normal", "A departure worth noticing", "Read a habit as a tell"], ["DePaulo and Bond", "Hundreds of studies", "Weak evidence about motive", "Trust a confident read"], ["Ekman and Matsumoto", "Cultural norms for showing feeling", "Partly a cultural performance", "Use your own culture's normal for everyone"]]}, {"t": "p", "md": "**Where they meet.** All three narrow what a cue can mean. A change says something mattered; culture shapes how it shows; the reviews say the motive behind it is rarely readable from the body alone."}, {"t": "p", "md": "**Where they collide.** Hughes's tradecraft is confident about specific cues; the deception reviews are not. The module sides with the reviews by asking you to check reads back, which is Blue Belt's next module."}, {"t": "p", "md": "**What the three miss for you.** You read voices across two languages for a living. None of the three studies interpreters, who read a speaker against two sets of rules at once."}, {"t": "p", "md": "**Where it sits in your own frameworks.** Body and Mind in your Orders Grid. In somatic terms, your own arousal colors every read. Return to this module later and add dated notes; do not overwrite."}]}, "research": {"title": "Research further: three threads to pick from", "blocks": [{"t": "p", "md": "These are gaps the sources left open. Replace them with your own questions whenever you have them."}, {"t": "table", "head": ["Thread", "Question it opens", "Why it connects", "Suggested depth"], "rows": [["1. Does knowing someone help?", "Does accuracy in reading deception or stress improve with long familiarity, and what does the research say about close relationships?", "The reviews mostly use strangers", "One thread, researched with the research-brief skill"], ["2. Interpreters as readers", "Is there research on interpreters' perception of speakers' emotional states?", "Your own expertise is the untested case", "One thread, with a critic pass"], ["3. The faces debate", "What is the current state of the debate between universal expressions and constructed emotion?", "Part 3 rests on a contested base", "Full deepening of Part 3"]]}], "prompt": "Use curriculum-module in deepen mode on Blue Belt B1, Part {part}, one thread. My question: {q}. Why it pulled me: {why}. What I already think: {think}. Verify sources with research-brief first, write into the part's Deepened section, and do not write my entries."}}}}, {"id": "B2", "num": 2, "title": "Reading the Currency", "subtitle": "Spot what they scan for right now, test it so it can fail, and check it back.", "guardrail": "Surveillance vs. Care: Never lock a currency into a stage verdict ('He's an Expert'). In the office dojo, use currency reads to choose your opening register. In the personal dojo, there are NO fake stress tests — read natural friction to learn how to care for them.", "assembly": [{"day": "Mon", "step": "Part 1 · Cook-Greuter & Torbert", "ingredient": "Verb-Only Currencies & Role Look-Alike Filter"}, {"day": "Tue", "step": "Part 2 · Snyder & Swann", "ingredient": "Falsifiable Disconfirming Checks (All 6 Currencies)"}, {"day": "Wed", "step": "Part 3 · William Ickes", "ingredient": "Empathic Accuracy Benchmarks & Face-Safe Check-Backs"}, {"day": "Thu", "step": "Deliberate Practice Lab", "ingredient": "8-Quote Currency & Face-Safe Check-Back Drill"}, {"day": "Fri", "step": "Deliverable Workshop", "ingredient": "Five Checked Hypothesis Cards + Hit Rate"}], "parts": [{"day": "Monday · Part 1", "author": "Susanne Cook-Greuter & William Torbert", "title": "Why a Stage Cannot Be Read in Minutes", "lens": "Nine Levels of Increasing Embrace (Cook-Greuter, 2013) & Action Inquiry (Torbert, 2004). Stages are measured across 36+ sentence completions by trained scorers; isolated language clues are hints only, never a diagnosis.", "mechanism": "Cook-Greuter never found a human protocol narrower than 3 stages — adults operate from a Center of Gravity surrounded by a Trailing Edge (stress fallback) and Growth Edge, and high intelligence does not equal late-stage maturity. Use Verb-Only Labeling ('scanning for accuracy right now'), never stage nouns ('is an Expert'), and run a 3-second Role Filter: 'Is this their job/deadline talking, or their recurring scan?'", "tableTitle": "The 6 Currencies — Situational Scan vs. Stage-Verdict Trap", "tableHead": ["Currency", "What They Scan For Now", "Friction Reaction", "Role / Context Look-Alike", "Stage-Verdict Trap (Avoid)"], "tableRows": [["Advantage", "Leverage, who wins, what to get or defend.", "Attack (escalate, threaten, test limits).", "Lawyer or procurement buyer protecting downside risk.", "'He's an Opportunist.'"], ["Approval", "Belonging, warmth, agreement, whether you're upset.", "Fold (apologize, soften, concede early).", "New hire or guest following high-context politeness.", "'She's stuck in Diplomat.'"], ["Accuracy", "Precision, craft, procedure, spotting errors.", "Debate (cite data, policy, technicalities).", "Auditor, surgeon, or interpreter whose craft requires exactness.", "'He's a rigid Expert.'"], ["Results", "Goals, timelines, ROI, fastest path to yes.", "Pivot (accept no, ask for options/workarounds).", "Someone short on time with a hard 2 PM deadline.", "'She's just an Achiever.'"], ["Context", "Multiple frames, how you see it, underlying views.", "Reframe / Pause (question premise, resist 1 answer).", "Researcher or mediator gathering all sides.", "'They're a Pluralist.'"], ["Pattern", "Dynamics between people, shared purpose, alignment.", "Meta-Inquire (name dynamic, invite mutual adjustment).", "Someone using corporate 'systems' buzzwords without inquiry.", "'He's a Strategist.'"]], "officeEx": "A finance lead corrects two minor rounding numbers on your slide and cites GAAP policy. Good currency read: 'Working read: scanning for Accuracy in this meeting (possibly role-driven + Q4 audit pressure). Opening move: lead with exact numbers and methodology before asking for flexibility.'", "personalEx": "A friend keeps asking 'Are you sure you're not mad?' after rescheduling dinner and agrees to any restaurant. Good currency read: 'Scanning for Approval/reassurance right now. Care move: explicitly reassure them we're totally good, then ask what they actually crave.'", "nonEx": "After one tense 10-minute vendor call, writing 'Classic Opportunist — only respects leverage.' You collapsed a temporary sales posture into a permanent developmental verdict.", "decisionRule": "Use currency reads strictly to pick your opening register (Office) or care move (Personal). Stop immediately if you use a stage noun or feel quietly superior — rewrite the note as a temporary, context-bound verb.", "handoff": "Populate the 'Working Read', 'Confidence', and 'Role Filter' fields on your Five Hypothesis Cards using verb-only currency language.", "layer3Title": "Optional Deepening · Robert Kegan & Lisa Lahey (How the Way We Talk)", "layer3Body": "Why is slipping into a stage verdict so seductive? Kegan & Lahey call it the 'super-vision assumption' — the tacit belief that my perspective has super-vision into what is really going on. Once it locks in, it seals off learning: you reinterpret every new cue to fit your label.", "deepNote": {"label": "Center of Gravity vs. Trailing Edge Under Friction (Rungs 1 & 5)", "body": "Cook-Greuter's Center of Gravity is how a person makes meaning when calm and resourced; their Trailing Edge is the earlier stage they drop into under stress, fatigue, or threat. Because B2 observes people during natural friction, the currency you see in a tense meeting is frequently their Trailing Edge (e.g., an Achiever dropping to Accuracy/Expert under audit pressure), never proof of their Center of Gravity."}}, {"day": "Tuesday · Part 2", "author": "Mark Snyder & William Swann", "title": "How We Test Our Reads About People", "lens": "Snyder & Swann (1978) on Confirmatory Hypothesis Testing & Snyder, Tanke, & Berscheid (1977) on Behavioral Confirmation. Tested social psychology showing your check can artificially manufacture the behavior you expect.", "mechanism": "When testing a guess about someone, people default to confirming questions ('What do you do to liven up a party?') and alter their own tone in ways that pull out the expected behavior (Behavioral Confirmation). Break the bias with two conditions from Trope & Bassok / Neuberg: (1) prioritize Accuracy Motivation over being right, and (2) write a concrete If-Then Falsifier BEFORE your next interaction where an unexpected outcome is just as easy to observe.", "tableTitle": "Confirming vs. Diagnostic (Falsifiable) Checks Across All 6 Currencies", "tableHead": ["Working Read", "Confirming Check (Weak)", "Diagnostic / Disconfirming Check (Could Fail)", "Personal-Dojo Safe Version (No Fake Tests)"], "tableRows": [["Advantage", "Notice every time they negotiate hard.", "Offer a transparent, mutually fair option and see if they engage without squeezing extra concessions.", "Notice how they react when YOU win — celebrate or one-up?"], ["Approval", "Notice when they nod or say 'totally.'", "State a mild, honest differing opinion on a low-stakes topic and see if they hold their view.", "State your real preference first (W5) and see if they voice a different one."], ["Accuracy", "Notice every detail correction.", "Share a rough brainstorm explicitly labeled 'rough draft' and see if they engage the big idea.", "Share a messy, half-formed story and see if they connect to feeling vs. correcting facts."], ["Results", "Notice timeline questions.", "Raise a brief relationship/values question and see if they slow down and engage.", "Propose an unstructured coffee with no agenda and watch if they relax into it."], ["Context", "Notice 'How do you see it?'", "Ask for a crisp decision on a simple choice and see if they commit cleanly.", "Ask 'What do you actually want to eat tonight?' and see if they name a clear preference."], ["Pattern", "Notice big-picture talk.", "Offer a gentle correction to their frame and see if they stay open to revising it.", "Notice if they can just laugh or vent without turning it into meta-analysis."]], "officeEx": "You suspect a senior peer scans for Advantage after one tense budget sync. Diagnostic check: share a draft agenda inviting his input without bracing. Result: he offers two helpful shortcuts saving your team hours and asks nothing in return. Your falsifier fires — you revise Advantage -> Results.", "personalEx": "You guess a friend scans for Approval because they always defer on restaurants. Safe check: 'I'm craving Thai, or we could do something totally different — what actually sounds good to you?' They say 'Honestly, I'm sick of Thai, let's get tacos.' Read revised.", "nonEx": "Asking a 'disconfirming' question that is actually leading ('You don't care about the big picture as long as the spreadsheet balances, right?'), or acting cold because you expect Advantage — provoking the guardedness you then log as proof.", "decisionRule": "Write a falsifier on every Hypothesis Card BEFORE the second contact. Stop if your check requires manufacturing a fake problem, fake 'no,' or trap — a fake test is a tactic in both dojos.", "handoff": "Complete the 'What would change my mind' falsifier field on all Five Hypothesis Cards before marking any card ready to test.", "layer3Title": "Optional Deepening · David Bohm (On Dialogue)", "layer3Body": "Bohm contrasts observing a chair (which isn't affected by your assumptions) with observing a human being: 'what you see depends on your assumptions, and you will get an emotional reaction from that person which enters you and affects the way you see.' Your read is never outside the room — it is an active ingredient inside the interaction.", "deepNote": {"label": "Behavioral Confirmation Loop & Question Contrast (Rungs 2 & 5)", "body": "Snyder's 3-step loop: (1) Your expectation ('they scan for Advantage') -> (2) Your altered tone/questions (guarded, sharp) -> (3) Their reactive guardedness, which 'confirms' your guess. Question Contrast for Rung 2: Confirming = 'Which exact numbers are you worried might be off?' | Diagnostic (Disconfirming) = 'What matters most to you on this — exact numbers, speed, or how the team feels about it?' | Leading-Disconfirming (Non-Example) = 'You don't actually care about the big picture as long as the spreadsheet balances, right?'"}}, {"day": "Wednesday · Part 3", "author": "William Ickes", "title": "Empathic Accuracy and the Check-Back", "lens": "Ickes's unstructured dyadic interaction paradigm (Everyday Mind Reading; cited in Brooks). Tested research benchmarking human mind-reading accuracy against the other person's own report.", "mechanism": "Strangers read each other accurately only ~20% of the time; close friends/family average ~35%; top natural readers plateau at ~55%, while poor readers feel just as confident. Long-term couples often lose accuracy by locking in an outdated mental model, and Motivated Inaccuracy lowers our reads when the truth feels threatening. Use the Tentative Check-Back Formula: [Softener: 'It sounds like...'] + [Dignified Priority, never a flaw] + [3-second pause]. Treat every correction as a 100% win.", "tableTitle": "Face-Safe Check-Back Scripts Across Currencies & Methods", "tableHead": ["Method", "How It Works", "Easy Currencies (Accuracy / Results)", "Sensitive Currencies (Advantage / Approval)", "Non-Example (Diagnosis)"], "tableRows": [["1. Tentative Label", "Name priority lightly + 3s pause.", "Accuracy: 'It sounds like getting the methodology airtight is the main thing here.'", "Advantage: 'It sounds like protecting your downside on this clause is non-negotiable.'", "'You're being nitpicky because you're an Expert.'"], ["2. Direct Question", "Ask plainly when stakes allow.", "Results: 'Is hitting the Friday launch the top priority for you on this?'", "Approval: 'I want to make sure we're actually aligned — does any part of this not sit right?'", "'Are you only agreeing because you want me to like you?'"], ["3. Watch & Wait", "Keep private when asking feels intrusive or tactical.", "Context: Note 'wanted multiple frames' -> observe if they ask for alternatives next time.", "Advantage (Office): Keep leverage read private; observe if they honor small agreements.", "Silently locking the verdict and never updating it."]], "officeEx": "A director fires rapid questions at your proposal. You guess Accuracy and check back: 'It sounds like making sure the compliance numbers are bulletproof is the main priority — am I reading that right?' She says: 'Actually compliance is fine — I'm worried my VP will think we rushed the timeline.' Five seconds upgraded a wrong guess into ground truth (Status/Results).", "personalEx": "A friend goes quiet after you suggest inviting a third person to dinner. You check back warmly: 'Hey, it felt like the energy shifted when I mentioned Alex — were you hoping for just a one-on-one catch-up tonight?' They exhale: 'Honestly, yeah, rough week.'", "nonEx": "Saying 'I can tell you're scanning for approval right now, you don't have to people-please with me.' Even if right, announcing a psychological label strips their face and turns a check-back into a power move.", "decisionRule": "Use a Tentative Label or Direct Question whenever basic safety exists. Switch to Watch & Wait in low-trust/high-power office rooms where naming a sensitive currency (like Advantage) would show your hand.", "handoff": "Complete the Check-Back / Verdict fields on your Five Hypothesis Cards and compute your hit rate. Against Ickes's 20-35% human baseline, 2/5 (40%) with honest revisions is mastery.", "layer3Title": "Optional Deepening · Sheila Heen (via Duhigg, Supercommunicators)", "layer3Body": "Heen identifies three purposes that keep a check-back respectful rather than intrusive: (1) helping the speaker sort out their own layered priorities, (2) helping the listener catch what they missed, and (3) proving care — showing you value them enough to work at getting them right.", "deepNote": {"label": "Content-Level Check-Backs When Feeling-Talk Is Taboo (Rung 6)", "body": "In cultures, families, or offices where naming emotions feels intrusive or clinical, switch from affective check-backs to Content-Level Priority Check-Backs: verify what matters practically without naming an inner feeling (e.g., 'So locking the delivery date before we discuss price is the main thing?' or 'Let me make sure I'm prioritizing the right piece for you')."}}], "prompt": "Think of two people from your B1 Baseline Cards. Write one verb-only currency guess, one Role Filter check, and one falsifiable 'what would change my mind' line before your next contact.", "orig": {"belt": "blue", "name": "Reading the currency", "lead": "Every person scans the conversation for something. Find out what it is by watching what they pay attention to, and how they react when they don't get it.", "teaching": [{"t": "h", "text": "Concepts"}, {"t": "steps", "items": [{"name": "Currencies (Synthesis, from the grid's Read row and the Concentric \"Utility vs. Approval filter\").", "md": "The Read signatures in the grid name what each stage tends to scan for. Treated as currencies, not stages:"}]}, {"t": "table", "head": ["Currency", "What it looks like in the first minutes", "Grid Read signature it echoes"], "rows": [["Advantage", "Cuts small talk; pivots fast to what they can get or must defend", "Opportunist: \"Reads for advantage\""], ["Approval", "Mirrors you heavily, checks your face, agrees with small things (\"totally\", \"me too\")", "Diplomat: \"Reads for approval\""], ["Accuracy", "Corrects small errors, even irrelevant ones; precision over flow", "Expert: \"Reads for errors\""], ["Results", "Asks about goals, timelines, decision drivers; wants the path to yes", "Achiever: \"Reads for interests\""], ["Context", "Asks how you see it, where you're coming from; resists a single answer", "Pluralist: \"Reads their frame\""], ["Pattern", "Names what is happening between people; asks about purpose", "Strategist: \"Reads the system\""]]}, {"t": "steps", "items": [{"name": "Natural friction is the best read.", "md": "People can show a later stage when comfortable and fall back when denied what they want (Curriculum). So the moment of friction tells you most. The original's four reactions to a no are a useful map of *reactions*, not of people: attack (escalate, threaten), fold (apologize, concede, go silent), debate (cite data and policy), pivot (accept the no and ask for alternatives)."}, {"name": "The office stress test, done honestly.", "md": "In negotiation, it is legitimate to set a small, real boundary early (decline a minor scheduling request you genuinely can't take) and watch the reaction. The test must be true; a fake no is a tactic."}, {"name": "The personal dojo has no stress test.", "md": "In friendship you read the friction that arrives on its own: a cancelled plan, a disagreement over where to eat. You read their reaction to learn how to care for them, not to sort them."}, {"name": "The hypothesis card.", "md": "Every read is written as a hypothesis with a confidence level and a disconfirming test:\n\n*Working read:* scans for accuracy; folds into debate under pressure. *Confidence:* medium. *Evidence:* corrected my date twice; cited policy when I said no to Friday. *What would change my mind:* if they accept a no without citing anything."}, {"name": "Check it back (Grid: Construct-Aware × Read, \"Hold the read lightly and loop it back to them to check\").", "md": "Wherever you can, test the read with them directly: \"It sounds like getting the numbers exactly right matters a lot here.\" Their answer tells you more than any sweep."}]}], "drill": "The hypothesis log. After two conversations a day, write one hypothesis card each. Revisit cards after the next contact with the same person and mark them right, wrong or revised.", "office": "Use the currency to choose your opening: precision for an accuracy-scanner, the path to the goal for a results-scanner, acknowledgement of leverage for an advantage-scanner.", "personal": "Use it to know what love looks like to this friend: accuracy-scanners feel cared for when you take their ideas seriously; approval-scanners when you show you are not upset with them.", "deliverable": {"name": "Five checked cards", "md": "Five hypothesis cards, each checked against later evidence or checked back directly, with your hit rate. A hit rate of two in five is a good start; the point is the habit of checking, not being right.\n\n**Watch for.** Locking a read. A card with no \"what would change my mind\" line is a verdict, not a read.", "tool": "hypothesis"}, "tools": ["hypothesis"], "deepened": {"original": "top", "parts": [{"n": 1, "title": "Part 1 · Cook-Greuter and Torbert: why a stage cannot be read in minutes", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Cook-Greuter's full lens card is W2 Part 2 and Torbert's is W2 Part 1. Here only one point matters: both measure a person's action logic or stage from many sentence completions scored by trained raters, and both describe a spread across several levels. That is why this module reads a currency, what a person scans for right now, and keeps any stage guess as a low-confidence hypothesis."}, {"t": "note", "label": "Why they are here", "md": "The currency table borrows the grid's Read signatures, which come from their stage descriptions. This part keeps the borrowing honest."}, {"t": "note", "label": "Native use", "md": "Developmental assessment and leadership coaching over time, not first-minute reading of strangers."}, {"t": "note", "label": "Limit", "md": "The currencies are this curriculum's synthesis, not Cook-Greuter's or Torbert's claim (label: interpretation). Their own measures say a person shows several levels at once; a currency read in one meeting says little about stage."}, {"t": "h", "text": "Currency versus stage"}, {"t": "table", "head": ["Question", "A currency read", "A stage read"], "rows": [["What it uses", "What they attend to and how they react to friction, in this meeting", "Many sentence completions, scored by a trained rater"], ["How fast", "Minutes", "Hours, plus scoring"], ["What it claims", "What they scan for now", "Their center of gravity across contexts"], ["How wrong it can be", "Often; check it back", "Less often, and still a spread"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "In your work, have you ever quietly \"typed\" a provider or a client after a few minutes? What label did you use?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: how do Cook-Greuter and Torbert find someone's stage, and why does that rule out a three-minute diagnosis?"}, {"name": "Make sense (rung 2).", "md": "Restate the difference between a currency and a stage. Give one example of a currency read and one non-example: a read that slips into a stage verdict."}, {"name": "Find it in your life (rung 3).", "md": "Write three people you have read quickly at work or in friendship: what they scanned for, and what you saw when they did not get it. Only then rate how often your currency guess held on a second meeting, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does assigning a stage give you, such as order, or a feeling of being above the fray? What does it cost the person you read?"}, {"name": "Connect (rung 5).", "md": "Which currency do you scan for yourself under pressure, given your W2 fallbacks? State it as a guess and name what would show it wrong. In your Orders Grid this sits on the depth axis and in Mind."}, {"name": "Argue (rung 6).", "md": "Is reading a currency just stage-typing with softer words? What would keep it from becoming that?"}, {"name": "Test (rung 7).", "md": "Write one currency read for a colleague before a meeting. Before the next contact, write what you predict they will attend to. Afterward, record what they actually asked about. Write what result would show the read was wrong."}, {"name": "Catch it live (rung 8).", "md": "What word in your head turns \"they scan for accuracy\" into \"they are an Expert\"?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your reads, your episodes or your ratings."}]}, {"n": 2, "title": "Part 2 · Snyder: how we test our reads about people", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Mark Snyder, a social psychologist, and William Swann ran studies in the late 1970s showing that people asked to test a hypothesis about someone, for example that the person is an extravert, tend to choose questions that would confirm it. Snyder's related work on behavioral confirmation showed that expectations can draw out the very behavior expected. What is distinctive is that a read does not only describe a person; the way you check it can make it come true."}, {"t": "note", "label": "Why Snyder here", "md": "The hypothesis card asks \"what would change my mind.\" Snyder explains why that line is hard to write and easy to skip."}, {"t": "note", "label": "Native use", "md": "Laboratory studies of person perception, often with strangers and set questions."}, {"t": "note", "label": "Limit", "md": "Tested research, with later work showing the confirming tendency depends on the setting and can be reduced when people are motivated to be accurate (label: tested research, effect depends on conditions). Do not read it as \"all checking is biased\"; read it as \"design your check to be able to fail.\""}, {"t": "h", "text": "Confirming checks and disconfirming checks"}, {"t": "table", "head": ["Your read", "A confirming check", "A check that could fail"], "rows": [["\"Scans for accuracy\"", "Notice when they correct things", "Offer a rough draft and see whether they let it pass"], ["\"Scans for approval\"", "Notice when they agree", "Disagree lightly and see whether they hold their view"], ["\"Wants results\"", "Notice timeline questions", "Raise a relationship topic and see whether they engage"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "When have you asked a question in a way that guided the answer, in a session or in life?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what did Snyder and Swann find about how people test a guess about someone?"}, {"name": "Make sense (rung 2).", "md": "Write one confirming question and one disconfirming question for the same read. Then give a non-example: a \"disconfirming\" question that is really leading."}, {"name": "Find it in your life (rung 3).", "md": "Write three reads you held about people and how you checked them. Only then rate how often your checks could actually have failed, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does a confirmed read give you? What did you miss when you checked only one way?"}, {"name": "Connect (rung 5).", "md": "Does your expectation of a colleague draw out the behavior you expect? Think of one relationship. State it as a guess and name what would show it wrong. In your Orders Grid this sits in Mind and Heart with others."}, {"name": "Argue (rung 6).", "md": "Interpreters must not lead. Does that training protect you from confirming checks, or only in the booth? What would show the difference?"}, {"name": "Test (rung 7).", "md": "For your next three hypothesis cards, write the \"what would change my mind\" line as a concrete check you will run. Before you run it, predict the result. Afterward, record what happened. Write what result would show the cards are only confirming."}, {"name": "Catch it live (rung 8).", "md": "What do you feel when evidence starts to go against your read? Name it."}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your cards, your checks or your ratings."}]}, {"n": 3, "title": "Part 3 · Ickes: empathic accuracy and the check-back", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "William Ickes, a social psychologist, developed a method to measure empathic accuracy: two people talk, watch the recording, each writes what they were thinking or feeling at each pause, and the other guesses. Accuracy can then be scored against what the person actually reported. His work found that people vary widely, that accuracy depends heavily on how readable the other person is, and that motivation and familiarity matter. What is distinctive is that a read is scored against the person's own report, which is exactly what a check-back does."}, {"t": "note", "label": "Why Ickes here", "md": "The module says to loop a read back to the person. Ickes shows why: the person's own account is the best measure available."}, {"t": "note", "label": "Native use", "md": "A laboratory paradigm for research on everyday mind reading, in strangers, friends and couples."}, {"t": "note", "label": "Limit", "md": "Tested research (label: tested research). Accuracy in the lab is measured against what people chose to write, which is itself a report. Asking someone directly can also change the conversation; in some settings a check-back is welcome, in others it feels intrusive."}, {"t": "h", "text": "Three ways to check a read"}, {"t": "table", "head": ["Method", "What it sounds like", "When it fits"], "rows": [["Tentative label", "\"It sounds like getting the numbers right matters a lot here.\"", "Most conversations; invites correction"], ["Direct question", "\"Is accuracy the main thing for you on this?\"", "When the stakes allow plain speech"], ["Watch and wait", "Note the read and see what happens next time", "When asking would feel like analysis"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "When did someone check their read of you, and how did it land?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: how does Ickes measure empathic accuracy, and what did he find shapes it?"}, {"name": "Make sense (rung 2).", "md": "Give one example of a check-back and one non-example: a statement that sounds like a check but announces a diagnosis."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you checked a read with someone, or could have. Only then rate how often the person's answer surprised you, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does not checking protect, such as the comfort of being right? What does checking cost?"}, {"name": "Connect (rung 5).", "md": "How does a check-back relate to the label in B5 and the loop in B4? State one guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "In a culture or relationship where naming feelings is not done, is a check-back respectful or intrusive? What would you do instead?"}, {"name": "Test (rung 7).", "md": "Check back two reads this week, one at work, one with a friend. Before each, predict whether they will confirm. Afterward, record their exact words. Write what result would show checking does not improve your reads."}, {"name": "Catch it live (rung 8).", "md": "What is the moment you decide not to ask? What tells you it is caution and not avoidance?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your reads, your episodes or your ratings."}]}], "connect": {"title": "Connect and argue: the three lenses side by side", "blocks": [{"t": "p", "md": "Everything in this section is Interpretation: my reading across the sources, to be tested against your episodes."}, {"t": "table", "head": ["Source", "Starts from", "Treats a read as", "Would worry that you..."], "rows": [["Cook-Greuter and Torbert", "Long assessment", "Far less than a stage", "Turn a currency into a type"], ["Snyder", "How we test guesses", "Something your check can bend", "Check only in confirming ways"], ["Ickes", "The person's own report", "A guess to be scored", "Never ask"]]}, {"t": "p", "md": "**Where they meet.** A read is a hypothesis; the best test is a check that could fail, and the best check is often the person's own answer."}, {"t": "p", "md": "**Where they collide.** Ickes favors asking; Blue Belt's office dojo sometimes keeps reads private. Asking gives accuracy; holding back keeps your cards close. The module's answer differs by dojo."}, {"t": "p", "md": "**What the three miss for you.** Checking a read in your second language, or across a power gap, carries its own risk; the sources say little about it."}, {"t": "p", "md": "**Where it sits in your own frameworks.** Mind and Heart with others, and the depth axis of your Orders Grid. In Kegan's terms, a read you can check is one you hold as object rather than look through. Return to this module later and add dated notes; do not overwrite."}]}, "research": {"title": "Research further: three threads to pick from", "blocks": [{"t": "p", "md": "These are gaps the sources left open. Replace them with your own questions whenever you have them."}, {"t": "table", "head": ["Thread", "Question it opens", "Why it connects", "Suggested depth"], "rows": [["1. Can empathic accuracy be trained?", "What does research say about improving empathic accuracy with feedback?", "Part 3 suggests checking helps; is there evidence?", "One thread, researched with the research-brief skill"], ["2. Confirmation in professional judgment", "How does confirmatory hypothesis testing show up in clinical or interviewing settings, and what reduces it?", "Your hypothesis cards are a professional tool", "One thread, with a critic pass"], ["3. Can stage be inferred from talk?", "Is there research on judging developmental level from conversation rather than from scored completions?", "Part 1 rules out quick stage reads", "Full deepening of Part 1"]]}], "prompt": "Use curriculum-module in deepen mode on Blue Belt B2, Part {part}, one thread. My question: {q}. Why it pulled me: {why}. What I already think: {think}. Verify sources with research-brief first, write into the part's Deepened section, and do not write my entries."}}}}, {"id": "B3", "num": 3, "title": "The Need Beneath the Position", "subtitle": "Translate demands into core concerns and interests — answer the need first, hold your boundary.", "guardrail": "Surveillance vs. Care: Never announce someone's need as an accusation ('You just need status'). Under the Transparency Test, only offer answers to needs that are genuinely true — and remember that answering a need is NOT giving in on your boundary.", "assembly": [{"day": "Mon", "step": "Part 1 · Fisher & Shapiro", "ingredient": "Five Core Concerns, Syntax Tells & Zero-Cost Levers"}, {"day": "Tue", "step": "Part 2 · Fisher, Ury & Patton", "ingredient": "Interests vs. Positions + Non-Accusatory Questions"}, {"day": "Wed", "step": "Part 3 · Chase Hughes", "ingredient": "All 6 Needs: Answer vs. Exploit vs. Announce + Honor & Hold"}, {"day": "Thu", "step": "Deliberate Practice Lab", "ingredient": "6-Scenario Position-to-Need Translation Trainer"}, {"day": "Fri", "step": "Deliverable Workshop", "ingredient": "Position-vs-Need Matrix (3 Stalled Conversations)"}], "parts": [{"day": "Monday · Part 1", "author": "Roger Fisher & Daniel Shapiro", "title": "Five Core Concerns", "lens": "Beyond Reason (2005). Practitioner negotiation theory showing that instead of tracking dozens of emotions, you can diagnose and generate positive emotion through 5 relational core concerns.", "mechanism": "Unlike universal physical needs, a core concern arises inside a relationship and shifts by who is in the room. Ignoring one feels like having your nose pushed underwater — triggering rigid, adversarial reactions. Use the 5-Concern Scan whenever a talk stalls: Appreciation (3-step action: understand -> find genuine merit -> communicate), Affiliation (structural or personal), Autonomy (Always Consult Before Deciding), Status (recognize Particular Status — their specific craft — to avoid zero-sum rank battles), and Role.", "tableTitle": "The Five Core Concerns — Syntax Tells & Zero-Cost Levers", "tableHead": ["Core Concern", "Definition", "Syntax Tell (Trampled)", "How You Trample It", "Zero-Cost Lever (Meet It)"], "tableRows": [["1. Appreciation", "Valued recognition of thoughts, feelings, actions.", "'You didn't even read what I sent.' / 'You never ask what I think.'", "Dismissing, interrupting, jumping to rebuttal.", "3-step move: Understand -> find 1 real merit -> state it aloud without agreeing."], ["2. Affiliation", "Connectedness (structural = shared team; personal = warmth).", "'It feels like us vs. them.' / 'You only call when you need something.'", "Treating them as an adversary or keeping cold distance.", "Build structural ('both on the hook for Q3') or personal links."], ["3. Autonomy", "Freedom to affect or make decisions without imposition.", "'You went over my head.' / 'You already decided without me.'", "Telling them what to do, ultimatums, finished decisions.", "Always Consult Before Deciding; offer 2 bounded options."], ["4. Status", "Standing (social = rank; particular = domain expertise).", "'I've been doing this 15 years.' / 'Who authorized this?'", "Talking down, public correction, competing over smarts.", "Recognize their Particular Status (genuine craft or seniority)."], ["5. Role", "Having a fulfilling, meaningful part in the interaction.", "'I'm just a cog here.' / 'I feel like a rubber stamp.'", "Trivializing their job or boxing them into adversary.", "Co-define a constructive role ('devil's advocate on risk')."]], "officeEx": "A senior manager resists your new workflow ('We've always done it this way'). You spot trampled Particular Status and Autonomy: 'You built the controls that kept us clean through three audits [Particular Status + Appreciation]. Before I finalize any draft, I want your eye on which step would break under peak load [Autonomy].'", "personalEx": "A friend snaps 'You always just pick the restaurant and tell me where to show up.' You hear trampled Autonomy and Appreciation: 'You're right — I booked it without asking, and I want nights out to feel like ours, not my schedule. Want to pick tonight, or trade off?'", "nonEx": "Offering hollow flattery ('You're such a visionary leader!') right before pushing an unfair deadline. Core-concern moves fail the second they feel like a trick — the merit must be authentic.", "decisionRule": "Use the 5 concerns proactively before hard meetings (especially your promotion talk). Stop if you catch yourself giving away your actual boundary just to keep the emotional weather smooth.", "handoff": "Use these 5 rows to diagnose the 'Underlying Concern' column of your Friday Position-vs-Need Matrix.", "layer3Title": "Optional Deepening · Donna Hicks (Dignity & Leading with Dignity)", "layer3Body": "Hicks separates Dignity (inherent birthright worth — owed to everyone) from Respect (earned by extraordinary action). Where Fisher & Shapiro treat concerns as negotiation levers, Hicks reframes them as inherent human vulnerabilities: Appreciation -> Acknowledgment & Recognition; Affiliation -> Inclusion; Autonomy -> Independence; Status -> Acceptance of Identity & Fairness. Holding Hicks underneath keeps your levers ethical.", "deepNote": {"label": "Cultural Weighting of the Five Core Concerns (Rung 6)", "body": "Fisher & Shapiro's five concerns exist everywhere, but their relative weight shifts sharply across cultures. Low-context US offices often weight Autonomy and individual Role highest; Latin American, Spanish, and high-hierarchy rooms frequently weight Affiliation (relationship/confianza) and Status (respect/dignity) above unilateral Autonomy. Calibrate which concern you honor first to the room's cultural baseline."}}, {"day": "Tuesday · Part 2", "author": "Roger Fisher, William Ury & Bruce Patton", "title": "Interests Behind Positions", "lens": "Getting to Yes (1981/2011). Principled negotiation theory distinguishing the rigid solution someone demands (Position) from the fears, constraints, and goals driving it (Interests).", "mechanism": "Ask two diagnostic questions: 'Why do they hold this position?' and 'Why have they NOT said yes to mine?' (mapping the political/practical obstacle). Sort interests into Shared, Compatible/Dovetailing (where you value different things), and Conflicting. In live talk, replace sharp 'Why?' questions (which sound accusatory) with 'What' or 'Help me understand...' prompts, listening for the aside or second sentence.", "tableTitle": "Position vs. Fake Interest vs. Real Interest (with Non-Accusatory Prompts)", "tableHead": ["Stated Position", "Fake Interest (Restated Position)", "Real Underlying Interest", "Non-Accusatory Question", "Dovetailing Answer"], "tableRows": [["'It has to be a 12-month contract.'", "'They want a shorter contract.'", "Fear of blame if performance drops in Year 2.", "'What's the biggest risk on your side past 12 months?'", "24-month deal with a 12-month review/exit clause."], ["'No title bump until next cycle.'", "'They want to keep my title.'", "HR band frozen until Q1; manager fears precedent.", "'What hurdle gets in the way of a promotion sooner?'", "Written criteria now + interim lead scope + Q1 effective date."], ["'We need a 10% discount.'", "'They want to pay less.'", "Buyer needs a visible 'win' to show their VP.", "'Help me understand what leadership needs to see.'", "Hold base rate; offer visible onboarding/terms concession."], ["'You never initiate anymore.'", "'They want me to text more.'", "Affiliation: feeling unchosen or low priority.", "'When I go quiet, what does that feel like on your end?'", "Name their priority explicitly + propose specific date."]], "officeEx": "In your promotion prep, your position is 'Promote me to Senior' (interests: recognition, pay, trajectory). Manager's position: 'Budget is tight.' You ask: 'Help me understand what constraints you're navigating with Q4 headcount so we can build a path that works for both of us.' That reveals whether the block is budget or visibility.", "personalEx": "A friend insists 'We have to leave by 6:00 sharp.' Instead of arguing '6:30 is plenty of time,' you ask: 'What makes 6:00 important for you tonight?' They say 'I hate rushing to find parking.' Now you solve the stress interest (take transit at 6:15) instead of fighting over the clock.", "nonEx": "Restating a position as an interest ('Their interest is they don't want to work Friday'), OR using open interest-sharing with a W4 covert aggressor negotiating in bad faith — handing them ammunition.", "decisionRule": "Use interest-mining in collaborative negotiations, friendships, and bureaucracy. Stop and switch back to White Belt W4/W6 (direct request + clean boundary) if the other side bargains in bad faith.", "handoff": "Separate Stated Position from Real Underlying Interest across your 3 stalled conversations in Friday's Matrix, and write one 'What / Help me understand' question for each.", "layer3Title": "Optional Deepening · Daniel Shapiro (Negotiating the Nonnegotiable)", "layer3Body": "Where does Getting to Yes stop working? Shapiro maps conflict on three tiers: Rationality (interests), Emotionality (5 core concerns), and Identity (Homo identicus — who I am and what is sacred). Interest-dovetailing works on Tier 1; the moment a dispute hits Tier 3 identity threat, no clever option lands until you address the identity/concern threat first.", "deepNote": {"label": "3-Bucket Interest Sort & The 'Why Not?' Diagnostic (Rung 5)", "body": "Before your promotion talk or any negotiation, sort both sides' interests into 3 buckets: (1) Shared (both want clean Q4 delivery & retention), (2) Compatible/Dovetailing (you value title/trajectory; manager values staying inside this quarter's budget cap -> solve via written criteria + Q1 effective date), and (3) Conflicting (immediate cash). Then run the 'Why Not?' Diagnostic: list the exact political, budget, or face cost stopping them from saying yes today."}}, {"day": "Wednesday · Part 3", "author": "Chase Hughes", "title": "Needs as Fears, and Answering Without Exploiting", "lens": "Six-Minute X-Ray (2020). All 6 social needs (3 Primary, 3 Secondary) are driven by specific social fears and leak through casual speech. Blue Belt flips Hughes's tradecraft lever under the Transparency Test.", "mechanism": "Almost everyone runs one primary and one secondary need (shifting by context). Use the Honor + Hold Move: [1 honest sentence answering the fear/need] + [Full Period] + [Your clean White Belt boundary/position]. Run the Transparency Test silently: 'If I told them aloud why I just said sentence #1, would it strengthen trust or break it?' Never exploit (Seduction) and never announce the need as an accusation.", "tableTitle": "All 6 Hughes Needs — Fear, Speech Tell, and Answer vs. Exploit vs. Announce", "tableHead": ["Need", "Core Fear Guarded", "Speech Tell (6MX)", "Answering It (Passes Test)", "Exploiting It (Fails)", "Announcing It (Fails)"], "tableRows": [["1. Significance (Pri)", "Being ignored, feeling small, ridicule.", "'20 years in this industry...' / 'Only $80k...'", "Acknowledge genuine impact or contribution.", "Fake awe/flattery to extract a discount.", "'You just want to feel important.'"], ["2. Approval (Pri)", "Dismissal, disapproval, contempt.", "'I really suck at these...' / needless apologies.", "Give clear, honest reassurance & specific recognition.", "Withhold warmth so they over-give to earn it.", "'Stop fishing for compliments.'"], ["3. Acceptance (Pri)", "Exclusion, gossip, peer mismatch.", "'Friends blowing up my phone...' / 'Great fit.'", "Genuine inclusive language; welcome into shared work.", "Threaten exclusion ('Everyone else is on board').", "'You're just trying to fit in.'"], ["4. Intelligence (Sec)", "Being seen as dumb, questioned, called out.", "'Actually...' / 'Back at Harvard...' / 'Idiots...'", "Take their reasoning seriously; ask for analysis.", "Seduction (W4): praise brilliance before a bad ask.", "'You always have to be the smartest.'"], ["5. Pity (Sec)", "Being disregarded, misunderstood, disbelieved.", "'Sick all week...' / 'This traffic is ridiculous.'", "Confirm difficulty honestly + brief pause; don't rush to fix.", "Fake sympathy to create obligation.", "'You're playing the victim again.'"], ["6. Strength / Power (Sec)", "Being 'punked,' disrespected, dominated.", "Blunt declaratives, boasting defiance, louder tone.", "Respect agency; offer 2 real choices they control.", "Bait their pride into a fight to steer them.", "'You just need to feel powerful.'"]], "officeEx": "A Strength-need vendor says 'Take 12 months or we walk.' Honor + Hold: 'You're the one owning this risk and you should have the final call on term length [Honors Strength]. We can't do our 24-month rate on 12 months, so here are two 12-month structures — Option A at standard rate or Option B narrower scope. Which fits better? [Holds boundary].'", "personalEx": "A Pity-need friend vents about a brutal week ('Everything falls on me, nobody gets it'). Instead of a 5-step fix (which makes them feel disbelieved), you Answer + Pause: 'That sounds genuinely exhausting — carrying all of that alone all week is brutal.' [2-sec pause].", "nonEx": "Spotting a colleague's Intelligence need and saying 'Honestly, you're the only one sharp enough to untangle this — could you absorb my Friday deadline?' (Textbook W4 Seduction — fails Transparency Test).", "decisionRule": "Use the Needs Map to spot the fear driving rigidity, and answer only with something genuinely true. Stop the second you feel a sneaky rush of 'I've got their lever' — you just crossed into exploiting.", "handoff": "Write one Honor + Hold sentence in the final column of your Friday Position-vs-Need Matrix for each stalled conversation, verified against the Transparency Test.", "layer3Title": "Optional Deepening · I-Thou Relations Communication Outline", "layer3Body": "In tactical profiling, spotting a need reduces the other person to an 'It' (Buber) — a lock to be picked. In the personal dojo, dismantle the urge to profile for leverage and use the exact same perception to locate where they are hurting so you can sit there with them without reinforcing their armor.", "deepNote": {"label": "Two Critical Hughes Distinctions: Approval vs. Acceptance & Strength Dichotomy", "body": "In Six-Minute X-Ray, Hughes draws two sharp lines: (1) Approval vs. Acceptance — Approval-seekers want individual validation and permission; Acceptance-seekers are willing to reshape their speech, dress, or opinions to belong to a group/tribe. (2) High-End vs. Low-End Strength — High-end strives to lead teams and systems; low-end (often with a history of feeling dominated) over-postures and speaks louder to avoid ever being 'punked.'"}}], "prompt": "Recall one recent stalled conversation (work or personal). Identify: (1) Their exact stated position; (2) The aside or second sentence that leaked the real concern; (3) One zero-cost Honor + Hold response.", "orig": {"belt": "blue", "name": "The need beneath the position", "lead": "Translate what someone demands into what they need, and answer the need first.", "teaching": [{"t": "h", "text": "Concepts"}, {"t": "steps", "items": [{"name": "Hughes' needs, corrected.", "md": "Primary: significance, approval, acceptance. Secondary: intelligence, pity, strength/power (Source: 6MX p. 174; pp. 186–190 as reported). Each is described by the fear it guards: significance against being ignored or feeling small; approval against disapproval; acceptance against not belonging; intelligence against being seen as dumb; pity against being disbelieved; strength against being disrespected or dominated (Source: 6MX pp. 187, 218). Hughes' line: strength-need people \"don't need power. They need to FEEL powerful\" (Source: 6MX p. 209, NL quote). *Control is not on the map*; when someone seems driven by control, Fisher and Shapiro's autonomy and Hughes' strength cover it."}, {"name": "The five core concerns (Fisher and Shapiro).", "md": "Appreciation (are my thoughts and feelings understood and valued?), affiliation (am I treated as a colleague or an adversary?), autonomy (is my freedom to decide respected?), status (is my standing acknowledged?), role (do I have a meaningful role here?) (Source: Beyond Reason pp. 28–131, as reported). A deadlock is rarely about the terms; usually a concern has been trampled."}, {"name": "The translation matrix (Curriculum, Layer 2 Module 2).", "md": "Three ways to hear the same demand, \"We can't accept 24 months; it has to be 12\":"}]}, {"t": "table", "head": ["What you hear underneath", "Need or concern", "Answer to the need"], "rows": [["\"My boss will kill me if I bring back a two-year lock-in.\"", "Affiliation, safety", "Give them a story they can take back: an exit clause, a review point"], ["\"Your standard terms restrict how our team works.\"", "Autonomy, competence", "Let them rewrite the clause that touches their work"], ["\"I don't do multi-year deals. Take 12 or we walk.\"", "Strength, status, autonomy", "Two distinct 12-month options; they spend energy choosing rather than fighting"]]}, {"t": "steps", "items": [{"name": "Listen for the tell in the syntax.", "md": "The need leaks in the second sentence, the aside, the joke. The original calls this hearing the inner monologue beneath the business position. You know it as the thing a patient says on the way out of the room."}, {"name": "Answering the need is not giving in.", "md": "You can answer a status need (acknowledge their seniority) and still hold your position on price. White Belt's boundary rules still apply."}]}], "drill": "The \"why\" drill. When anyone states a position today (at work, in a shop, at home), silently name the need or core concern under it before you answer. Once a day, answer the need out loud first.", "office": "Before any negotiation (your promotion conversation is the obvious field project), write the other side's likely positions and, beside each, the concern it may protect. Then write how you could honor that concern at no cost to your ask.", "personal": "When a friend complains, hear the concern: \"you never initiate\" is often affiliation and appreciation; \"you decided without me\" is autonomy. Answer the concern directly and warmly. The I-Thou outline's example is the right register: \"I realize I've been terrible at reaching out lately, and I hate that it made you feel like you aren't a priority. You are.\" (Curriculum, I-Thou Layer 2)", "deliverable": {"name": "The position-versus-need matrix", "md": "Take three past conversations that stalled (at least one at work, one personal). For each, write the stated position, the concern you now think was underneath, and what you could have answered instead.\n\n**Watch for.** Diagnosing aloud. \"You're just insecure about status\" names a need as an accusation. You answer the need; you do not announce it."}, "tools": ["hooks"], "deepened": {"original": "top", "parts": [{"n": 1, "title": "Part 1 · Fisher and Shapiro: five core concerns", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Roger Fisher, co-founder of the Harvard Negotiation Project, and Daniel Shapiro, a psychologist who founded the Harvard International Negotiation Program, wrote *Beyond Reason* (2005) about emotions in negotiation. Their claim is that you do not need to read every emotion; you can attend to five core concerns that generate most of them: appreciation, affiliation, autonomy, status and role. When a concern is met, positive emotions tend to follow; when it is trampled, negotiations stall. What is distinctive is that it turns emotion into a short list you can act on without psychologizing anyone."}, {"t": "note", "label": "Why Fisher and Shapiro here", "md": "The module translates positions into needs. The five concerns give a vocabulary that works at a table without diagnosing anyone."}, {"t": "note", "label": "Native use", "md": "Negotiation teaching and practice, from business to diplomacy."}, {"t": "note", "label": "Limit", "md": "Practitioner theory from experienced negotiators and teachers (label: practitioner theory). I did not find direct tests of the five-concern structure in what I used. It is a working lens, and it overlaps with other need models, including Hicks's dignity elements."}, {"t": "h", "text": "The five concerns, as levers you can offer"}, {"t": "table", "head": ["Concern", "Trampled when", "You can offer it by"], "rows": [["Appreciation", "Their view is ignored or dismissed", "Finding merit in their thinking and saying so"], ["Affiliation", "They are treated as an adversary", "\"We\" language; a shared problem"], ["Autonomy", "Decisions are made for them", "Consulting before deciding"], ["Status", "Their standing is overlooked", "Acknowledging their expertise or rank"], ["Role", "Their part feels meaningless", "Shaping a role they find fulfilling"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "In a session you interpreted, when did a dispute seem to be about terms but really be about someone feeling dismissed?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: why do Fisher and Shapiro focus on five concerns instead of reading emotions directly?"}, {"name": "Make sense (rung 2).", "md": "Pick one concern. Give an example of it being trampled and a non-example: a strong emotion that is not about that concern."}, {"name": "Find it in your life (rung 3).", "md": "Write three stalled conversations. For each, write the stated position and the concern you think was trampled. Only then rate which concern you most often trample in others, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "Which concern of yours gets trampled most easily? What do you do when it is?"}, {"name": "Connect (rung 5).", "md": "Do the five concerns line up with Hicks's dignity elements, or with Hughes's needs from W3 Part 1? Pick one overlap and one difference. State a guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "Are the five concerns universal? In a hierarchy-first or family-first culture, does status or affiliation outweigh autonomy? Where would the list miss you?"}, {"name": "Test (rung 7).", "md": "Before one low-stakes disagreement, name the concern you think is at stake for the other person and one way to offer it at no cost to your ask. Before you speak, predict the effect. Afterward, record their words. Write what result would show you named the wrong concern."}, {"name": "Catch it live (rung 8).", "md": "When your own status or autonomy is trampled, what happens in your body first?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your episodes, your matches or your ratings."}]}, {"n": 2, "title": "Part 2 · Fisher, Ury and Patton: interests behind positions", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Roger Fisher and William Ury, with Bruce Patton in later editions, wrote *Getting to Yes* (1981), which made \"focus on interests, not positions\" the core of principled negotiation. A position is what someone says they want; an interest is why they want it. Behind opposed positions there are often shared or compatible interests. What is distinctive is the instruction to ask \"why?\" and \"why not?\" about every position, including your own. Their book is not in your notebook, so this card rests on general knowledge of a widely read text."}, {"t": "note", "label": "Why they are here", "md": "The translation matrix in this module is an interests exercise. This part gives its origin and its simplest form."}, {"t": "note", "label": "Native use", "md": "Negotiation, from contracts to international disputes, taught as principled bargaining."}, {"t": "note", "label": "Limit", "md": "Practitioner theory, very influential, criticized for underplaying power differences and hard bargaining (label: practitioner theory; not in notebook). Answering an interest does not oblige you to give up your own; White Belt's rules hold."}, {"t": "h", "text": "Position, interest, and what you can answer"}, {"t": "table", "head": ["Position", "Possible interest", "An answer to the interest"], "rows": [["\"It has to be 12 months.\"", "Not being locked in", "An exit clause at 12 months"], ["\"We need a 10% discount.\"", "Looking strong to a boss", "A visible concession on something cheap for you"], ["\"You never initiate.\"", "Feeling chosen", "Proposing a specific plan"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "When did asking \"why do you need that?\" change a conversation you were in?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what is the difference between a position and an interest, and what do Fisher and Ury tell you to do with it?"}, {"name": "Make sense (rung 2).", "md": "Write one position and three possible interests behind it. Then a non-example: an \"interest\" that is really just the position restated."}, {"name": "Find it in your life (rung 3).", "md": "Write three of your own positions from recent disagreements and the interest behind each. Only then rate how often you argue positions rather than interests, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does holding a position protect for you? What does naming your interest risk?"}, {"name": "Connect (rung 5).", "md": "For your promotion conversation, write your position and your interest, then theirs. State a guess about their interest and what would show it wrong. In your Orders Grid this sits in Mind."}, {"name": "Argue (rung 6).", "md": "Getting to Yes assumes both sides want agreement. What if one side is using tactics, as in W4? Where does the interests frame stop working?"}, {"name": "Test (rung 7).", "md": "In one low-stakes disagreement, ask one \"why does that matter to you?\" question before you answer. Before you ask, predict the interest. Afterward, record their words. Write what result would show the position was the interest."}, {"name": "Catch it live (rung 8).", "md": "What is the urge you feel to counter a position before you understand it?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your positions, your interests or your ratings."}]}, {"n": 3, "title": "Part 3 · Hughes: needs as fears, and answering without exploiting", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Hughes's full lens card is W3 Part 1, where you mapped your own needs. Here only one angle is new: each need is described by the fear it guards, and in his native use a spotted need is a lever. This module turns the lever around: you answer a need, you do not pull it."}, {"t": "note", "label": "Why Hughes here", "md": "The module's need-level answers, such as acknowledging seniority while holding your price, are Hughes's map used under the transparency test."}, {"t": "note", "label": "Native use", "md": "Profiling and influence. The answer-not-exploit use is this curriculum's."}, {"t": "note", "label": "Limit", "md": "Practitioner theory with no validation found (label: practitioner theory). The main shadow is diagnosing aloud: naming someone's need as an accusation."}, {"t": "h", "text": "Answer, exploit or announce"}, {"t": "table", "head": ["Need", "Answering it", "Exploiting it", "Announcing it"], "rows": [["Significance", "Acknowledge their contribution", "Flatter to get a yes", "\"You just want attention.\""], ["Strength", "Give them a real choice", "Bait them into a fight they must win", "\"You need to feel powerful.\""], ["Intelligence", "Take their idea seriously", "Praise their mind before an ask", "\"You need to be right.\""]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "Where have you watched someone answer a need well, so the other person softened without being managed?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: how does Hughes connect each need to a fear, and how was his map meant to be used?"}, {"name": "Make sense (rung 2).", "md": "For one need, write an answer, an exploit and an announcement. Explain which one passes the transparency test."}, {"name": "Find it in your life (rung 3).", "md": "Write three moments when someone answered, exploited or announced one of your needs. Only then rate which you meet most, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does seeing a need in someone give you? When has it slipped toward leverage?"}, {"name":
