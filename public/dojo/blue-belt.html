passive registration of an objective external reality\"*—and Lisa Feldman Barrett notes that *\"what we see, hear, touch, taste, and smell are largely simulations of the world, not reactions to it.\"* When your own threat system is slightly primed, your brain auto-completes a neutral pause with a threat simulation. The Camera Test is the circuit breaker that catches the simulation before you act on it.", "deepNote": {"label": "Feedback-Loop Asymmetry & Vocal-Over-Visual Rule (Rung 6)", "body": "Why don't thousands of interpreting sessions automatically beat DePaulo & Bond's ~54% lie-detection ceiling? Because live interpreting delivers instant *semantic and tonal* feedback—honing your ear for vocal tension, pace, and hesitancy—not objective truth-versus-lie verification. Lean directly into DePaulo & Bond's modest positive finding: **audible cues** (vocal tension, cadence shifts, verbal detail) carry measurably more real signal than silent posture myths."}}, {"day": "Wednesday · Part 3", "author": "Paul Ekman & David Matsumoto", "title": "Display Rules Across Cultures and Contexts", "lens": "Ekman & Friesen (1969) and Matsumoto's 32-country Display Rule Assessment Inventory (DRAI). Tested cross-cultural questionnaire research demonstrating that every culture teaches implicit rules governing **which emotions may be shown, how loudly, to whom, and in which rooms.**", "mechanism": "Even when you lock a clean baseline (Monday) and strip out mind-reading stories (Tuesday), you can still misread a person completely if you measure their face and voice against *your* culture's acoustics instead of *theirs*. Every society installs **display rules**—social volume knobs that alter how an inner state reaches the surface depending on whether the room is public or private, and whether you are in-group or out-group.\n\nThose rules operate through six concrete modifications: **Express** (show unmodified), **Amplify** (turn the volume up, as in warm peer solidarity), **Deamplify** (dial down for workplace composure), **Neutralize** (drop to a flat poker face in public authority), **Qualify** (layer a smile onto a refusal to soften the blow), and **Mask** (cover frustration or shame behind politeness). Whenever a face or tone surprises you, run a two-second **Context Check** before forming a hypothesis: *(1) Which of the six display-rule moves might be running right now? (2) Who am I to them in this room—public or private, peer or hierarchy?*", "tableTitle": "Ekman & Matsumoto's 6 Display-Rule Moves", "tableHead": ["Display-Rule Move", "What They Do", "Common Trigger", "Misread (Your Rules)", "Read (Their Rules)"], "tableRows": [["1. Express", "Show the feeling unmodified.", "Private setting or close in-group.", "'Too raw' or 'unprofessional.'", "Trust, closeness, or high-expressivity norm."], ["2. Amplify", "Show more than felt.", "Warm hospitality, expressive peer norms (e.g., Rioplatense friends).", "'Overreacting' or 'aggressive.'", "Enthusiasm, solidarity, active engagement."], ["3. Deamplify", "Show less than felt.", "Professional offices, hierarchy, modesty norms.", "'Unenthusiastic' or 'bored.'", "Composure, politeness, measured respect."], ["4. Neutralize", "Show nothing (flat affect / poker face).", "Public bad news, formal authority, high-restraint cultures.", "'Cold' or 'stonewalling.'", "Dignity, self-control, protecting the room."], ["5. Qualify", "Show feeling + a second cue (smiling while stating irritation).", "Softening disagreement or refusal to preserve face.", "'Passive-aggressive' or 'not really upset.'", "Caring about the bond while delivering hard news."], ["6. Mask", "Hide feeling behind a different expression (smiling through shame/anger).", "High-context refusal, subordinate-to-boss settings.", "'Insincere' or 'totally fine with it.'", "Face-saving politeness; check words and context."]], "officeEx": "You report a project delay to a senior director during a ten-person team review. Her face stays completely flat (Neutralize) and she says briskly, \"Noted—let's keep moving.\" Rather than reading icy rage, you recognize public-meeting neutralization protecting the room's composure, and follow up 1-on-1 afterward to get her unfiltered read.", "personalEx": "A friend from a high-restraint background smiles softly while declining your dinner invitation (Qualify / Mask) instead of offering an animated, apologetic story. Rather than reading insincerity or coldness, you hear a harmony-preserving boundary and accept their no with warmth.", "nonEx": "Turning a cultural lens into a rigid national stereotype—assuming every colleague from a given country *always* neutralizes anger, and therefore overlooking an individual colleague's actual personal baseline.", "decisionRule": "Use display rules to **widen your definition of normal**, never to stereotype by nationality. When closeness allows, check someone's display rules directly in plain words (\"I'm terrible at reading poker faces—when you're actually annoyed versus just tired, what does it look like for you?\"). Carry this calibrated acoustic floor forward into **B2**, where you will read which way the wind is blowing right now without mistaking a habit or display rule for a currency.", "handoff": "Add a one-line **Context & Display-Rule Note** at the bottom of each Friday Baseline Card noting setting (public/private) and likely display rule—then carry those exact people into B2's Hypothesis Cards.", "layer3Title": "Optional Deepening · Aneta Pavlenko (Emotions and Multilingualism)", "layer3Body": "Aneta Pavlenko pushes display rules one layer deeper for bilingual lives: languages do not merely apply different volume knobs to identical feelings—they carry distinct **relational emotion scripts**. She notes how Russian relational verbs like *serdit'sia* and *obizhat'sia* presuppose an ongoing close bond and impending reconciliation; when enacted in an English-dominant household without those scripts, partners misread a normal bid for reconnection as *\"pouting\"* or *\"overreacting.\"* For a bilingual person, switching between Spanish and English can shift the emotional script itself—meaning a fair Baseline Card for a bilingual friend may legitimately look different in each language.", "deepNote": {"label": "The Faces Debate: Ekman vs. Barrett — What Survives? (Rungs 1 & 6)", "body": "Basic Emotion Theory (Ekman) argues a core set of facial expressions is biologically universal and then edited by cultural display rules. Constructed Emotion Theory (Lisa Feldman Barrett) argues facial muscles do not map 1-to-1 onto fixed emotions—a scowl can signal anger, deep concentration, or bright sunlight—and emotions are constructed from context and concepts. What survives **both** camps for Blue Belt is rock-solid: *(1) observable shifts in arousal/valence against a personal baseline, (2) cultural display rules shaping what is appropriate to show, and (3) checking context rather than decoding isolated faces.*"}}], "prompt": "Pick one person you see weekly. Before Friday, note: (1) Your own W1 body state when around them; (2) Two observable baseline habits; (3) One cultural/context display rule they likely use in that setting.", "orig": {"belt": "blue", "name": "The baseline", "lead": "Before you interpret anything, record what is normal for this person: posture, pace, volume, gaze, hands, how much space they take. Then read only changes from that baseline.", "teaching": [{"t": "h", "text": "Concepts"}, {"t": "steps", "items": [{"name": "The silent sweep (Curriculum, Layer 2 Module 1, from Hughes).", "md": "In the first minute, without staring, take in: resting posture (raised or dropped shoulders), how much space they claim, speaking pace and volume, eye contact pattern, what their hands do. Log it as *neutral for this person*."}, {"name": "The neutral audit.", "md": "If someone is naturally fidgety or fast, that is their baseline, not a tell. The most common reading error is calling a person's normal a sign."}, {"name": "Clusters, not single cues.", "md": "Hughes' deception and stress indicators are useful only as a *change from baseline*, in clusters, in context (Source: 6MX pp. 163, 172–180, as reported). One crossed arm means nothing. A sudden cluster after a specific question means \"something about that question matters\" — not \"they are lying\"."}, {"name": "Cultural baselines.", "md": "A baseline is also cultural. Tannen's high-involvement speakers overlap and talk fast as a sign of engagement; high-considerateness speakers leave long pauses as respect (Source: That's Not What I Meant! pp. 47–56, as reported). Rioplatense conversation among friends often runs high-involvement; a quiet English-speaking colleague's pause is not coldness. Read the person against their own culture's normal before against yours."}, {"name": "Read yourself too.", "md": "Your White Belt tell list is your own baseline. A read is always two baselines: theirs and yours. If your jaw is tight, your read is suspect."}]}, {"t": "p", "md": "**What you bring.** You already baseline voices. Extend it to bodies and to the room."}], "drill": "The silent sweep. In a public, low-stakes place (a café, the train, the gym floor), take a 30-second sweep of one person: posture, pace, space, hands. Then look away and say to yourself one sentence of baseline. Never stare; if you cannot do it without changing your own behavior, it is not yet automatic.", "office": "In the first minute of a meeting or video call, take the sweep of the person who matters most to the outcome. Write their baseline in the margin.", "personal": "Do it as noticing, not cataloguing: what does this friend look like when they are at ease? You will need that picture to notice when they are not, and to ask about it gently.", "deliverable": {"name": "Three baseline cards", "md": "For three people you see often (one colleague, one friend, one person in a service setting you see repeatedly), write a card: posture, pace, volume, gaze, space, hands, and one thing that changes when they are stressed (only if you have actually seen it).\n\n**Watch for.** Using the baseline to catch people. In the personal dojo, the baseline is for care: noticing when someone is off so you can ask."}, "deepened": {"original": "top", "parts": [{"n": 1, "title": "Part 1 · Hughes: the baseline and the cluster", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Hughes's full lens card is W3 Part 1. Here only his reading method matters: before any cue means anything, you record what is normal for this person, then read only departures from that baseline, in clusters, tied to a moment. What is distinctive is that the unit of reading is a change, not a gesture. A crossed arm is not a tell; a cluster of changes right after one question is a pointer to that question."}, {"t": "note", "label": "Why Hughes here", "md": "This module trains the first minute of reading: a silent sweep, a neutral audit, and the rule that a person's normal is never a sign."}, {"t": "note", "label": "Native use", "md": "Interrogation, intelligence and sales work, aimed at subjects, often with the goal of an advantage. Pointing it at friends and colleagues for care, not leverage, is this curriculum's move."}, {"t": "note", "label": "Limit", "md": "Practitioner tradecraft (label: practitioner theory). The baseline-then-change logic is sound as method; the meanings Hughes attaches to specific cues are not tested in the material I used. Part 2 shows what research says about how well anyone reads cues at all."}, {"t": "h", "text": "The sweep, as a record and not a verdict"}, {"t": "table", "head": ["Channel", "What to log as baseline", "What a change might mean", "What it cannot tell you"], "rows": [["Posture and space", "Resting shoulders, how much room they take", "Something about this moment matters", "Why it matters"], ["Pace and volume", "Their normal speed and loudness", "Arousal rose or fell", "Whether it is fear, anger, excitement or fatigue"], ["Gaze", "Their usual eye-contact pattern", "Attention shifted", "Whether they are lying"], ["Hands", "What they usually do", "Self-soothing, or simply a new topic", "Intent"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "In your interpreting, how did you learn a speaker's normal voice before you could hear stress in it? How long did it take?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: why does Hughes insist on a baseline before any reading, and who was the method built to be pointed at?"}, {"name": "Make sense (rung 2).", "md": "Give one example of a real change from baseline and one non-example: a person's normal habit that a stranger would misread as a tell."}, {"name": "Find it in your life (rung 3).", "md": "Write three people you see often and what you have actually seen as their normal, then one moment each when something changed. Only then rate how confident you are in each baseline, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does reading people quickly protect for you, and what does it cost? Where does your reading serve someone, and where does it keep you safely watching?"}, {"name": "Connect (rung 5).", "md": "Does your own tell list from W1 change your read of others? When your jaw is tight, what do you see in them? State it as a guess and name what would show it wrong. In your Orders Grid this sits in Body and Mind."}, {"name": "Argue (rung 6).", "md": "A baseline is cultural. Would your sweep of a Rioplatense friend and of a quiet US colleague use the same idea of \"normal\"? Where would Hughes's method misread someone autistic or from a culture with different gaze norms?"}, {"name": "Test (rung 7).", "md": "Do the silent sweep on one person a day for three days in a low-stakes place. Before you start, predict one thing you expect to see as their normal. Afterward, note whether a second look confirmed it. Write what result would show your first-minute read is unreliable."}, {"name": "Catch it live (rung 8).", "md": "What is the moment you shift from noticing to concluding? Name the inner word that marks it."}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your baselines, your episodes or your ratings."}]}, {"n": 2, "title": "Part 2 · DePaulo and Bond: what cues can and cannot tell", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Bella DePaulo, a social psychologist, led large reviews of research on how lies show in behavior, and with Charles Bond Jr. reviewed hundreds of studies of how accurately people judge truth from lies. Their central findings are sobering: most behaviors people believe signal lying are weakly related to it or not at all, and people judging strangers are right only a little more often than chance. What is distinctive is the scale of the evidence: this is the research base under every \"body language\" claim, and it mostly says the cues are faint."}, {"t": "note", "label": "Why DePaulo and Bond here", "md": "The module already says a cluster means \"something about that question matters,\" not \"they are lying.\" This part supplies the evidence behind that restraint."}, {"t": "note", "label": "Native use", "md": "Laboratory and field studies of deception detection, mostly with strangers and short clips. They were not built to test a careful reader who knows a person's baseline over months; that gap is real and cuts both ways."}, {"t": "note", "label": "Limit", "md": "Tested research (meta-analyses). It concerns lie detection specifically, not reading emotion or stress in general, and most studies use strangers. Knowing someone well may help, but the reviews give little support to confident claims of reading deception from the body."}, {"t": "h", "text": "What the research supports"}, {"t": "table", "head": ["Claim", "Status"], "rows": [["Specific gestures reliably reveal lying", "Not supported; most such cues are weak or absent"], ["People detect lies from behavior well above chance", "Not supported; accuracy is only slightly above chance"], ["A change in behavior shows something mattered to the person", "Plausible, and modest; it does not say what"], ["Experts and trained professionals do much better", "Weak support in the reviews (interpretation of their summaries)"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "Have you ever been sure someone in a session was hiding something? What made you sure, and did it turn out to be true?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what did DePaulo and Bond find about deception cues and accuracy, and what kind of studies were they reviewing?"}, {"name": "Make sense (rung 2).", "md": "Give one example of a reasonable inference from a change in behavior and one non-example: an inference that jumps from the change to a motive."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you read someone's body as meaning something specific. For each, write what you saw, what you concluded and what you learned later. Only then rate how often your specific conclusions held, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does a confident read give you, such as control or the sense of being ahead? What did it cost when it was wrong?"}, {"name": "Connect (rung 5).", "md": "Does the intelligence hook from W3 make confident reads tempting? State it as a guess and name what would show it wrong. In your Orders Grid this sits in Mind."}, {"name": "Argue (rung 6).", "md": "Your work gave you thousands of sessions with feedback. Does that make you an exception to the reviews, or is that the belief the reviews were testing? What would count as evidence either way?"}, {"name": "Test (rung 7).", "md": "For one week, each time you notice a cluster, write only \"something about ___ matters\" and one question you could ask. Before you start, predict how often asking would confirm your guess. Afterward, record any answer you got. Write what result would show your reads add nothing."}, {"name": "Catch it live (rung 8).", "md": "When does \"something matters here\" turn into \"they are lying\" in your head? Catch the word that does it."}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your reads, your episodes or your ratings."}]}, {"n": 3, "title": "Part 3 · Ekman and Matsumoto: display rules", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Paul Ekman and Wallace Friesen proposed in the late 1960s that cultures teach display rules: norms about which feelings may be shown, to whom and how strongly. David Matsumoto later studied display rules across many countries. Their work on facial expression also argued that some expressions are recognized across cultures, a claim that later research, for example by Lisa Feldman Barrett and colleagues, has challenged. What is distinctive for this module is the display-rule idea: the same feeling can be shown loudly in one culture and masked in another, so a baseline is partly a cultural fact."}, {"t": "note", "label": "Why Ekman and Matsumoto here", "md": "The module's concept of cultural baselines needs a mechanism. Tannen, whose full card is W4 Part 1, covers pace and overlap; display rules cover the face and the body."}, {"t": "note", "label": "Native use", "md": "Cross-cultural research on emotional expression, with posed photos and self-report questionnaires on what people think is appropriate to show."}, {"t": "note", "label": "Limit", "md": "Display rules are well supported as a concept (label: tested research, mostly questionnaire-based). The stronger claim that facial expressions map reliably onto specific emotions is contested. Use display rules to widen your idea of \"normal,\" not to decode faces."}, {"t": "h", "text": "Three ways to misread across display rules"}, {"t": "table", "head": ["What you see", "Reading against your own rules", "Reading against theirs"], "rows": [["A flat face during bad news", "Cold, or not affected", "Respect, or composure expected in public"], ["Loud, animated disagreement", "Hostility", "Engagement among equals"], ["A smile while refusing", "Agreement, or insincerity", "Politeness that softens a no"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "What did you learn about showing feelings in Oberá, and what did you learn after you moved? Where did the two rules clash?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what is a display rule, and which of Ekman's claims is still debated?"}, {"name": "Make sense (rung 2).", "md": "Give one example of a display rule from a culture you know well and one non-example: an individual habit that is not a cultural rule."}, {"name": "Find it in your life (rung 3).", "md": "Write three moments when you misread someone's face or tone, or were misread, because of different rules. Only then rate how often culture explains your misreads, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "Which display rules do you follow at work? What do they protect, and what do they hide?"}, {"name": "Connect (rung 5).", "md": "How do display rules interact with Tannen's styles from W4 Part 1? State one guess about a person you know and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "If faces do not map neatly onto emotions, what is left of reading at all? Where is the line between widening \"normal\" and stereotyping a culture?"}, {"name": "Test (rung 7).", "md": "With one person from a different background, ask in a low-stakes moment how they usually show irritation or delight. Before you ask, predict their answer. Afterward, record what they said. Write what result would show your cultural guess was wrong."}, {"name": "Catch it live (rung 8).", "md": "When a face surprises you, what is the first story you tell? Whose rule is that story using?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your episodes, your guesses or your ratings."}]}], "connect": {"title": "Connect and argue: the three lenses side by side", "blocks": [{"t": "p", "md": "Everything in this section is Interpretation: my reading across the sources, to be tested against your episodes."}, {"t": "table", "head": ["Source", "Starts from", "Treats a cue as", "Would worry that you..."], "rows": [["Hughes", "The person's own normal", "A departure worth noticing", "Read a habit as a tell"], ["DePaulo and Bond", "Hundreds of studies", "Weak evidence about motive", "Trust a confident read"], ["Ekman and Matsumoto", "Cultural norms for showing feeling", "Partly a cultural performance", "Use your own culture's normal for everyone"]]}, {"t": "p", "md": "**Where they meet.** All three narrow what a cue can mean. A change says something mattered; culture shapes how it shows; the reviews say the motive behind it is rarely readable from the body alone."}, {"t": "p", "md": "**Where they collide.** Hughes's tradecraft is confident about specific cues; the deception reviews are not. The module sides with the reviews by asking you to check reads back, which is Blue Belt's next module."}, {"t": "p", "md": "**What the three miss for you.** You read voices across two languages for a living. None of the three studies interpreters, who read a speaker against two sets of rules at once."}, {"t": "p", "md": "**Where it sits in your own frameworks.** Body and Mind in your Orders Grid. In somatic terms, your own arousal colors every read. Return to this module later and add dated notes; do not overwrite."}]}, "research": {"title": "Research further: three threads to pick from", "blocks": [{"t": "p", "md": "These are gaps the sources left open. Replace them with your own questions whenever you have them."}, {"t": "table", "head": ["Thread", "Question it opens", "Why it connects", "Suggested depth"], "rows": [["1. Does knowing someone help?", "Does accuracy in reading deception or stress improve with long familiarity, and what does the research say about close relationships?", "The reviews mostly use strangers", "One thread, researched with the research-brief skill"], ["2. Interpreters as readers", "Is there research on interpreters' perception of speakers' emotional states?", "Your own expertise is the untested case", "One thread, with a critic pass"], ["3. The faces debate", "What is the current state of the debate between universal expressions and constructed emotion?", "Part 3 rests on a contested base", "Full deepening of Part 3"]]}], "prompt": "Use curriculum-module in deepen mode on Blue Belt B1, Part {part}, one thread. My question: {q}. Why it pulled me: {why}. What I already think: {think}. Verify sources with research-brief first, write into the part's Deepened section, and do not write my entries."}}}}, {"id": "B2", "num": 2, "title": "Reading the Currency", "subtitle": "Spot what they scan for right now, test it so it can fail, and check it back.", "guardrail": "Surveillance vs. Care: Never lock a currency into a stage verdict ('He's an Expert'). In the office dojo, use currency reads to choose your opening register. In the personal dojo, there are NO fake stress tests — read natural friction to learn how to care for them.", "assembly": [{"day": "Mon", "step": "Part 1 · Cook-Greuter & Torbert", "ingredient": "Verb-Only Currencies & Role Look-Alike Filter"}, {"day": "Tue", "step": "Part 2 · Snyder & Swann", "ingredient": "Falsifiable Disconfirming Checks (All 6 Currencies)"}, {"day": "Wed", "step": "Part 3 · William Ickes", "ingredient": "Empathic Accuracy Benchmarks & Face-Safe Check-Backs"}, {"day": "Thu", "step": "Deliberate Practice Lab", "ingredient": "6-Quote Currency & Face-Safe Check-Back Drill"}, {"day": "Fri", "step": "Deliverable Workshop", "ingredient": "Five Checked Hypothesis Cards + Hit Rate"}], "parts": [{"day": "Monday · Part 1", "author": "Susanne Cook-Greuter & William Torbert", "title": "Why a Stage Cannot Be Read in Minutes", "lens": "*Nine Levels of Increasing Embrace* (Cook-Greuter, 2013) and *Action Inquiry* (Torbert, 2004). Theory with developmental assessment evidence: both frameworks measure a person's **Center of Gravity** across thirty-six or more written sentence completions scored by trained raters—never from a five-minute hallway exchange.", "mechanism": "With B1's acoustic floor calibrated, you can now read which way the wind is blowing in a live room—without committing the classic developmental scale error of mistaking a **single gust of wind** (**currency**) for the **thirty-year climate record** (**developmental stage**). Once you learn a stage map, the temptation to use it as a sorting hat is immediate: someone corrects two rounding errors and your mind stamps *Expert*; a vendor pushes hard on price and you stamp *Opportunist*.\n\nCook-Greuter never found an adult protocol narrower than three developmental levels. Every person operates from a **Center of Gravity** when calm and resourced, surrounded by a **Growth Edge** when supported and a **Trailing Edge**—an earlier pattern they drop into under stress, fatigue, or threat. Because B2 observes people during moments of natural friction, the behavior you catch in a tense meeting is frequently their *Trailing Edge* rather than their home base. Worse, institutional roles mimic stages with eerie precision: an auditor paid to catch errors looks like an *Expert*, and a procurement buyer paid to protect downside looks like an *Opportunist*. Blue Belt strips away stage-typing by replacing permanent nouns (\"is an Expert\") with **verb-only currencies** (\"is scanning for Accuracy right now\"), paired with a three-second **Role Filter**: *Is this their job title or deadline talking, or their recurring scan?*", "tableTitle": "The 6 Currencies — Situational Scan vs. Stage-Verdict Trap", "tableHead": ["Currency", "What They Scan For Now", "Friction Reaction", "Role / Context Look-Alike", "Stage-Verdict Trap (Avoid)"], "tableRows": [["Advantage", "Leverage, who wins, what to get or defend.", "Attack (escalate, threaten, test limits).", "Lawyer or procurement buyer protecting downside risk.", "'He's an Opportunist.'"], ["Approval", "Belonging, warmth, agreement, whether you're upset.", "Fold (apologize, soften, concede early).", "New hire or guest following high-context politeness.", "'She's stuck in Diplomat.'"], ["Accuracy", "Precision, craft, procedure, spotting errors.", "Debate (cite data, policy, technicalities).", "Auditor, surgeon, or interpreter whose craft requires exactness.", "'He's a rigid Expert.'"], ["Results", "Goals, timelines, ROI, fastest path to yes.", "Pivot (accept no, ask for options/workarounds).", "Someone short on time with a hard 2 PM deadline.", "'She's just an Achiever.'"], ["Context", "Multiple frames, how you see it, underlying views.", "Reframe / Pause (question premise, resist 1 answer).", "Researcher or mediator gathering all sides.", "'They're a Pluralist.'"], ["Pattern", "Dynamics between people, shared purpose, alignment.", "Meta-Inquire (name dynamic, invite mutual adjustment).", "Someone using corporate 'systems' buzzwords without inquiry.", "'He's a Strategist.'"]], "officeEx": "A finance lead flags two minor rounding discrepancies on your deck and cites GAAP policy. Rather than filing him under \"rigid Expert,\" you log a clean, temporary currency read: \"Working read: scanning for Accuracy in this meeting (likely role-driven + Q4 audit pressure). Opening move: lead with exact numbers and methodology before asking for flexibility.\"", "personalEx": "After rescheduling dinner, a friend asks twice, \"Are you sure you're not mad?\" and defers on every restaurant choice. You read the active wind—scanning for Approval and reassurance right now—and meet it with care: explicitly reassure them you're completely good, then invite what they actually crave.", "nonEx": "Walking out of one ten-minute vendor call and jotting down \"Classic Opportunist—only respects leverage.\" You just collapsed a temporary bargaining posture into a permanent verdict on a human being.", "decisionRule": "Use verb-only currency reads strictly to choose your opening register (Office) or care move (Personal), and **abort the read the instant a stage noun or a flicker of quiet superiority enters your head**. Now that you have a tentative working read, Tuesday exposes the hidden trap inside your very next sentence: *how testing a read can accidentally manufacture the behavior you expected to find.*", "handoff": "Populate the **Working Read**, **Confidence**, and **Role Filter** fields on your Five Hypothesis Cards on Friday (pulling directly from your B1 Baseline Cards via the Golden Thread pills) using verb-only currency language.", "layer3Title": "Optional Deepening · Robert Kegan & Lisa Lahey (How the Way We Talk)", "layer3Body": "Why is slipping into a stage verdict so seductive? Robert Kegan and Lisa Lahey call it **\"the super vision assumption\"**—the tacit belief that *my* perspective holds *\"the one and only correct view of the situation.\"* Once that unchecked assumption locks in, *\"our unchecked assumption that we are right remains intact by our interpreting things out there in a way that is consistent with our being right.\"* Every pushback gets re-filed as proof of your label, sealing off real learning completely.", "deepNote": {"label": "Center of Gravity vs. Trailing Edge Under Friction (Rungs 1 & 5)", "body": "Cook-Greuter's Center of Gravity describes how a person makes meaning when safe and resourced; their Trailing Edge is the earlier logic recruited when pressure spikes. Because B2 watches how people react when denied what they want, you are often watching a high-capacity colleague temporarily drop into *Accuracy* under audit heat—never proof of their overall developmental center."}}, {"day": "Tuesday · Part 2", "author": "Mark Snyder & William Swann", "title": "How We Test Our Reads About People", "lens": "Snyder & Swann (1978) on *Confirmatory Hypothesis Testing* and Snyder, Tanke, & Berscheid (1977) on *Behavioral Confirmation*. Tested social psychology showing that an observer's expectation does not sit passively outside the interaction—it actively bends the room.", "mechanism": "Suppose Monday's read leaves you suspecting a senior peer scans for *Advantage* or *Accuracy*. If you walk into Tuesday's meeting carrying that guess unchecked, your expectation behaves like **a magnet held next to a compass needle**. Snyder and Swann demonstrated that when people test a hunch about someone, they instinctively choose *confirming* questions—and subtly shift their own posture, warmth, and cadence in ways that pull out the exact behavior they anticipated (**Behavioral Confirmation**). You brace for *Advantage*, your voice turns guarded, they mirror your guardedness, and you walk out congratulating yourself on how sharply you read them.\n\nLater research (Trope & Bassok; Neuberg) identified the two countermeasures that remove the magnet: **(1) Accuracy Motivation**—caring more about getting the person right than proving your first hunch clever—and **(2) a pre-written Falsifier**. Before your second contact, write one concrete *If-Then* test where an unexpected result is just as easy to spot as a confirming one (e.g., offering a clearly labeled rough draft to a suspected *Accuracy*-scanner to see whether they engage the big idea without nitpicking). Crucially, in the personal dojo, never manufacture a fake problem or fake \"no\" to test someone; a fabricated stress test is a covert tactic in both dojos.", "tableTitle": "Confirming vs. Diagnostic (Falsifiable) Checks Across All 6 Currencies", "tableHead": ["Working Read", "Confirming Check (Weak)", "Diagnostic / Disconfirming Check (Could Fail)", "Personal-Dojo Safe Version (No Fake Tests)"], "tableRows": [["Advantage", "Notice every time they negotiate hard.", "Offer a transparent, mutually fair option and see if they engage without squeezing extra concessions.", "Notice how they react when YOU win — celebrate or one-up?"], ["Approval", "Notice when they nod or say 'totally.'", "State a mild, honest differing opinion on a low-stakes topic and see if they hold their view.", "State your real preference first (W5) and see if they voice a different one."], ["Accuracy", "Notice every detail correction.", "Share a rough brainstorm explicitly labeled 'rough draft' and see if they engage the big idea.", "Share a messy, half-formed story and see if they connect to feeling vs. correcting facts."], ["Results", "Notice timeline questions.", "Raise a brief relationship/values question and see if they slow down and engage.", "Propose an unstructured coffee with no agenda and watch if they relax into it."], ["Context", "Notice 'How do you see it?'", "Ask for a crisp decision on a simple choice and see if they commit cleanly.", "Ask 'What do you actually want to eat tonight?' and see if they name a clear preference."], ["Pattern", "Notice big-picture talk.", "Offer a gentle correction to their frame and see if they stay open to revising it.", "Notice if they can just laugh or vent without turning it into meta-analysis."]], "officeEx": "After one terse budget call, you suspect a peer scans for Advantage. Your falsifier: share a draft agenda inviting his input without bracing or guarding your turf. He replies with two shortcuts that save your team hours and asks nothing in return. Your falsifier fires cleanly—you revise Advantage -> Results.", "personalEx": "You guess a friend scans for Approval because they always say \"Whatever you want\" on dinner plans. Safe diagnostic check: \"I'm craving Thai, or we could do something totally different—what actually sounds good to you?\" They laugh and say, \"Honestly, I'm sick of Thai—let's get tacos.\" Your read updates on the spot.", "nonEx": "Asking a disguised leading question (\"You don't really care about the big picture as long as the spreadsheet balances, right?\") or walking in cold because you expect Advantage, thereby manufacturing the very defensiveness you log as proof.", "decisionRule": "Write a concrete falsifier on every Hypothesis Card **before** the second encounter, and never use a fake boundary or trap to run it. Yet even a clean, un-magnetized silent test hits a steep ceiling, which Wednesday puts in hard numbers: *how accurate are humans at reading each other without asking—and how do you check a read aloud without making the other person feel dissected?*", "handoff": "Complete the **Falsifier (\"What would change my mind\")** field on all Five Hypothesis Cards before marking any card ready to test.", "layer3Title": "Optional Deepening · David Bohm (On Dialogue)", "layer3Body": "Physicist David Bohm explains why silent assumptions derail human rooms so fast: *\"The thing that mostly gets in the way of dialogue is holding to assumptions and opinions, and defending them.\"* When two people *\"don't really know what the other person's assumption is, and they react according to what they think it is,\"* the other person *\"gets very puzzled and wonders: what is he doing? He reacts, and it all gets very muddled.\"* Your read is never a sterile measurement taken from behind glass—it is an active force inside the conversation.", "deepNote": {"label": "Behavioral Confirmation Loop & Question Contrast (Rungs 2 & 5)", "body": "Snyder's loop runs in three silent beats: *(1) Your expectation ('they scan for Advantage') -> (2) Your altered tone and questions (guarded, clipped) -> (3) Their reactive guardedness, which 'confirms' your guess.* Keep the three question shapes distinct: **Confirming** ('Which exact numbers are you worried might be off?'), **Diagnostic / Disconfirming** ('What matters most to you on this—exact numbers, speed, or how the team feels about it?'), and **Leading-Disconfirming Non-Example** ('You don't actually care about the big picture as long as the spreadsheet balances, right?')."}}, {"day": "Wednesday · Part 3", "author": "William Ickes", "title": "Empathic Accuracy and the Check-Back", "lens": "William Ickes's *Everyday Mind Reading* dyadic interaction paradigm (cited in David Brooks, *How to Know a Person*). Tested research benchmarking silent mind-reading against what the other person actually reports thinking and feeling.", "mechanism": "If Monday stripped away stage-typing and Tuesday stripped away self-fulfilling tests, Wednesday delivers the humbling benchmark that makes **checking back** non-negotiable. In Ickes's studies, strangers in a first conversation read each other accurately **only about 20% of the time**, close friends and family average **35%**, and even top natural readers plateau around **55%**—while people who score near zero believe they are just as accurate as the best readers. Worse still, long-married couples often grow *less* accurate over time because *\"they lock in some early version of who their spouse is, and over the years, as the other person changes, that version stays fixed.\"* Add **Motivated Inaccuracy**—our unconscious drop in accuracy whenever the truth feels threatening—and silent reading alone is a broken compass.\n\nThe upgrade is disarmingly simple: **score your read against the only reliable ground truth in the room—the other person's own account.** Use the **Tentative Check-Back Formula**: `[Softener: \"It sounds like…\"] + [Dignified Priority, never a flaw] + [3-second pause]`. When they correct you, resist any Expert urge to defend your summary; a correction is a **100% win** because it just traded a 35% guess for live reality. (Notice how this Check-Back becomes the foundation for **B4's 3-Beat Loop** and **B5's no-'I' Label**.)", "tableTitle": "Face-Safe Check-Back Scripts Across Currencies & Methods", "tableHead": ["Method", "How It Works", "Easy Currencies (Accuracy / Results)", "Sensitive Currencies (Advantage / Approval)", "Non-Example (Diagnosis)"], "tableRows": [["1. Tentative Label", "Name priority lightly + 3s pause.", "Accuracy: 'It sounds like getting the methodology airtight is the main thing here.'", "Advantage: 'It sounds like protecting your downside on this clause is non-negotiable.'", "'You're being nitpicky because you're an Expert.'"], ["2. Direct Question", "Ask plainly when stakes allow.", "Results: 'Is hitting the Friday launch the top priority for you on this?'", "Approval: 'I want to make sure we're actually aligned — does any part of this not sit right?'", "'Are you only agreeing because you want me to like you?'"], ["3. Watch & Wait", "Keep private when asking feels intrusive or tactical.", "Context: Note 'wanted multiple frames' -> observe if they ask for alternatives next time.", "Advantage (Office): Keep leverage read private; observe if they honor small agreements.", "Silently locking the verdict and never updating it."]], "officeEx": "A director fires rapid technical questions at your proposal. You guess Accuracy and run a face-safe check-back: \"It sounds like making sure the compliance numbers are bulletproof is the main priority here—am I reading that right?\" She pauses and replies, \"Actually, compliance is fine—I'm worried my VP will think we rushed the timeline.\" Five seconds upgraded a wrong guess into ground truth (Status / Results).", "personalEx": "A friend's energy drops after you suggest inviting a third person to dinner. You check back warmly: \"Hey, it felt like the energy shifted when I mentioned Alex—were you hoping for just a one-on-one catch-up tonight?\" They exhale: \"Honestly, yeah—it's been a rough week.\"", "nonEx": "Saying, \"I can tell you're scanning for approval right now—you don't have to people-please with me.\" Even if accurate, announcing a psychological label strips their face and turns a check-back into a diagnostic power move.", "decisionRule": "Use a **Tentative Label** or **Direct Question** whenever basic safety exists; switch to private **Watch & Wait** in low-trust, high-power office rooms where naming a sensitive currency (such as Advantage) would show your hand. Carry all three lenses into Thursday's **6-Quote Flash-Drill**, and into **B3**, where you drop beneath surface currencies to the submerged concerns and needs stabilizing their position.", "handoff": "Complete the **Check-Back & Outcome / Verdict** fields on your Five Hypothesis Cards on Friday and compute your hit rate. Against Ickes's 20–35% human baseline, hitting 2 out of 5 (40%) with honest revisions is mastery.", "layer3Title": "Optional Deepening · Sheila Heen (via Duhigg, Supercommunicators)", "layer3Body": "Sheila Heen (via Duhigg, *Supercommunicators*) identifies three purposes that keep a check-back respectful rather than intrusive: *(1)* helping the speaker clarify their own layered priorities, *(2)* helping the listener catch what they missed, and *(3)* proving care—demonstrating that you value the other person enough to work at getting them right.", "deepNote": {"label": "Content-Level Check-Backs When Feeling-Talk Is Taboo (Rung 6)", "body": "In cultures, families, or formal offices where naming emotions aloud feels clinical or intrusive, shift from affective check-backs to **Content-Level Priority Check-Backs**: verify what matters practically without naming an inner feeling ('So locking the delivery date before we discuss price is the main thing?' or 'Let me make sure I'm prioritizing the right piece for you')."}}], "prompt": "Think of two people from your B1 Baseline Cards. Write one verb-only currency guess, one Role Filter check, and one falsifiable 'what would change my mind' line before your next contact.", "orig": {"belt": "blue", "name": "Reading the currency", "lead": "Every person scans the conversation for something. Find out what it is by watching what they pay attention to, and how they react when they don't get it.", "teaching": [{"t": "h", "text": "Concepts"}, {"t": "steps", "items": [{"name": "Currencies (Synthesis, from the grid's Read row and the Concentric \"Utility vs. Approval filter\").", "md": "The Read signatures in the grid name what each stage tends to scan for. Treated as currencies, not stages:"}]}, {"t": "table", "head": ["Currency", "What it looks like in the first minutes", "Grid Read signature it echoes"], "rows": [["Advantage", "Cuts small talk; pivots fast to what they can get or must defend", "Opportunist: \"Reads for advantage\""], ["Approval", "Mirrors you heavily, checks your face, agrees with small things (\"totally\", \"me too\")", "Diplomat: \"Reads for approval\""], ["Accuracy", "Corrects small errors, even irrelevant ones; precision over flow", "Expert: \"Reads for errors\""], ["Results", "Asks about goals, timelines, decision drivers; wants the path to yes", "Achiever: \"Reads for interests\""], ["Context", "Asks how you see it, where you're coming from; resists a single answer", "Pluralist: \"Reads their frame\""], ["Pattern", "Names what is happening between people; asks about purpose", "Strategist: \"Reads the system\""]]}, {"t": "steps", "items": [{"name": "Natural friction is the best read.", "md": "People can show a later stage when comfortable and fall back when denied what they want (Curriculum). So the moment of friction tells you most. The original's four reactions to a no are a useful map of *reactions*, not of people: attack (escalate, threaten), fold (apologize, concede, go silent), debate (cite data and policy), pivot (accept the no and ask for alternatives)."}, {"name": "The office stress test, done honestly.", "md": "In negotiation, it is legitimate to set a small, real boundary early (decline a minor scheduling request you genuinely can't take) and watch the reaction. The test must be true; a fake no is a tactic."}, {"name": "The personal dojo has no stress test.", "md": "In friendship you read the friction that arrives on its own: a cancelled plan, a disagreement over where to eat. You read their reaction to learn how to care for them, not to sort them."}, {"name": "The hypothesis card.", "md": "Every read is written as a hypothesis with a confidence level and a disconfirming test:\n\n*Working read:* scans for accuracy; folds into debate under pressure. *Confidence:* medium. *Evidence:* corrected my date twice; cited policy when I said no to Friday. *What would change my mind:* if they accept a no without citing anything."}, {"name": "Check it back (Grid: Construct-Aware × Read, \"Hold the read lightly and loop it back to them to check\").", "md": "Wherever you can, test the read with them directly: \"It sounds like getting the numbers exactly right matters a lot here.\" Their answer tells you more than any sweep."}]}], "drill": "The hypothesis log. After two conversations a day, write one hypothesis card each. Revisit cards after the next contact with the same person and mark them right, wrong or revised.", "office": "Use the currency to choose your opening: precision for an accuracy-scanner, the path to the goal for a results-scanner, acknowledgement of leverage for an advantage-scanner.", "personal": "Use it to know what love looks like to this friend: accuracy-scanners feel cared for when you take their ideas seriously; approval-scanners when you show you are not upset with them.", "deliverable": {"name": "Five checked cards", "md": "Five hypothesis cards, each checked against later evidence or checked back directly, with your hit rate. A hit rate of two in five is a good start; the point is the habit of checking, not being right.\n\n**Watch for.** Locking a read. A card with no \"what would change my mind\" line is a verdict, not a read.", "tool": "hypothesis"}, "tools": ["hypothesis"], "deepened": {"original": "top", "parts": [{"n": 1, "title": "Part 1 · Cook-Greuter and Torbert: why a stage cannot be read in minutes", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Cook-Greuter's full lens card is W2 Part 2 and Torbert's is W2 Part 1. Here only one point matters: both measure a person's action logic or stage from many sentence completions scored by trained raters, and both describe a spread across several levels. That is why this module reads a currency, what a person scans for right now, and keeps any stage guess as a low-confidence hypothesis."}, {"t": "note", "label": "Why they are here", "md": "The currency table borrows the grid's Read signatures, which come from their stage descriptions. This part keeps the borrowing honest."}, {"t": "note", "label": "Native use", "md": "Developmental assessment and leadership coaching over time, not first-minute reading of strangers."}, {"t": "note", "label": "Limit", "md": "The currencies are this curriculum's synthesis, not Cook-Greuter's or Torbert's claim (label: interpretation). Their own measures say a person shows several levels at once; a currency read in one meeting says little about stage."}, {"t": "h", "text": "Currency versus stage"}, {"t": "table", "head": ["Question", "A currency read", "A stage read"], "rows": [["What it uses", "What they attend to and how they react to friction, in this meeting", "Many sentence completions, scored by a trained rater"], ["How fast", "Minutes", "Hours, plus scoring"], ["What it claims", "What they scan for now", "Their center of gravity across contexts"], ["How wrong it can be", "Often; check it back", "Less often, and still a spread"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "In your work, have you ever quietly \"typed\" a provider or a client after a few minutes? What label did you use?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: how do Cook-Greuter and Torbert find someone's stage, and why does that rule out a three-minute diagnosis?"}, {"name": "Make sense (rung 2).", "md": "Restate the difference between a currency and a stage. Give one example of a currency read and one non-example: a read that slips into a stage verdict."}, {"name": "Find it in your life (rung 3).", "md": "Write three people you have read quickly at work or in friendship: what they scanned for, and what you saw when they did not get it. Only then rate how often your currency guess held on a second meeting, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does assigning a stage give you, such as order, or a feeling of being above the fray? What does it cost the person you read?"}, {"name": "Connect (rung 5).", "md": "Which currency do you scan for yourself under pressure, given your W2 fallbacks? State it as a guess and name what would show it wrong. In your Orders Grid this sits on the depth axis and in Mind."}, {"name": "Argue (rung 6).", "md": "Is reading a currency just stage-typing with softer words? What would keep it from becoming that?"}, {"name": "Test (rung 7).", "md": "Write one currency read for a colleague before a meeting. Before the next contact, write what you predict they will attend to. Afterward, record what they actually asked about. Write what result would show the read was wrong."}, {"name": "Catch it live (rung 8).", "md": "What word in your head turns \"they scan for accuracy\" into \"they are an Expert\"?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your reads, your episodes or your ratings."}]}, {"n": 2, "title": "Part 2 · Snyder: how we test our reads about people", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "Mark Snyder, a social psychologist, and William Swann ran studies in the late 1970s showing that people asked to test a hypothesis about someone, for example that the person is an extravert, tend to choose questions that would confirm it. Snyder's related work on behavioral confirmation showed that expectations can draw out the very behavior expected. What is distinctive is that a read does not only describe a person; the way you check it can make it come true."}, {"t": "note", "label": "Why Snyder here", "md": "The hypothesis card asks \"what would change my mind.\" Snyder explains why that line is hard to write and easy to skip."}, {"t": "note", "label": "Native use", "md": "Laboratory studies of person perception, often with strangers and set questions."}, {"t": "note", "label": "Limit", "md": "Tested research, with later work showing the confirming tendency depends on the setting and can be reduced when people are motivated to be accurate (label: tested research, effect depends on conditions). Do not read it as \"all checking is biased\"; read it as \"design your check to be able to fail.\""}, {"t": "h", "text": "Confirming checks and disconfirming checks"}, {"t": "table", "head": ["Your read", "A confirming check", "A check that could fail"], "rows": [["\"Scans for accuracy\"", "Notice when they correct things", "Offer a rough draft and see whether they let it pass"], ["\"Scans for approval\"", "Notice when they agree", "Disagree lightly and see whether they hold their view"], ["\"Wants results\"", "Notice timeline questions", "Raise a relationship topic and see whether they engage"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "When have you asked a question in a way that guided the answer, in a session or in life?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what did Snyder and Swann find about how people test a guess about someone?"}, {"name": "Make sense (rung 2).", "md": "Write one confirming question and one disconfirming question for the same read. Then give a non-example: a \"disconfirming\" question that is really leading."}, {"name": "Find it in your life (rung 3).", "md": "Write three reads you held about people and how you checked them. Only then rate how often your checks could actually have failed, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does a confirmed read give you? What did you miss when you checked only one way?"}, {"name": "Connect (rung 5).", "md": "Does your expectation of a colleague draw out the behavior you expect? Think of one relationship. State it as a guess and name what would show it wrong. In your Orders Grid this sits in Mind and Heart with others."}, {"name": "Argue (rung 6).", "md": "Interpreters must not lead. Does that training protect you from confirming checks, or only in the booth? What would show the difference?"}, {"name": "Test (rung 7).", "md": "For your next three hypothesis cards, write the \"what would change my mind\" line as a concrete check you will run. Before you run it, predict the result. Afterward, record what happened. Write what result would show the cards are only confirming."}, {"name": "Catch it live (rung 8).", "md": "What do you feel when evidence starts to go against your read? Name it."}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your cards, your checks or your ratings."}]}, {"n": 3, "title": "Part 3 · Ickes: empathic accuracy and the check-back", "anchor": 3, "from": 4, "pre": [{"t": "note", "label": "Lens card", "md": "William Ickes, a social psychologist, developed a method to measure empathic accuracy: two people talk, watch the recording, each writes what they were thinking or feeling at each pause, and the other guesses. Accuracy can then be scored against what the person actually reported. His work found that people vary widely, that accuracy depends heavily on how readable the other person is, and that motivation and familiarity matter. What is distinctive is that a read is scored against the person's own report, which is exactly what a check-back does."}, {"t": "note", "label": "Why Ickes here", "md": "The module says to loop a read back to the person. Ickes shows why: the person's own account is the best measure available."}, {"t": "note", "label": "Native use", "md": "A laboratory paradigm for research on everyday mind reading, in strangers, friends and couples."}, {"t": "note", "label": "Limit", "md": "Tested research (label: tested research). Accuracy in the lab is measured against what people chose to write, which is itself a report. Asking someone directly can also change the conversation; in some settings a check-back is welcome, in others it feels intrusive."}, {"t": "h", "text": "Three ways to check a read"}, {"t": "table", "head": ["Method", "What it sounds like", "When it fits"], "rows": [["Tentative label", "\"It sounds like getting the numbers right matters a lot here.\"", "Most conversations; invites correction"], ["Direct question", "\"Is accuracy the main thing for you on this?\"", "When the stakes allow plain speech"], ["Watch and wait", "Note the read and see what happens next time", "When asking would feel like analysis"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "When did someone check their read of you, and how did it land?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: how does Ickes measure empathic accuracy, and what did he find shapes it?"}, {"name": "Make sense (rung 2).", "md": "Give one example of a check-back and one non-example: a statement that sounds like a check but announces a diagnosis."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you checked a read with someone, or could have. Only then rate how often the person's answer surprised you, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does not checking protect, such as the comfort of being right? What does checking cost?"}, {"name": "Connect (rung 5).", "md": "How does a check-back relate to the label in B5 and the loop in B4? State one guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "In a culture or relationship where naming feelings is not done, is a check-back respectful or intrusive? What would you do instead?"}, {"name": "Test (rung 7).", "md": "Check back two reads this week, one at work, one with a friend. Before each, predict whether they will confirm. Afterward, record their exact words. Write what result would show checking does not improve your reads."}, {"name": "Catch it live (rung 8).", "md": "What is the moment you decide not to ask? What tells you it is caution and not avoidance?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your reads, your episodes or your ratings."}]}], "connect": {"title": "Connect and argue: the three lenses side by side", "blocks": [{"t": "p", "md": "Everything in this section is Interpretation: my reading across the sources, to be tested against your episodes."}, {"t": "table", "head": ["Source", "Starts from", "Treats a read as", "Would worry that you..."], "rows": [["Cook-Greuter and Torbert", "Long assessment", "Far less than a stage", "Turn a currency into a type"], ["Snyder", "How we test guesses", "Something your check can bend", "Check only in confirming ways"], ["Ickes", "The person's own report", "A guess to be scored", "Never ask"]]}, {"t": "p", "md": "**Where they meet.** A read is a hypothesis; the best test is a check that could fail, and the best check is often the person's own answer."}, {"t": "p", "md": "**Where they collide.** Ickes favors asking; Blue Belt's office dojo sometimes keeps reads private. Asking gives accuracy; holding back keeps your cards close. The module's answer differs by dojo."}, {"t": "p", "md": "**What the three miss for you.** Checking a read in your second language, or across a power gap, carries its own risk; the sources say little about it."}, {"t": "p", "md": "**Where it sits in your own frameworks.** Mind and Heart with others, and the depth axis of your Orders Grid. In Kegan's terms, a read you can check is one you hold as object rather than look through. Return to this module later and add dated notes; do not overwrite."}]}, "research": {"title": "Research further: three threads to pick from", "blocks": [{"t": "p", "md": "These are gaps the sources left open. Replace them with your own questions whenever you have them."}, {"t": "table", "head": ["Thread", "Question it opens", "Why it connects", "Suggested depth"], "rows": [["1. Can empathic accuracy be trained?", "What does research say about improving empathic accuracy with feedback?", "Part 3 suggests checking helps; is there evidence?", "One thread, researched with the research-brief skill"], ["2. Confirmation in professional judgment", "How does confirmatory hypothesis testing show up in clinical or interviewing settings, and what reduces it?", "Your hypothesis cards are a professional tool", "One thread, with a critic pass"], ["3. Can stage be inferred from talk?", "Is there research on judging developmental level from conversation rather than from scored completions?", "Part 1 rules out quick stage reads", "Full deepening of Part 1"]]}], "prompt": "Use curriculum-module in deepen mode on Blue Belt B2, Part {part}, one thread. My question: {q}. Why it pulled me: {why}. What I already think: {think}. Verify sources with research-brief first, write into the part's Deepened section, and do not write my entries."}}}}, {"id": "B3", "num": 3, "title": "The Need Beneath the Position", "subtitle": "Translate demands into core concerns and interests — answer the need first, hold your boundary.", "guardrail": "Surveillance vs. Care: Never announce someone's need as an accusation ('You just need status'). Under the Transparency Test, only offer answers to needs that are genuinely true — and remember that answering a need is NOT giving in on your boundary.", "assembly": [{"day": "Mon", "step": "Part 1 · Fisher & Shapiro", "ingredient": "Five Core Concerns, Syntax Tells & Zero-Cost Levers"}, {"day": "Tue", "step": "Part 2 · Fisher, Ury & Patton", "ingredient": "Interests vs. Positions + Non-Accusatory Questions"}, {"day": "Wed", "step": "Part 3 · Chase Hughes", "ingredient": "All 6 Needs: Answer vs. Exploit vs. Announce + Honor & Hold"}, {"day": "Thu", "step": "Deliberate Practice Lab", "ingredient": "6-Scenario Position-to-Need Translation Trainer"}, {"day": "Fri", "step": "Deliverable Workshop", "ingredient": "Position-vs-Need Matrix (3 Stalled Conversations)"}], "parts": [{"day": "Monday · Part 1", "author": "Roger Fisher & Daniel Shapiro", "title": "Five Core Concerns", "lens": "*Beyond Reason: Using Emotions as You Negotiate* (2005). Practitioner negotiation theory demonstrating that instead of trying to decode dozens of fleeting emotions mid-argument, you can diagnose and generate positive emotional momentum through **five relational core concerns**: *Appreciation, Affiliation, Autonomy, Status,* and *Role*.", "mechanism": "Most deadlocks look technical above the waterline and feel inexplicable underneath. You bring clean spreadsheets, logical timelines, or fair compromises, and the other person digs in harder. Pushing bow-to-bow against their surface demand only scrapes paint; beneath the surface sits the **submerged keel** stabilizing their vessel. Fisher and Shapiro explain that an unmet core concern hits the nervous system like having your nose pushed underwater—until the person gets air, no rational argument can land. Rather than treating emotions as messy noise, *Beyond Reason* uses the five core concerns as both **a diagnostic lens** (spotting which relational nerve was trampled) and **five practical levers** for cooperation without psychologizing anyone.\n\nBecause core concerns are *relational*, they shift depending on who sits across the table. **Appreciation** clears through a three-step discipline (*understand their view -> find one genuine merit in it -> state that merit aloud without conceding your position*). **Affiliation** turns an adversary into a colleague through shared structural stakes or personal warmth. **Autonomy** stays intact through one simple habit: *always consult before deciding*. **Status** avoids zero-sum rank battles by honoring **Particular Status**—recognizing someone's specific domain craft or experience. **Role** invites them out of an adversarial box into a constructive function they actually want to inhabit.", "tableTitle": "The Five Core Concerns — Syntax Tells & Zero-Cost Levers", "tableHead": ["Core Concern", "Definition", "Syntax Tell (Trampled)", "How You Trample It", "Zero-Cost Lever (Meet It)"], "tableRows": [["1. Appreciation", "Valued recognition of thoughts, feelings, actions.", "'You didn't even read what I sent.' / 'You never ask what I think.'", "Dismissing, interrupting, jumping to rebuttal.", "3-step move: Understand -> find 1 real merit -> state it aloud without agreeing."], ["2. Affiliation", "Connectedness (structural = shared team; personal = warmth).", "'It feels like us vs. them.' / 'You only call when you need something.'", "Treating them as an adversary or keeping cold distance.", "Build structural ('both on the hook for Q3') or personal links."], ["3. Autonomy", "Freedom to affect or make decisions without imposition.", "'You went over my head.' / 'You already decided without me.'", "Telling them what to do, ultimatums, finished decisions.", "Always Consult Before Deciding; offer 2 bounded options."], ["4. Status", "Standing (social = rank; particular = domain expertise).", "'I've been doing this 15 years.' / 'Who authorized this?'", "Talking down, public correction, competing over smarts.", "Recognize their Particular Status (genuine craft or seniority)."], ["5. Role", "Having a fulfilling, meaningful part in the interaction.", "'I'm just a cog here.' / 'I feel like a rubber stamp.'", "Trivializing their job or boxing them into adversary.", "Co-define a constructive role ('devil's advocate on risk')."]], "officeEx": "A veteran manager blocks your new workflow (\"We've always done it this way\"). You spot trampled Particular Status and Autonomy beneath the rigid bow: \"Your controls are the exact reason we passed the last three audits cleanly [Particular Status + Appreciation]. Before I finalize any draft, I want your eye on which step would break under peak load [Autonomy].\"", "personalEx": "A friend snaps, \"You always just pick the restaurant and tell me where to show up.\" Hearing trampled Autonomy and Appreciation, you skip the efficiency defense: \"You're right—I booked it without checking with you, and I want nights out to feel like ours, not my schedule. Want to pick tonight, or trade off?\"", "nonEx": "Dropping hollow flattery (\"You're such a visionary leader!\") right before pushing an unfair deadline. Core-concern levers collapse into cynicism the instant they smell like a trick—the merit you name has to be real.", "decisionRule": "Run the five-concern scan proactively before high-stakes talks (especially your promotion conversation), and **stop the instant you catch yourself surrendering your actual boundary just to keep the emotional weather smooth.** Meeting a relational concern clears the emotional static—opening the door to Tuesday's practical layer: *uncovering the concrete constraints and goals hidden behind a rigid demand.*", "handoff": "Use these 5 rows to diagnose the **Underlying Core Concern** column of your Friday **Position-vs-Need Matrix**.", "layer3Title": "Optional Deepening · Donna Hicks (Dignity & Leading with Dignity)", "layer3Body": "Fisher and Shapiro frame the five concerns as negotiation levers; Donna Hicks anchors them in something deeper. Hicks separates **Dignity**—inherent birthright worth owed to every human being, *\"our highest common denominator\"*—from **Respect**, which is earned through action. Her elements map almost 1-to-1 onto the five concerns (*Appreciation -> Acknowledgment & Recognition; Affiliation -> Inclusion; Autonomy -> Independence; Status -> Acceptance of Identity & Fairness*), while warning against **False Dignity** (*\"the belief that our worthiness comes from external sources\"*). Holding Hicks beneath Fisher and Shapiro ensures you honor concerns because the person matters, never as slick leverage.", "deepNote": {"label": "Cultural Weighting of the Five Core Concerns (Rung 6)", "body": "All five concerns exist everywhere, but their relative weight shifts sharply across rooms and cultures. Low-context US offices typically weight individual *Autonomy* and *Role* highest; Latin American, Spanish, and high-hierarchy settings frequently weight *Affiliation* (*confianza*) and *Status* (dignity and standing) above unilateral autonomy. Calibrate which concern you honor first to the room's cultural floor."}}, {"day": "Tuesday · Part 2", "author": "Roger Fisher, William Ury & Bruce Patton", "title": "Interests Behind Positions", "lens": "*Getting to Yes* (1981/2011; practitioner negotiation theory, widely taught across business and diplomacy). Establishes the structural split between a **Position** (the rigid solution someone demands on the surface) and **Interests** (the underlying fears, constraints, and goals driving that demand).", "mechanism": "Two people arguing over positions are like two captains pushing bow-to-bow in a narrow channel: every inch one gains, the other loses. As Daniel Shapiro summarizes in *Negotiating the Nonnegotiable*, *\"While people's positions may be at loggerheads in a given conflict, their underlying interests tend to be much more compatible.\"* A rigid demand (\"12 months, take it or leave it\" or \"no title bump until next cycle\") is rarely an end in itself—it is simply the one solution the other person thought of to protect a hidden constraint.\n\nTo get beneath the waterline, run two diagnostic questions before you counter-argue: *(1) Why do they hold this position?* and *(2) Why have they NOT said yes to mine?*—mapping the exact political, budget, or face hurdle standing in their way. In live speech, strip out sharp \"Why?\" questions (which land like courtroom accusations) and replace them with \"What…\" or \"Help me understand…\" prompts, listening closely for the unguarded aside or the second sentence. Then sort both sides' interests into three buckets: **Shared** (what you both want), **Compatible / Dovetailing** (where you value different things cheaply traded), and **Conflicting** (true zero-sum trade-offs).", "tableTitle": "Position vs. Fake Interest vs. Real Interest (with Non-Accusatory Prompts)", "tableHead": ["Stated Position", "Fake Interest (Restated Position)", "Real Underlying Interest", "Non-Accusatory Question", "Dovetailing Answer"], "tableRows": [["'It has to be a 12-month contract.'", "'They want a shorter contract.'", "Fear of blame if performance drops in Year 2.", "'What's the biggest risk on your side past 12 months?'", "24-month deal with a 12-month review/exit clause."], ["'No title bump until next cycle.'", "'They want to keep my title.'", "HR band frozen until Q1; manager fears precedent.", "'What hurdle gets in the way of a promotion sooner?'", "Written criteria now + interim lead scope + Q1 effective date."], ["'We need a 10% discount.'", "'They want to pay less.'", "Buyer needs a visible 'win' to show their VP.", "'Help me understand what leadership needs to see.'", "Hold base rate; offer visible onboarding/terms concession."], ["'You never initiate anymore.'", "'They want me to text more.'", "Affiliation: feeling unchosen or low priority.", "'When I go quiet, what does that feel like on your end?'", "Name their priority explicitly + propose specific date."]], "officeEx": "In your promotion talk, your position is \"Promote me to Senior\" (interests: recognition, trajectory, compensation), while your manager's position is \"Budget is tight.\" Instead of arguing your output harder, you mine the constraint: \"Help me understand what constraints you're navigating with Q4 headcount so we can build a path that works for both of us.\" That reveals whether the real block is a temporary budget freeze or executive visibility—unlocking dovetailing options (written criteria now + interim lead scope + Q1 effective date).", "personalEx": "A friend insists, \"We have to leave by 6:00 sharp.\" Rather than debating \"6:30 is plenty of time,\" you ask, \"What makes 6:00 feel important for you tonight?\" They admit, \"I hate circling for parking and arriving stressed.\" Now you solve the stress interest (take transit at 6:15) instead of fighting over the clock.", "nonEx": "Restating a position in softer words and calling it an interest (\"Their interest is they don't want to work Friday\"), OR sharing your open vulnerabilities with a W4 covert aggressor bargaining in bad faith—handing them ammunition instead of building a deal.", "decisionRule": "Use interest-mining in collaborative negotiations, friendships, and bureaucracies; **stop and switch immediately back to White Belt W4/W6** (direct yes/no request + clean boundary) if the other side exploits your candor in bad faith. Yet even when you map both relational concerns (Monday) and practical interests (Tuesday), some people stay strangely rigid—leading directly to Wednesday's deepest submerged layer: *the unspoken social fears driving what someone needs others to confirm about them.*", "handoff": "Separate **Stated Position** from **Real Underlying Interest** across your 3 stalled conversations in Friday's Matrix, and write one non-accusatory \"What / Help me understand\" question for each.", "layer3Title": "Optional Deepening · Daniel Shapiro (Negotiating the Nonnegotiable)", "layer3Body": "Where does *Getting to Yes* hit a brick wall? Daniel Shapiro (*Negotiating the Nonnegotiable*) maps human conflict across three tiers: **Rationality** (logic and *interests*), **Emotionality** (the five *core concerns*), and **Identity**—a model he calls ***Homo identicus***. As Shapiro writes, *\"An emotionally charged conflict gets its 'charge' because it implicates fundamental aspects of your identity: who you are, what you hold as important, and how you conceive of meaning in your life. In other words, it threatens you.\"* Interest-dovetailing shines on Tier 1; the moment a dispute triggers Tier 3 identity threat, no clever option can land until you acknowledge and protect their identity first.", "deepNote": {"label": "3-Bucket Interest Sort & The 'Why Not?' Diagnostic (Rung 5)", "body": "Before any major negotiation, put your promotion or deal through the 3-bucket sort: *(1) Shared* (clean Q4 delivery, retaining a strong contributor), *(2) Compatible / Dovetailing* (you value title and trajectory; your manager values staying inside this quarter's cap), and *(3) Conflicting* (immediate base cash). Then run the 'Why Not?' check: name the exact political, budget, or face cost stopping them from saying yes today."}}, {"day": "Wednesday · Part 3", "author": "Chase Hughes", "title": "Needs as Fears, and Answering Without Exploiting", "lens": "*Six-Minute X-Ray* (2020; practitioner tradecraft, no independent empirical validation of the six-need taxonomy). Hughes maps six social needs—three Primary (*Significance, Approval, Acceptance*) and three Secondary (*Intelligence, Pity, Strength/Power*)—treating each not as a polite preference, but as a fear-driven craving leaking through everyday syntax.", "mechanism": "If Monday gave you relational levers and Tuesday gave you practical interests, Wednesday exposes the raw survival reflex sitting at the bottom of the keel. Hughes observes that what people need *from other people* reveals *\"some of our most secret fears.\"* One crucial correction: **\"Control\" is not on Hughes's map**—when someone appears driven by control, Fisher & Shapiro's *Autonomy* and Hughes's *Strength* cover it. And as Hughes notes of Strength-need speakers, they *\"don't need power. They need to FEEL powerful\"*—guarding against the fear of being dominated, disrespected, or publicly exposed as weak.\n\nIn Hughes's native tradecraft, spotting a fear-based need hands you a lever to steer someone. Blue Belt flips that lever under the **Transparency Test**: *If I told this person aloud why I just said that sentence, would it strengthen trust or break it?* You never **exploit** a need (such as flattery before a bad ask—W4 *Seduction*), and you never **announce** it as an accusation (\"You just need to feel important\"). Instead, run the **Honor + Hold Move**: `[1 honest, reality-anchored sentence answering the fear/need]. [Full Period.] [Your clean White Belt boundary or proposal].` Answering a need is never giving in—you honor their standing and hold your line in the same breath.", "tableTitle": "All 6 Hughes Needs — Fear, Speech Tell, and Answer vs. Exploit vs. Announce", "tableHead": ["Need", "Core Fear Guarded", "Speech Tell (6MX)", "Answering It (Passes Test)", "Exploiting It (Fails)", "Announcing It (Fails)"], "tableRows": [["1. Significance (Pri)", "Being ignored, feeling small, ridicule.", "'20 years in this industry...' / 'Only $80k...'", "Acknowledge genuine impact or contribution.", "Fake awe/flattery to extract a discount.", "'You just want to feel important.'"], ["2. Approval (Pri)", "Dismissal, disapproval, contempt.", "'I really suck at these...' / needless apologies.", "Give clear, honest reassurance & specific recognition.", "Withhold warmth so they over-give to earn it.", "'Stop fishing for compliments.'"], ["3. Acceptance (Pri)", "Exclusion, gossip, peer mismatch.", "'Friends blowing up my phone...' / 'Great fit.'", "Genuine inclusive language; welcome into shared work.", "Threaten exclusion ('Everyone else is on board').", "'You're just trying to fit in.'"], ["4. Intelligence (Sec)", "Being seen as dumb, questioned, called out.", "'Actually...' / 'Back at Harvard...' / 'Idiots...'", "Take their reasoning seriously; ask for analysis.", "Seduction (W4): praise brilliance before a bad ask.", "'You always have to be the smartest.'"], ["5. Pity (Sec)", "Being disregarded, misunderstood, disbelieved.", "'Sick all week...' / 'This traffic is ridiculous.'", "Confirm difficulty honestly + brief pause; don't rush to fix.", "Fake sympathy to create obligation.", "'You're playing the victim again.'"], ["6. Strength / Power (Sec)", "Being 'punked,' disrespected, dominated.", "Blunt declaratives, boasting defiance, louder tone.", "Respect agency; offer 2 real choices they control.", "Bait their pride into a fight to steer them.", "'You just need to feel powerful.'"]], "officeEx": "A Strength-need vendor issues an ultimatum: \"Take 12 months or we walk.\" You run Honor + Hold: \"You're the one owning this risk, and you should have the final call on term length [Honors Strength]. We can't do our 24-month rate on 12 months, so here are two 12-month structures—Option A at standard rate, or Option B with narrower scope. Which fits better? [Holds boundary].\"", "personalEx": "A Pity-need friend vents about a brutal week (\"Everything falls on me and nobody gets it\"). Jumping to a five-step fix makes them feel disbelieved and triggers escalation. Instead, you Answer + Pause: \"That sounds genuinely exhausting—carrying all of that alone all week is brutal.\" [Hold 2 silent beats without fixing.]", "nonEx": "Spotting a colleague's Intelligence need and saying, \"Honestly, you're the only one sharp enough to untangle this—could you absorb my Friday deadline?\" That is textbook W4 Seduction: it fails the Transparency Test the second you imagine explaining your motive aloud.", "decisionRule": "Use the six-need map to decode why someone's bow is locked rigid, and answer *only* with something genuinely true. **Stop the instant you feel a sneaky rush of 'I've got their lever'**—that sensation means you just crossed from answering into exploiting. Once you know *what* is trampled beneath a position, **B4** ensures your answer lands in the right conversational lane instead of bouncing off a lane mismatch.", "handoff": "Write one **Honor + Hold** sente
