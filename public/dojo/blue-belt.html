 arc (I-Thou outline, Option A).", "md": "Four stages: the spark (stranger to acquaintance), the escalation (acquaintance to friend), the stress test (the first rupture), the anchor (the confidant). Blue Belt covers the first two. Brown Belt covers the third and renovating old friendships. Black Belt covers the fourth."}, {"name": "The spark: warmth before competence.", "md": "Strangers triage you first for warmth (am I safe?) and then for competence (are you capable?). Leading with competence (intellect, credentials, unsolicited expertise) reads as threat or arrogance in social settings (Van Edwards, stub; the warmth/competence idea is widely used in social psychology). For you, leading with the interpreter's precision or the accountant's expertise is the trap; leading with genuine interest and an easy face is the move."}, {"name": "Start in the social conversation.", "md": "With strangers, open in the shared environment (\"that last set was brutal\"), not with deep questions yet (Duhigg's social conversation)."}, {"name": "Convergence.", "md": "People warm to those who match their pace, volume and formality a little (Giles, stub). This is the same baselining from B1, now used to adjust yourself slightly toward them."}, {"name": "The ping and pause (I-Thou outline, nuance 2).", "md": "To invite depth, offer one small, true, slightly more personal thing than the context needs (\"I've been feeling a bit burned out lately\"), then stop. That is a ping. If they pick it up and offer something back, the door is open. If they answer politely and move on, respect it and return to the shallows. Depth is always consented to, never extracted."}, {"name": "The calibrated reveal.", "md": "The ping is the first, smallest Reveal. Keep it \"processed\": something you have already worked through, so it does not ask them to carry you. Brown Belt teaches the full Reveal."}, {"name": "The escalation.", "md": "When pings are returned, move from what you did to how you feel about what you did. Ask \"how\" and \"why\" rather than \"what\". Then the invitation: propose a second meeting yourself, with a specific time and place."}, {"name": "The ceiling check, without judgment.", "md": "If someone cannot meet a ping, that is information about this relationship now, not a verdict on them. Life seasons change people's battery (the \"linear ladder myth\": friendships move up and down, not only up)."}, {"name": "State over script (I-Thou outline, nuance 3).", "md": "Scripts sound creepy if your inner state does not match. A slow, calm voice only works if you are calm. Use these tools to regulate your own care and attention, and trust the words to follow."}, {"name": "The one-conversation deep dive (I-Thou outline, Option B), with care.", "md": "In rare settings where both people want to skip small talk (a long coffee, a late conversation, a trip), you can move quickly: a processed reveal early, \"how and why\" questions, listening for core concerns, a callback to something they said early on. Use it only when both people are clearly in; used on someone who just wanted lunch, it is a boundary violation."}, {"name": "Cultural and neurodivergent checks (I-Thou outline, critique 4).", "md": "Eye contact, matched cadence and verbal processing of feelings are culturally specific and do not suit everyone. In high-context cultures, an early raw reveal can read as poor social judgment. With some autistic people, \"how do you feel about that?\" can create anxiety rather than closeness. Ask, adapt, and let people bond their way."}, {"name": "Presence-first cultures (Synthesis, from an earlier conversation).", "md": "US friendship is often activity-first; Spanish and Argentine friendship is often presence-first: sobremesa, the long table, showing up. For your move to Spain, \"go first\" may look less like proposing an activity and more like staying at the table, and returning to the same café, bar or class until you are a regular."}]}], "drill": "One initiation. One small act of going first each day: greet first, start a conversation, send the message you would usually wait to receive, propose the plan. Log it in one line.", "office": "Initiate one non-instrumental contact a week with a colleague (coffee with no agenda). The Achiever's Bond move from the grid: \"Spend time with someone with no agenda at all.\"", "personal": "Pick two acquaintances you would like to know better. Run the ping and pause once with each. Propose a specific second meeting to whoever returns the ping.", "deliverable": {"name": "The contact log", "md": "A log of initiations and pings: who, what you offered, what came back, what you did next. At least one escalation: a ping returned and a second meeting proposed by you.\n\n**Watch for.** Turning friendship into a project (the Achiever's Bond shadow). And the \"pick-up artist trap\": if a person senses a playbook, they will rightly pull back. If you notice you are running a sequence on someone, stop and simply be interested.", "tool": "contacts"}, "tools": ["contacts"], "deepened": {"original": "top", "parts": [{"n": 1, "title": "Part 1 · Fiske and Cuddy: warmth before competence", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Susan Fiske, Amy Cuddy and Peter Glick developed the stereotype content model, which proposes that people judge others on two main dimensions, warmth (good or ill intent) and competence (ability to act on it), and that warmth is judged first. Vanessa Van Edwards, whose book is a stub in your notebook, draws on this idea in popular advice. What is distinctive is the order: strangers ask \"are you safe?\" before \"are you capable?\""}, {"t": "note", "label": "Why Fiske and Cuddy here", "md": "The module's spark advice, lead with warmth and not expertise, rests on this research."}, {"t": "note", "label": "Native use", "md": "Research on how groups are stereotyped, later extended to impressions of individuals."}, {"t": "note", "label": "Limit", "md": "Tested research on group perception, extended to individuals (label: tested research, applied by extension). Van Edwards's advice is popular synthesis (stub). The claim that leading with competence reads as threat in social settings is a reasonable application, not a direct finding I checked."}, {"t": "h", "text": "Warmth and competence in a first meeting"}, {"t": "table", "head": ["You lead with", "What a stranger may hear first", "Better first move"], "rows": [["Credentials or expertise", "\"Is this person safe, or ranking me?\"", "Genuine interest in the shared moment"], ["A precise correction", "\"Will they judge me?\"", "Letting small errors pass"], ["An easy face and a question", "\"This person is safe.\"", "Then let competence show later"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "When you moved to a new city, what did you lead with when meeting people?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what are warmth and competence in this model, and why does order matter?"}, {"name": "Make sense (rung 2).", "md": "Write one warm opening line and one competence opening line for the same setting. Then a non-example: warmth that is really flattery."}, {"name": "Find it in your life (rung 3).", "md": "Write three first meetings in the last few months: how you opened and how it went. Only then rate how often you lead with competence, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does leading with expertise protect, given your W3 intelligence hook? What does it cost?"}, {"name": "Connect (rung 5).", "md": "In Spain, will warmth look different? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "For someone who has been doubted because of accent or race, is leading with warmth a risk? When might showing competence first protect you?"}, {"name": "Test (rung 7).", "md": "In two low-stakes first meetings, lead with one warm question and no credentials. Before you do, predict the response. Afterward, record what happened. Write what result would show competence would have worked better."}, {"name": "Catch it live (rung 8).", "md": "What is the moment you feel the pull to prove yourself?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your episodes, your lines or your ratings."}]}, {"n": 2, "title": "Part 2 · Epley and Boothby: we underestimate how much others like us", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Nicholas Epley and Juliana Schroeder found that people expect talking to strangers on a train to be unpleasant, yet report it as more pleasant than sitting alone. Erica Boothby, Gus Cooney, Gillian Sandstrom and Margaret Clark named the \"liking gap\": after a conversation, people underestimate how much the other person liked them. What is distinctive is that the barrier to going first is often a forecasting error, not real rejection."}, {"t": "note", "label": "Why Epley and Boothby here", "md": "This is Blue Belt's field module against waiting to be approached. The liking gap names a reason the wait feels safer than it is."}, {"t": "note", "label": "Native use", "md": "Experiments and field studies of conversation and social prediction."}, {"t": "note", "label": "Limit", "md": "Tested research (label: tested research), mostly with students and US or UK samples. It describes averages; some conversations really do go badly, and the gap may differ across cultures."}, {"t": "h", "text": "Forecast and reality"}, {"t": "table", "head": ["What people expect", "What the studies found"], "rows": [["Strangers do not want to talk", "Many were open to it"], ["The conversation will be awkward", "It was more pleasant than expected"], ["They did not like me much", "They liked me more than I thought"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "When did you wait to be approached and later learn the other person had wanted to talk to you?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what is the liking gap, and what did Epley and Schroeder find about strangers?"}, {"name": "Make sense (rung 2).", "md": "Give one example of a forecasting error about a conversation and one non-example: a well-founded caution."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you did not go first. For each, write what you predicted would happen. Only then rate how often your forecasts are too pessimistic, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does waiting protect for you? Where did you learn that waiting was safer? What does it cost?"}, {"name": "Connect (rung 5).", "md": "Does the liking gap feed your W3 big assumption? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with self."}, {"name": "Argue (rung 6).", "md": "Could the liking gap be smaller or larger in Argentine or Spanish social life? What would you need to know?"}, {"name": "Test (rung 7).", "md": "Do the daily initiation for five days. Before each, write a 0 to 10 forecast of how it will go. Afterward, rate how it went and note one outside data point, their words. Write what result would show your forecasts are accurate."}, {"name": "Catch it live (rung 8).", "md": "What sentence in your head says \"they probably don't want to\"?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your forecasts, your episodes or your ratings."}]}, {"n": 3, "title": "Part 3 · Aron: escalating disclosure and the ping", "anchor": 2, "from": 3, "pre": [{"t": "note", "label": "Lens card", "md": "Arthur Aron and colleagues created a procedure, often called the 36 questions, in which pairs of strangers take turns answering questions that grow gradually more personal. Pairs who did it reported feeling closer than pairs who made small talk. What is distinctive is the structure: disclosure that is mutual, sustained and escalating by small steps. The ping and pause in this module is a one-step version of that escalation, offered and then left to be returned or not."}, {"t": "note", "label": "Why Aron here", "md": "The module's ping and pause and the escalation stage are small, consented steps of mutual disclosure."}, {"t": "note", "label": "Native use", "md": "A laboratory procedure for generating closeness between strangers."}, {"t": "note", "label": "Limit", "md": "Tested research (label: tested research), in a structured setting where both people agreed to take part. In real life no one has agreed to the procedure, which is why the module insists on consent to depth."}, {"t": "h", "text": "Small steps of disclosure"}, {"t": "table", "head": ["Step", "Example", "What it asks of them"], "rows": [["Shared moment", "\"That last set was brutal.\"", "Nothing personal"], ["Small true thing", "\"I've been a bit burned out lately.\"", "A choice to match or not"], ["How and why", "\"How did you end up in this city?\"", "A story, if they want"], ["Invitation", "\"Coffee Thursday at the place on the corner?\"", "A yes or no"]]}], "prompts": [{"t": "steps", "items": [{"name": "Arrive (rung 0).", "md": "What is the smallest true thing you have ever said that changed a friendship?"}, {"name": "Meet the author (rung 1).", "md": "In your own words: what did Aron's procedure do, and why does it work in the lab?"}, {"name": "Make sense (rung 2).", "md": "Write one ping at the right size for a gym acquaintance, and a non-example: a ping that asks them to carry you."}, {"name": "Find it in your life (rung 3).", "md": "Write three times you offered a ping, or held one back. Only then rate how often you go first with disclosure, with a *because of episode…* line."}, {"name": "What it does (rung 4).", "md": "What does holding back protect? What does it cost the friendships you want?"}, {"name": "Connect (rung 5).", "md": "How does a ping relate to the clean no in W5, both being small acts of visibility? State a guess and what would show it wrong. In your Orders Grid this sits in Heart with others."}, {"name": "Argue (rung 6).", "md": "In high-context cultures an early reveal can read as poor judgment. Where in Spain would a ping land well, and where would it not?"}, {"name": "Test (rung 7).", "md": "Run the ping and pause with two acquaintances. Before each, predict whether they will return it. Afterward, record their words and what you did next. Write what result would show pings do not work in your settings."}, {"name": "Catch it live (rung 8).", "md": "What do you feel in the pause after a ping, before they answer?"}]}, {"t": "p", "md": "Claude may label an example as \"not yours,\" ask a follow-up or push back. Claude does not write your pings, your episodes or your ratings."}]}], "connect": {"title": "Connect and argue: the three lenses side by side", "blocks": [{"t": "p", "md": "Everything in this section is Interpretation: my reading across the sources, to be tested against your episodes."}, {"t": "table", "head": ["Source", "Starts from", "Treats going first as", "Would worry that you..."], "rows": [["Fiske and Cuddy", "How strangers judge", "Showing warmth before ability", "Lead with credentials"], ["Epley and Boothby", "What we predict", "Safer than it feels", "Trust your pessimistic forecast"], ["Aron", "How closeness grows", "Mutual, escalating, consented steps", "Skip steps, or never take the first"]]}, {"t": "p", "md": "**Where they meet.** Going first is small, warm and repeated; closeness grows in steps, and the fear of the first step is usually larger than the risk."}, {"t": "p", "md": "**Where they collide.** Aron's procedure escalates by design; the module's validity of the shallows says not every connection should escalate. Consent decides."}, {"t": "p", "md": "**What the three miss for you.** Presence-first friendship, in Spain and Argentina, grows by showing up more than by disclosure. None of the three studies sobremesa."}, {"t": "p", "md": "**Where it sits in your own frameworks.** Heart with others and Heart with self in your Orders Grid, and the start of the I-Thou track's Layer 2. Return to this module later and add dated notes; do not overwrite."}]}, "research": {"title": "Research further: three threads to pick from", "blocks": [{"t": "p", "md": "These are gaps the sources left open. Replace them with your own questions whenever you have them."}, {"t": "table", "head": ["Thread", "Question it opens", "Why it connects", "Suggested depth"], "rows": [["1. Friendship formation across cultures", "How do friendships form in Spain compared with the US, and what research exists?", "Your move", "One thread, researched with the research-brief skill"], ["2. The liking gap across cultures", "Has the liking gap been tested outside the US and UK?", "Part 2's samples are narrow", "One thread, with a critic pass"], ["3. How many hours make a friend", "What does research say about time spent together and friendship formation?", "The presence-first idea", "Full deepening of Part 3"]]}], "prompt": "Use curriculum-module in deepen mode on Blue Belt B6, Part {part}, one thread. My question: {q}. Why it pulled me: {why}. What I already think: {think}. Verify sources with research-brief first, write into the part's Deepened section, and do not write my entries."}}}}], "hiddenNeeds": [{"id": "significance", "name": "Significance", "fear": "guards against being ignored or feeling small", "src": "Hughes"}, {"id": "approval", "name": "Approval", "fear": "guards against disapproval", "src": "Hughes"}, {"id": "acceptance", "name": "Acceptance", "fear": "guards against not belonging", "src": "Hughes"}, {"id": "intelligence", "name": "Intelligence", "fear": "guards against being seen as dumb", "src": "Hughes"}, {"id": "pity", "name": "Pity", "fear": "guards against being disbelieved", "src": "Hughes"}, {"id": "strength", "name": "Strength / power", "fear": "guards against being disrespected or dominated", "src": "Hughes"}, {"id": "appreciation", "name": "Appreciation", "fear": "are my thoughts and feelings understood and valued?", "src": "Fisher and Shapiro"}, {"id": "affiliation", "name": "Affiliation", "fear": "am I treated as a colleague or an adversary?", "src": "Fisher and Shapiro"}, {"id": "autonomy", "name": "Autonomy", "fear": "is my freedom to decide respected?", "src": "Fisher and Shapiro"}, {"id": "status", "name": "Status", "fear": "is my standing acknowledged?", "src": "Fisher and Shapiro"}, {"id": "role", "name": "Role", "fear": "do I have a meaningful role here?", "src": "Fisher and Shapiro"}], "gridCols": [{"k": "read", "n": "Read", "es": "Leer", "q": "What is actually happening, in them, in me, between us?"}, {"k": "bond", "n": "Bond", "es": "Vincular", "q": "Do they feel met?"}], "gridUse": {"intro": "The grid is not studied daily. It is used in four ways.", "uses": [{"name": "Placement at the start of each belt.", "md": "Before beginning a belt, mark \"You, today\" in that belt's columns, using evidence from your last debriefs, not your self-image. The rule from Cook-Greuter applies: everybody's responses spread across at least three levels (Source: Nine Levels p. 7). So mark three things per column: your **home base** (where you usually operate when resourced), your **fallback** (where you go under pressure), and your **edge** (where you sometimes reach)."}, {"name": "The weekly look.", "md": "Once a week (a cadence, not a deadline), read your encounter-loop entries and mark, for each one, which cell you actually operated from. Over time the marks show your real distribution."}, {"name": "The Move as a drill.", "md": "Each cell's Move is a ready-made micro-practice. When a belt's module is native to you, use the Move of the cell one row above your home base as your daily drill instead."}, {"name": "The Shadow as a warning light.", "md": "Before any hard conversation, read the Shadow of your home base and your fallback in the column you will need most. That is your most likely failure."}], "cautions": [{"name": "Read the behavior, not the type.", "md": "The grid describes how each stage tends to show up in each function. It is a map of patterns, not a sorting hat for people. White Belt's rule governs every belt: label the move, not the person. Polished Achievers use tactics; frightened people of any stage can look aggressive."}, {"name": "Stages are not fixed.", "md": "A person's \"center of gravity\" is what they reliably use without special support (Source: Nine Levels pp. 7–8), and under stress everybody falls to a trailing edge (Source: Nine Levels p. 8). Both you and the people you read move around the grid within a single conversation."}, {"name": "Higher is not better at everything.", "md": "Every row has a Gift. The Expert's precision and the Diplomat's warmth are real skills a Strategist still needs. The curriculum's \"conscious downgrade\" is the right attitude: you choose a stage's tool on purpose rather than being run by its reflex."}], "preconvNote": "The Opportunist row now stands for the whole pre-conventional stage (everything before the Diplomat), but its cells were written for the Opportunist sub-band, as a fallback, not as anyone's home base."}, "gridFooter": {"translationStrip": "Before you close any sheet, run the move through three cultures. How does it land in a low-context US setting, in Argentine and Rioplatense culture, and in Spain? Then the Bridges check: which intercultural stage am I construing this from, and is Reversal hiding in my judgment?", "readingRows": ["Stage names follow Cook-Greuter; the second name and power type follow Torbert's action logics.", "The Bridges line is an approximate match to Bennett's intercultural stages, inferred, not stated by either author.", "Opportunist sits at the edge: useful to recognize, rarely a home base."], "whereFrom": "Cells are drafts written from the full books in your notebook (Torbert, Bennett, Hughes, Simon, Voss, Fisher & Shapiro, Shapiro, Duhigg, Brooks, Tannen, Brown & Levinson, Goffman, Pavlenko, Kegan & Lahey). Page anchors are the notebook's; check them before quoting.", "fields": [["Gift", "what this stage does well"], ["Shadow", "how it fails, including its dark side"], ["Tell", "how you recognize it, in yourself or others"], ["Move", "one practice that develops it"]]}, "sanctuaryJournalFields": [{"k": "happened", "label": "What happened between us"}, {"k": "layer", "label": "Which layer it touched, and which armor showed up"}, {"k": "marker", "label": "The marker, if there was one"}], "hooksTool": {"id": "hooks", "name": "Hook profile", "started": "White W3", "grows": "Blue B3, Black Bk5", "holds": "Your top needs, vulnerabilities, immunity map", "single": true, "fields": [{"k": "needs", "label": "Needs, ranked", "hint": "significance · approval · acceptance · intelligence · pity · strength — strongest pull first"}, {"k": "vulns", "label": "Simon's five, rated 1–5", "hint": "naivety · over-conscientiousness · low self-confidence · over-intellectualizing · emotional dependency"}, {"k": "topVuln", "label": "Highest-rated vulnerability", "hint": ""}]}}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('dojo-data').textContent);
  const KEY = 'dojo_blue_belt_v4';

  const defaultState = () => ({
    theme: 'light',
    dialect: 'office_us',
    tab: 'OVERVIEW',
    dayTab: { B1:0, B2:0, B3:0, B4:0, B5:0, B6:0 },
    rungIdx: {},
    rungNotes: {},
    checks: {},
    notes: {},
    researchDraft: {},
    evidence: { baselines:0, checked:0, labels:0, matched:0, initiations:0, pings:0 },
    b1Cards: [],
    b2Cards: [],
    b3Matrix: [],
    b4Loops: [],
    b5Audits: { office:'', personal:'', b1:'', b2:'', b3:'' },
    b6Log: [],
    gridMarks: {},
    sanctuaryJournal: [],
    w3Hooks: { needs:'', vulns:'', topVuln:'' },
    p6: { selected: null, hidden: false },
    capstone: { t1:false, t2:false, t3:false, debrief:'' },
    gauntlet: { passed: false, scores: {} }
  });

  let state = defaultState();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem('dojo_blue_belt_v3') || 'null');
    if (saved) state = Object.assign(defaultState(), saved);
  } catch(e){}

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  function esc(s){
    return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function mdInline(s){
    let out = esc(s);
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\*(.+?)\*/g, '<em>$1</em>');
    out = out.replace(/\n\n/g, '<br><br>');
    out = out.replace(/\n/g, '<br>');
    return out;
  }

  function renderBlocks(blocks){
    if (!Array.isArray(blocks)) return '';
    return blocks.map(b => {
      if (b.t === 'h') return `<h3 style="margin-top:12px">${esc(b.text)}</h3>`;
      if (b.t === 'p') return `<p>${mdInline(b.md)}</p>`;
      if (b.t === 'note') return `<div class="c-note"><span class="nlabel">${esc(b.label||'Note')}</span>${mdInline(b.md)}</div>`;
      if (b.t === 'safety') return `<div class="c-note warn"><span class="nlabel">${esc(b.label||'Safety')}</span>${mdInline(b.md)}</div>`;
      if (b.t === 'steps') return `<ul class="c-steps">${(b.items||[]).map(it=>`<li><strong>${esc(it.name)}</strong> ${mdInline(it.md)}</li>`).join('')}</ul>`;
      if (b.t === 'table') return `<div class="t-wrap"><table><thead><tr>${(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(b.rows||[]).map(r=>`<tr>${r.map((c,i)=>i===0?`<td><strong>${mdInline(c)}</strong></td>`:`<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      return '';
    }).join('');
  }

  function applyTheme(){
    document.documentElement.setAttribute('data-theme', state.theme === 'dark' ? 'dark' : 'light');
  }

  document.getElementById('belt-cols-line').textContent = `${DATA.beltMeta.columnsLine} · ${DATA.beltMeta.layerLine}`;

  function renderEvidence(){
    const grid = document.getElementById('ev-grid');
    let total = 0;
    grid.innerHTML = DATA.meta.evidenceCols.map(c => {
      const v = state.evidence[c.id] || 0;
      total += v;
      return `<div class="ev-chip"><span>${esc(c.label)}</span><span style="display:flex;align-items:center;gap:6px"><b>${v}</b><button data-ev="${c.id}">+1</button></span></div>`;
    }).join('');
    document.getElementById('ev-total').textContent = `${total} total reps logged`;
    grid.querySelectorAll('button[data-ev]').forEach(b => {
      b.onclick = () => { const id = b.getAttribute('data-ev'); state.evidence[id] = (state.evidence[id]||0)+1; save(); renderEvidence(); };
    });
  }

  function renderDialects(){
    const wrap = document.getElementById('dialect-btns');
    wrap.innerHTML = Object.entries(DATA.dialects).map(([k,d]) =>
      `<button class="c-btn quiet ${state.dialect===k?'active':''}" data-d="${k}" style="min-height:32px;padding:4px 10px;font-size:12.5px">${esc(d.label)}</button>`
    ).join('');
    document.getElementById('dialect-note').textContent = DATA.dialects[state.dialect].note;
    wrap.querySelectorAll('button[data-d]').forEach(b => {
      b.onclick = () => { state.dialect = b.getAttribute('data-d'); save(); renderDialects(); renderMain(); };
    });
  }

  function renderNav(){
    const nav = document.getElementById('week-nav');
    const items = [{ id:'OVERVIEW', label:'Overview & Grid' }]
      .concat(DATA.weeks.map(w => ({ id: w.id, label: `${w.id} · ${w.title.split('—')[0].trim()}` })))
      .concat([
        { id: 'TEST', label: state.gauntlet.passed ? '★ Test & Capstone' : 'Test & Capstone' },
        { id: 'PRINT', label: '1-Page Field Card' }
      ]);
    nav.innerHTML = items.map(it =>
      `<button class="${state.tab===it.id?'on':''}" data-tab="${it.id}">${esc(it.label)}</button>`
    ).join('');
    nav.querySelectorAll('button[data-tab]').forEach(b => {
      b.onclick = () => { state.tab = b.getAttribute('data-tab'); save(); renderNav(); renderMain(); window.scrollTo(0,0); };
    });
  }

  function renderOverview(){
    const bi = DATA.blueIntro;
    const s2 = DATA.sanctuaryLayer2;
    const mkBtns = (key) => {
      const cur = state.gridMarks[key] || [];
      return `<div class="gmark-row">${['Home','Fallback','Edge'].map(m =>
        `<button class="gmark-btn ${cur.includes(m)?'on':''}" data-gmark="${key}:${m}">${m}</button>`
      ).join('')}</div>`;
    };
    const rCol = DATA.gridCols.find(c=>c.k==='read') || {n:'Read',es:'Leer',q:''};

  function renderWeek(w){

      return `<div class="asm-step ${done?'done':''}">

        <strong class="small">${esc(a.step)}</strong>

      </div>`;
    }).join('');

    const dayLabels = ['Mon · Part 1','Tue · Part 2','Wed · Part 3','Connect & Research','Thu · Practice Lab','Fri · Deliverable'];

    return `

    const sB5 = document.getElementById('save-b5');
    if (sB5) sB5.onclick = () => {
      state.b5Audits = { office:document.getElementById('f-b5-off').value.trim(), personal:document.getElementById('f-b5-per').value.trim(), b1:document.getElementById('f-b5-b1').value.trim(), b2:document.getElementById('f-b5-b2').value.trim(), b3:document.getElementById('f-b5-b3').value.trim() };
      state.evidence.labels++; save(); renderEvidence(); alert('Saved B5 Audits & Boundaries!');
    };
    const sB6 = document.getElementById('save-b6');
    if (sB6) sB6.onclick = () => {
      const who = document.getElementById('f-b6-who').value.trim(); if (!who) return;
      const light = document.getElementById('f-b6-light').value;
      state.b6Log.push({ who, opener:document.getElementById('f-b6-open').value, light, forecast:document.getElementById('f-b6-fc').value, actual:document.getElementById('f-b6-ac').value, ping:document.getElementById('f-b6-ping').value.trim(), back:document.getElementById('f-b6-back').value.trim(), next:document.getElementById('f-b6-next').value.trim() });
      state.evidence.initiations++; if (light==='GREEN') state.evidence.pings++;
      save(); renderEvidence(); renderMain();
    };
    const gBtn = document.getElementById('btn-grade-gauntlet');
    if (gBtn) gBtn.onclick = () => {
      const ans = { g1:1, g2:1, g3:2, g4:0, g5:2 }; let score = 0;
      Object.keys(ans).forEach(k => { const sel = document.querySelector(`input[name="${k}"]:checked`); if (sel){ const v = Number(sel.value); state.gauntlet.scores[k]=v; if (v===ans[k]) score++; } });
      state.gauntlet.passed = (score===5); save(); renderNav();
      document.getElementById('gauntlet-fb').innerHTML = score===5 ? `<div class="c-note ok"><span class="nlabel">5/5 Passed!</span>Blue Belt Seal stamped!</div>` : `<div class="c-note warn"><span class="nlabel">${score}/5 Correct</span>Review any missed stage and try again.</div>`;
    };
  }

  function renderMain(){
    const main = document.getElementById('main-view');
    if (state.tab === 'OVERVIEW') main.innerHTML = renderOverview();
    else if (state.tab === 'TEST') main.innerHTML = renderGauntlet();
    else if (state.tab === 'PRINT') main.innerHTML = renderPrintable();
    else { const w = DATA.weeks.find(x => x.id === state.tab) || DATA.weeks[0]; main.innerHTML = renderWeek(w); }
    wireInteractions();
  }

  document.getElementById('pocket-front').innerHTML = `<div class="eyebrow">Blue Belt Pocket Card</div>` +
    DATA.meta.pocket.cues.map((c,i)=>`<div><strong style="font-family:var(--display);font-size:17px">${esc(c)}</strong><div class="small muted">${esc(DATA.meta.pocket.notes[i])}</div></div>`).join('');
  document.getElementById('pocket-back').innerHTML = `<div class="eyebrow">The Check Question</div><div style="font-family:var(--display);font-size:22px">${esc(DATA.meta.pocket.back)}</div>`;
  const modal = document.getElementById('pocket-modal');
  document.getElementById('btn-pocket').onclick = () => modal.classList.add('open');
  document.getElementById('btn-close-pocket').onclick = () => modal.classList.remove('open');
  modal.onclick = e => { if (e.target === modal) modal.classList.remove('open'); };
  document.getElementById('pocket-flip').onclick = () => document.getElementById('pocket-flip').classList.toggle('flipped');
  document.getElementById('btn-theme').onclick = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };

  function download(name, content, mime){
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type:mime})); a.download = name; a.click();
  }
  document.getElementById('btn-export-json').onclick = () => download('blue_belt_v4.2_backup.json', JSON.stringify(state, null, 2), 'application/json');
  document.getElementById('import-json').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { state = Object.assign(defaultState(), JSON.parse(r.result)); save(); applyTheme(); renderEvidence(); renderDialects(); renderNav(); renderMain(); alert('Backup imported!'); } catch(err){ alert('Invalid JSON file.'); } };
    r.readAsText(f);
  };
  document.getElementById('btn-export-md').onclick = () => {
    const lines = [
      '# Communication Dojo — Blue Belt Complete Field Log (v4.2 Final)',
      `Gauntlet Seal: ${state.gauntlet.passed ? 'EARNED' : 'In Progress'} | Capstone Tests: T1=${state.capstone.t1}, T2=${state.capstone.t2}, T3=${state.capstone.t3}`,
      '## Evidence Totals',
      ...DATA.meta.evidenceCols.map(c => `- ${c.label}: ${state.evidence[c.id]||0}`),
      '\n## B1 · Baseline Cards',
      ...state.b1Cards.map(c => `- **${c.person}** (${c.setting}): Posture=${c.posture}; Pace=${c.pace}; Gaze=${c.gaze}; Stress=${c.stress}; Display=${c.display}; My W1 Tell=${c.myTell}`),
      '\n## B2 · Hypothesis Cards',
      ...state.b2Cards.map(c => `- **${c.person}** [${c.currency} | ${c.conf} | ${c.verdict}] Evidence: ${c.evidence} | Falsifier: ${c.falsifier} | Outcome: ${c.outcome}`),
      '\n## B3 · Position-vs-Need Matrix',
      ...state.b3Matrix.map(m => `- **${m.context}** (${m.concern}) | Position: "${m.pos}" | Interest: ${m.interest} | Honor+Hold: ${m.answer}`),
      '\n## B4 · Five Loops',
      ...state.b4Loops.map(l => `- **${l.who}** [${l.type} | ${l.result}] Loop: "${l.loop}" | Reply: ${l.reply}`),
      '\n## B5 · Accusation Audits & Empathy Boundaries',
      `- Office Audit: ${state.b5Audits.office}`, `- Personal Audit: ${state.b5Audits.personal}`,
      `- Boundaries: 1) ${state.b5Audits.b1} | 2) ${state.b5Audits.b2} | 3) ${state.b5Audits.b3}`,
      '\n## B6 · Contact & Ping Log',
      ...state.b6Log.map(c => `- **${c.who}** [${c.opener} | ${c.light} | Forecast ${c.forecast} -> Actual ${c.actual}] Ping: ${c.ping} | Reply: ${c.back} | Next: ${c.next}`),
      '\n## Capstone Debrief', state.capstone.debrief || '(none)',
      '\n## 9-Rung Socratic Responses',
      ...Object.entries(state.rungNotes).filter(([,v])=>v.trim()).map(([k,v])=>`- **${k}:** ${v.trim()}`),
      '\n## Master Grid Marks (Read & Bond)',
      ...Object.entries(state.gridMarks).filter(([,v])=>v && v.length).map(([k,v])=>{
        const [col, idx] = k.split('_');
        const st = DATA.gridStages[Number(idx)];
        return `- **${st?st.n:idx} (${col==='r'?'Read':'Bond'}):** ${v.join(', ')}`;
      }),
      '\n## Sanctuary Layer 2 Journal',
      ...state.sanctuaryJournal.map(j=>`- **${j.date}** | Happened: ${j.happened} | Layer/Armor: ${j.layer} | Marker: ${j.marker||'—'}`),
      '\n## W3 Hook Profile Reference',
      `- Needs: ${state.w3Hooks.needs||'—'} | Vulns: ${state.w3Hooks.vulns||'—'} | Top Vuln: ${state.w3Hooks.topVuln||'—'}`,
      '\n## Part Field Notes',
      ...Object.entries(state.notes).filter(([,v])=>v.trim()).map(([k,v])=>`- **${k}:** ${v.trim()}`)
    ];
    download('blue_belt_complete_log.md', lines.join('\n'), 'text/markdown');
  };

  applyTheme(); renderEvidence(); renderDialects(); renderNav(); renderMain();
})();
</script>
</body>
</html>
